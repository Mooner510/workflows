name: Canonical Project CI

on:
  workflow_call:
    inputs:
      diff_base:
        description: Optional ancestor SHA used by explicit maintenance dispatches.
        required: false
        type: string
        default: ''
      force_all:
        description: Expand validation to all declared components and services.
        required: false
        type: boolean
        default: false
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional read-only token for declared private Go/Node dependencies.
        required: false

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and changes
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      components: ${{ steps.contract.outputs.components }}
      services: ${{ steps.contract.outputs.services }}
      go_private_patterns: ${{ steps.contract.outputs.go_private_patterns }}
      affected_components: ${{ steps.detect.outputs.all_components }}
      ci_targets: ${{ steps.detect.outputs.ci_targets }}
      ci_groups: ${{ steps.detect.outputs.ci_groups_by_target }}
      affected_services: ${{ steps.detect.outputs.affected_services }}
      git_log_opts: ${{ steps.detect.outputs.git_log_opts }}
      image_environment: ${{ steps.mode.outputs.environment }}
      image_required: ${{ steps.mode.outputs.image_required }}
      publish_required: ${{ steps.mode.outputs.publish_required }}
      deploy_development_required: ${{ steps.mode.outputs.deploy_development_required }}
      ci_required: ${{ steps.mode.outputs.ci_required }}
      security_required: ${{ steps.mode.outputs.security_required }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Load canonical project contract
        id: contract
        uses: Mooner510/workflows/.github/actions/config/load@v1

      - name: Detect affected components and services
        id: detect
        uses: Mooner510/workflows/.github/actions/ci/detect@v1
        with:
          components: ${{ steps.contract.outputs.components }}
          force_all: ${{ inputs.force_all }}
          diff_base: ${{ inputs.diff_base }}

      - name: Resolve branch execution mode
        id: mode
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          AFFECTED_SERVICES: ${{ steps.detect.outputs.affected_services }}
          CI_TARGETS: ${{ steps.detect.outputs.ci_targets }}
          HAS_CHANGES: ${{ steps.detect.outputs.has_changes }}
        run: |
          set -euo pipefail

          environment=""
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == "dev" ]]; then
              environment=dev
            elif [[ -n "$DEFAULT_BRANCH" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              environment=prod
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "dev" ]]; then
              environment=dev
            elif [[ -n "$DEFAULT_BRANCH" && "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
              environment=prod
            fi
          fi

          image_required=false
          if [[ -n "$environment" && "$(jq 'length' <<<"$AFFECTED_SERVICES")" -gt 0 ]]; then
            image_required=true
          fi

          publish_required=false
          deploy_development_required=false
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$image_required" == "true" ]]; then
              publish_required=true
              if [[ "$environment" == "dev" ]]; then
                deploy_development_required=true
              fi
            fi
          fi

          if [[ "$CI_TARGETS" == "[]" ]]; then ci_required=false; else ci_required=true; fi
          if [[ "$HAS_CHANGES" == "true" ]]; then security_required=true; else security_required=false; fi

          {
            echo "environment=$environment"
            echo "image_required=$image_required"
            echo "publish_required=$publish_required"
            echo "deploy_development_required=$deploy_development_required"
            echo "ci_required=$ci_required"
            echo "security_required=$security_required"
          } >>"$GITHUB_OUTPUT"

  security:
    name: Security
    needs: contract
    if: needs.contract.outputs.security_required == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Run security verification
        uses: Mooner510/workflows/.github/actions/ci/security@v1
        with:
          components: ${{ needs.contract.outputs.affected_components }}
          git_log_opts: ${{ needs.contract.outputs.git_log_opts }}

  ci:
    name: Component CI
    needs: contract
    if: needs.contract.outputs.ci_required == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.contract.outputs.ci_targets) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run component group CI
        uses: Mooner510/workflows/.github/actions/ci/group@v1
        with:
          components: ${{ toJSON(fromJSON(needs.contract.outputs.ci_groups)[matrix.target].components) }}
          type: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].type }}
          version: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].version }}
          package-manager: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].package_manager || '' }}
          build-tool: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].build_tool || '' }}
          profile: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].profile || '' }}
          go-private-patterns: ${{ needs.contract.outputs.go_private_patterns }}
          private-repo-token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

  images:
    name: Docker image verification
    needs: contract
    if: needs.contract.outputs.image_required == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.contract.outputs.affected_services) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select service contract
        id: service
        shell: bash
        env:
          SERVICES_JSON: ${{ needs.contract.outputs.services }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          service="$(jq -c --arg name "$SERVICE_NAME" '.[] | select(.name == $name)' <<<"$SERVICES_JSON")"
          [[ -n "$service" ]] || { echo "::error::Service '$SERVICE_NAME' is not declared."; exit 1; }
          echo "service=$service" >>"$GITHUB_OUTPUT"

      - name: Build and scan temporary image
        uses: Mooner510/workflows/.github/actions/cd/docker/prepare@v1
        with:
          service: ${{ steps.service.outputs.service }}
          environment: ${{ needs.contract.outputs.image_environment }}

  verify:
    name: Verification and publication
    needs: [contract, security, ci, images]
    if: always() && needs.contract.result == 'success'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10

    steps:
      - name: Require requested verification
        shell: bash
        env:
          SECURITY_REQUIRED: ${{ needs.contract.outputs.security_required }}
          CI_REQUIRED: ${{ needs.contract.outputs.ci_required }}
          IMAGE_REQUIRED: ${{ needs.contract.outputs.image_required }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CI_RESULT: ${{ needs.ci.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_REQUIRED" == "true" && "$SECURITY_RESULT" != "success" ]]; then
            echo "::error::Security verification did not succeed ($SECURITY_RESULT)."
            exit 1
          fi
          if [[ "$CI_REQUIRED" == "true" && "$CI_RESULT" != "success" ]]; then
            echo "::error::Language/migration CI did not succeed ($CI_RESULT)."
            exit 1
          fi
          if [[ "$IMAGE_REQUIRED" == "true" && "$IMAGE_RESULT" != "success" ]]; then
            echo "::error::Docker build/image scan did not succeed ($IMAGE_RESULT)."
            exit 1
          fi

      - name: Publish canonical revision tags
        if: needs.contract.outputs.publish_required == 'true'
        uses: Mooner510/workflows/.github/actions/cd/docker/finalize@v1
        with:
          services: ${{ needs.contract.outputs.services }}
          affected-services: ${{ needs.contract.outputs.affected_services }}
          environment: ${{ needs.contract.outputs.image_environment }}
          operation: finalize

      - name: Remove run-scoped temporary tags
        if: always() && needs.contract.outputs.image_required == 'true'
        uses: Mooner510/workflows/.github/actions/cd/docker/finalize@v1
        with:
          services: ${{ needs.contract.outputs.services }}
          affected-services: ${{ needs.contract.outputs.affected_services }}
          environment: ${{ needs.contract.outputs.image_environment }}
          operation: cleanup

  deploy-development:
    name: Development deployment
    needs: [contract, verify]
    if: needs.verify.result == 'success' && needs.contract.outputs.deploy_development_required == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.contract.outputs.affected_services) }}

    steps:
      - name: Checkout exact verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select service contract
        id: service
        shell: bash
        env:
          SERVICES_JSON: ${{ needs.contract.outputs.services }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          service="$(jq -c --arg name "$SERVICE_NAME" '.[] | select(.name == $name)' <<<"$SERVICES_JSON")"
          [[ -n "$service" ]] || { echo "::error::Service '$SERVICE_NAME' is not declared."; exit 1; }
          echo "service=$service" >>"$GITHUB_OUTPUT"

      - name: Deploy verified development service
        uses: Mooner510/workflows/.github/actions/cd/service@v1
        with:
          service: ${{ steps.service.outputs.service }}
          components: ${{ needs.contract.outputs.components }}
          environment: dev
          operation: deploy
