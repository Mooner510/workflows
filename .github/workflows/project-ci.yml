name: Canonical Project CI

on:
  workflow_call:
    inputs:
      diff_base:
        description: Optional ancestor SHA used by explicit maintenance dispatches.
        required: false
        type: string
        default: ''
      force_all:
        description: Expand validation to all declared components and services.
        required: false
        type: boolean
        default: false
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional read-only token for declared private Go/Node dependencies.
        required: false

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: [self-hosted, linux, "gharp-contract-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    outputs:
      components: ${{ steps.contract.outputs.components }}
      services: ${{ steps.contract.outputs.services }}
      artifacts: ${{ steps.contract.outputs.artifacts }}
      go_private_patterns: ${{ steps.contract.outputs.go_private_patterns }}
      affected_components: ${{ steps.detect.outputs.all_components }}
      ci_targets: ${{ steps.detect.outputs.ci_targets }}
      ci_groups: ${{ steps.detect.outputs.ci_groups_by_target }}
      affected_services: ${{ steps.detect.outputs.affected_services }}
      affected_artifacts: ${{ steps.detect.outputs.affected_artifacts }}
      image_services: ${{ steps.mode.outputs.image_services }}
      git_log_opts: ${{ steps.detect.outputs.git_log_opts }}
      image_environment: ${{ steps.mode.outputs.environment }}
      image_required: ${{ steps.mode.outputs.image_required }}
      promotion_required: ${{ steps.mode.outputs.promotion_required }}
      artifact_names: ${{ steps.mode.outputs.artifact_names }}
      artifact_required: ${{ steps.mode.outputs.artifact_required }}
      ci_required: ${{ steps.mode.outputs.ci_required }}
      security_required: ${{ steps.mode.outputs.security_required }}

    steps:
      - name: Enforce trusted self-hosted execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" != "pull_request_target" ]] || {
            echo "::error::pull_request_target is not allowed on the self-hosted runner."
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Fork pull requests are not allowed on the self-hosted runner."
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Load canonical project contract
        id: contract
        uses: Mooner510/workflows/.github/actions/config/load@v1

      - name: Detect affected components and services
        id: detect
        uses: Mooner510/workflows/.github/actions/ci/detect@v1
        with:
          components: ${{ steps.contract.outputs.components }}
          artifacts: ${{ steps.contract.outputs.artifacts }}
          force_all: ${{ inputs.force_all }}
          diff_base: ${{ inputs.diff_base }}

      - name: Resolve branch execution mode
        id: mode
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          AFFECTED_SERVICES: ${{ steps.detect.outputs.affected_services }}
          AFFECTED_ARTIFACTS: ${{ steps.detect.outputs.affected_artifacts }}
          SERVICES_JSON: ${{ steps.contract.outputs.services }}
          ARTIFACTS_JSON: ${{ steps.contract.outputs.artifacts }}
          CI_TARGETS: ${{ steps.detect.outputs.ci_targets }}
          HAS_CHANGES: ${{ steps.detect.outputs.has_changes }}
        run: |
          set -euo pipefail

          environment=""
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == "dev" ]]; then
              environment=dev
            elif [[ -n "$DEFAULT_BRANCH" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              environment=prod
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "dev" ]]; then
              environment=dev
            elif [[ -n "$DEFAULT_BRANCH" && "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
              environment=prod
            fi
          fi

          image_services="$AFFECTED_SERVICES"
          if [[ "$EVENT_NAME" == "push" && "$environment" == "prod" ]]; then
            image_services="$(jq -c '[.[].name]' <<<"$SERVICES_JSON")"
          fi

          image_required=false
          if [[ -n "$environment" && "$(jq 'length' <<<"$image_services")" -gt 0 ]]; then
            image_required=true
          fi

          promotion_required=false
          if [[ "$EVENT_NAME" == "push" && -n "$environment" && "$image_required" == "true" ]]; then
            promotion_required=true
          fi

          artifact_names="$AFFECTED_ARTIFACTS"
          if [[ "$EVENT_NAME" == "push" && -n "$DEFAULT_BRANCH" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            artifact_names="$(jq -c '[.[].name]' <<<"$ARTIFACTS_JSON")"
          fi

          artifact_required=false
          if [[ -n "$environment" && "$(jq 'length' <<<"$artifact_names")" -gt 0 ]]; then
            artifact_required=true
          fi

          if [[ "$CI_TARGETS" == "[]" ]]; then ci_required=false; else ci_required=true; fi
          if [[ "$HAS_CHANGES" == "true" ]]; then security_required=true; else security_required=false; fi

          {
            echo "environment=$environment"
            echo "image_required=$image_required"
            echo "image_services=$image_services"
            echo "promotion_required=$promotion_required"
            echo "artifact_names=$artifact_names"
            echo "artifact_required=$artifact_required"
            echo "ci_required=$ci_required"
            echo "security_required=$security_required"
          } >>"$GITHUB_OUTPUT"

  security:
    name: Security
    needs: contract
    if: needs.contract.outputs.security_required == 'true'
    runs-on: [self-hosted, linux, "gharp-security-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 30
    steps:
      - name: Run security verification
        uses: Mooner510/workflows/.github/actions/ci/security@v1
        with:
          components: ${{ needs.contract.outputs.affected_components }}
          git_log_opts: ${{ needs.contract.outputs.git_log_opts }}
          go_private_patterns: ${{ needs.contract.outputs.go_private_patterns }}
          private_repo_token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

  ci:
    name: ${{ matrix.target }}
    needs: contract
    if: needs.contract.outputs.ci_required == 'true'
    runs-on: [self-hosted, linux, "gharp-ci-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.contract.outputs.ci_targets) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run component group CI
        uses: Mooner510/workflows/.github/actions/ci/group@v1
        with:
          components: ${{ toJSON(fromJSON(needs.contract.outputs.ci_groups)[matrix.target].components) }}
          type: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].type }}
          version: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].version }}
          package-manager: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].package_manager || '' }}
          build-tool: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].build_tool || '' }}
          profile: ${{ fromJSON(needs.contract.outputs.ci_groups)[matrix.target].profile || '' }}
          go-private-patterns: ${{ needs.contract.outputs.go_private_patterns }}
          private-repo-token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

  images:
    name: Docker (${{ matrix.service }})
    needs: contract
    if: needs.contract.outputs.image_required == 'true'
    runs-on: [self-hosted, linux, "gharp-image-${{ github.run_id }}-${{ github.run_attempt }}", "${{ needs.contract.outputs.promotion_required == 'true' && format('gharp-service-{0}', matrix.service) || format('gharp-scratch-{0}', matrix.service) }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.contract.outputs.image_services) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select service contract
        id: service
        shell: bash
        env:
          SERVICES_JSON: ${{ needs.contract.outputs.services }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          service="$(jq -c --arg name "$SERVICE_NAME" '.[] | select(.name == $name)' <<<"$SERVICES_JSON")"
          [[ -n "$service" ]] || { echo "::error::Service '$SERVICE_NAME' is not declared."; exit 1; }
          echo "service=$service" >>"$GITHUB_OUTPUT"

      - name: Build and scan temporary image
        id: prepare
        uses: Mooner510/workflows/.github/actions/cd/docker/prepare@v1
        with:
          service: ${{ steps.service.outputs.service }}
          environment: ${{ needs.contract.outputs.image_environment }}
          private-repo-token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

      - name: Package trusted deployment handoff
        if: needs.contract.outputs.promotion_required == 'true'
        id: package
        uses: Mooner510/workflows/.github/actions/cd/artifact@v1
        with:
          service: ${{ steps.service.outputs.service }}
          components: ${{ needs.contract.outputs.components }}
          environment: ${{ needs.contract.outputs.image_environment }}
          artifact-path: ${{ steps.prepare.outputs.artifact-path }}
          manifest-digest: ${{ steps.prepare.outputs.manifest-digest }}
          config-digest: ${{ steps.prepare.outputs.config-digest }}
          exposed-port: ${{ steps.prepare.outputs.exposed-port }}

  artifacts:
    name: OCI Artifact (${{ matrix.artifact }})
    needs: contract
    if: needs.contract.outputs.artifact_required == 'true'
    runs-on: [self-hosted, linux, "gharp-artifact-${{ github.run_id }}-${{ github.run_attempt }}", "gharp-scratch-${{ matrix.artifact }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.contract.outputs.artifact_names) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select artifact contract
        id: artifact
        shell: bash
        env:
          ARTIFACTS_JSON: ${{ needs.contract.outputs.artifacts }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          artifact="$(jq -c --arg name "$ARTIFACT_NAME" '.[] | select(.name == $name)' <<<"$ARTIFACTS_JSON")"
          [[ -n "$artifact" ]] || { echo "::error::Artifact '$ARTIFACT_NAME' is not declared."; exit 1; }
          echo "artifact=$artifact" >>"$GITHUB_OUTPUT"

      - name: Build and scan CI-only OCI artifact
        id: build
        uses: Mooner510/workflows/.github/actions/ci/oci-artifact@v1
        with:
          artifact: ${{ steps.artifact.outputs.artifact }}
          private-repo-token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

  verify:
    name: Verify
    needs: [contract, security, ci, images, artifacts]
    if: always() && needs.contract.result == 'success'
    runs-on: [self-hosted, linux, "gharp-verify-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10

    steps:
      - name: Require requested verification
        shell: bash
        env:
          SECURITY_REQUIRED: ${{ needs.contract.outputs.security_required }}
          CI_REQUIRED: ${{ needs.contract.outputs.ci_required }}
          IMAGE_REQUIRED: ${{ needs.contract.outputs.image_required }}
          ARTIFACT_REQUIRED: ${{ needs.contract.outputs.artifact_required }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CI_RESULT: ${{ needs.ci.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
          ARTIFACT_RESULT: ${{ needs.artifacts.result }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_REQUIRED" == "true" && "$SECURITY_RESULT" != "success" ]]; then
            echo "::error::Security verification did not succeed ($SECURITY_RESULT)."
            exit 1
          fi
          if [[ "$CI_REQUIRED" == "true" && "$CI_RESULT" != "success" ]]; then
            echo "::error::Language/migration CI did not succeed ($CI_RESULT)."
            exit 1
          fi
          if [[ "$IMAGE_REQUIRED" == "true" && "$IMAGE_RESULT" != "success" ]]; then
            echo "::error::Docker build/image scan did not succeed ($IMAGE_RESULT)."
            exit 1
          fi
          if [[ "$ARTIFACT_REQUIRED" == "true" && "$ARTIFACT_RESULT" != "success" ]]; then
            echo "::error::CI-only OCI artifact build/scan did not succeed ($ARTIFACT_RESULT)."
            exit 1
          fi

      - name: Confirm trusted promotion handoff
        if: needs.contract.outputs.promotion_required == 'true'
        shell: bash
        run: echo "Required image jobs materialized their job-scoped local handoff bundles."

