name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      components:
        description: JSON array describing repository components.
        required: true
        type: string
      force_all:
        description: Run all configured components without change detection.
        required: false
        type: boolean
        default: false
      diff_base:
        description: Optional ancestor SHA for explicit maintenance CI dispatches.
        required: false
        type: string
        default: ''
      go_private_patterns:
        description: Optional GOPRIVATE pattern for private Go modules.
        required: false
        type: string
        default: ''
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional GitHub token with read access to private repository dependencies used by Go or Node components.
        required: false
    outputs:
      changed_components:
        description: JSON array of normalized affected components.
        value: ${{ jobs.detect.outputs.all_components }}
      affected_services:
        description: JSON array of logical deploy service names affected by the selected components.
        value: ${{ jobs.detect.outputs.affected_services }}
      has_changes:
        description: Whether at least one configured component changed.
        value: ${{ jobs.detect.outputs.has_changes }}

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: [self-hosted, linux, "gharp-detect-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10

    outputs:
      all_components: ${{ steps.detect.outputs.all_components }}
      ci_targets: ${{ steps.detect.outputs.ci_targets }}
      ci_groups_by_target: ${{ steps.detect.outputs.ci_groups_by_target }}
      affected_services: ${{ steps.detect.outputs.affected_services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      git_log_opts: ${{ steps.detect.outputs.git_log_opts }}

    steps:
      - name: Enforce trusted self-hosted execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" != "pull_request_target" ]] || {
            echo "::error::pull_request_target is not allowed on the self-hosted runner."
            exit 1
          }
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Fork pull requests are not allowed on the self-hosted runner."
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect affected components and services
        id: detect
        uses: Mooner510/workflows/.github/actions/ci/detect@v1
        with:
          components: ${{ inputs.components }}
          force_all: ${{ inputs.force_all }}
          diff_base: ${{ inputs.diff_base }}

  security:
    name: Security
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [self-hosted, linux, "gharp-security-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 30
    steps:
      - name: Run security verification
        uses: Mooner510/workflows/.github/actions/ci/security@v1
        with:
          components: ${{ needs.detect.outputs.all_components }}
          git_log_opts: ${{ needs.detect.outputs.git_log_opts }}

  ci:
    name: CI - ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.ci_targets != '[]'
    runs-on: [self-hosted, linux, "gharp-ci-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.ci_targets) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run component group CI
        uses: Mooner510/workflows/.github/actions/ci/group@v1
        with:
          components: ${{ toJSON(fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].components) }}
          type: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].type }}
          version: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].version }}
          package-manager: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].package_manager || '' }}
          build-tool: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].build_tool || '' }}
          profile: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].profile || '' }}
          go-private-patterns: ${{ inputs.go_private_patterns }}
          private-repo-token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}
