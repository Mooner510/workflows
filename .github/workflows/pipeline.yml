name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      components:
        description: JSON array describing repository components.
        required: true
        type: string
      force_all:
        description: Run all configured components without change detection.
        required: false
        type: boolean
        default: false
      go_private_patterns:
        description: Optional GOPRIVATE pattern for private Go modules.
        required: false
        type: string
        default: ''
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional GitHub token with read access to private Go module repositories.
        required: false
    outputs:
      changed_components:
        description: JSON array of changed components.
        value: ${{ jobs.detect.outputs.all_components }}
      has_changes:
        description: Whether at least one configured component changed.
        value: ${{ jobs.detect.outputs.has_changes }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: [self-hosted, linux]
    timeout-minutes: 10

    outputs:
      all_components: ${{ steps.detect.outputs.all_components }}
      ci_targets: ${{ steps.detect.outputs.ci_targets }}
      ci_groups_by_target: ${{ steps.detect.outputs.ci_groups_by_target }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      git_log_opts: ${{ steps.detect.outputs.git_log_opts }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate configuration and detect affected components
        id: detect
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
          FORCE_ALL: ${{ inputs.force_all }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          command -v git >/dev/null || { echo "::error::git is required on the self-hosted runner."; exit 1; }
          command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }

          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          duplicate_names="$(jq -r 'group_by(.name)[] | select(length > 1) | .[0].name' <<<"$components")"
          if [[ -n "$duplicate_names" ]]; then
            echo "::error::Component names must be unique: ${duplicate_names//$'\n'/, }"
            exit 1
          fi

          workspace="$(realpath "$GITHUB_WORKSPACE")"

          validate_relative_path() {
            local value="$1"
            local label="$2"
            if [[ -z "$value" ]] || [[ "$value" == /* ]] || [[ "$value" == *$'\n'* ]] || [[ "$value" == *$'\r'* ]]; then
              echo "::error::$label must be a non-empty repository-relative path."
              exit 1
            fi
            if [[ "$value" == ".." || "$value" == ../* || "$value" == */../* || "$value" == */.. ]]; then
              echo "::error::$label must not contain '..' path traversal."
              exit 1
            fi
          }

          count="$(jq 'length' <<<"$components")"
          for ((i = 0; i < count; i++)); do
            component="$(jq -c ".[$i]" <<<"$components")"
            name="$(jq -r '.name // empty' <<<"$component")"
            type="$(jq -r '.type // empty' <<<"$component")"
            path="$(jq -r '.path // empty' <<<"$component")"

            if [[ "$(jq 'type' <<<"$component")" != '"object"' ]]; then
              echo "::error::Every components entry must be an object."
              exit 1
            fi
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid component name '$name'."
              exit 1
            fi
            case "$type" in
              go|node|android) ;;
              *) echo "::error::Component '$name' has unsupported type '$type'."; exit 1 ;;
            esac

            validate_relative_path "$path" "Component '$name' path"
            resolved="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
            if [[ -z "$resolved" ]] || { [[ "$resolved" != "$workspace" ]] && [[ "$resolved" != "$workspace/"* ]]; }; then
              echo "::error::Component '$name' path '$path' does not resolve inside the repository."
              exit 1
            fi

            if ! jq -e '(.watch == null) or ((.watch | type) == "array" and all(.watch[]; type == "string"))' <<<"$component" >/dev/null; then
              echo "::error::Component '$name' watch must be an array of repository-relative path strings."
              exit 1
            fi
            if ! jq -e '(.watch_path == null) or ((.watch_path | type) == "boolean")' <<<"$component" >/dev/null; then
              echo "::error::Component '$name' watch_path must be boolean when set."
              exit 1
            fi
            while IFS= read -r watch; do
              validate_relative_path "$watch" "Component '$name' watch entry"
            done < <(jq -r '.watch // [] | .[]' <<<"$component")

            if [[ "$(jq -r '.watch_path // true' <<<"$component")" == "false" ]] && [[ "$(jq '.watch // [] | length' <<<"$component")" -eq 0 ]]; then
              echo "::error::Component '$name' must define at least one watch entry when watch_path is false."
              exit 1
            fi
          done

          force_all=false
          changed_file_list="$(mktemp)"
          trap 'rm -f "$changed_file_list"' EXIT
          git_log_opts="--all"

          if [[ "$FORCE_ALL" == "true" ]]; then
            force_all=true
            echo "force_all=true: every configured component is affected."
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$HEAD_SHA"
            git cat-file -e "${base_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$base_sha"
            git cat-file -e "${head_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$head_sha"
            merge_base="$(git merge-base "$base_sha" "$head_sha")"
            git diff --name-only --no-renames --diff-filter=ACMRD "$merge_base" "$head_sha" >"$changed_file_list"
            git_log_opts="${merge_base}..${head_sha}"
          elif [[ "$EVENT_NAME" == "push" ]] && [[ -n "${PUSH_BEFORE_SHA:-}" ]] && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$PUSH_BEFORE_SHA"
            git diff --name-only --no-renames --diff-filter=ACMRD "$PUSH_BEFORE_SHA" "$HEAD_SHA" >"$changed_file_list"
            git_log_opts="${PUSH_BEFORE_SHA}..${HEAD_SHA}"
          else
            force_all=true
            echo "No reliable diff base for event '$EVENT_NAME'; every configured component is affected."
          fi

          if [[ "$force_all" != "true" ]]; then
            echo "Changed files:"
            [[ -s "$changed_file_list" ]] && sed 's/^/  - /' "$changed_file_list" || echo "  (none)"
          fi

          selected='[]'
          for ((i = 0; i < count; i++)); do
            component="$(jq -c ".[$i]" <<<"$components")"
            name="$(jq -r '.name' <<<"$component")"
            affected="$force_all"

            if [[ "$affected" != "true" ]]; then
              while IFS= read -r changed; do
                if [[ "$changed" == ".github/workflows/"* || "$changed" == ".github/actions/"* ]]; then
                  affected=true
                  break
                fi

                while IFS= read -r watch; do
                  watch="${watch%/}"
                  if [[ "$watch" == "." ]] || [[ "$changed" == "$watch" ]] || [[ "$changed" == "$watch/"* ]]; then
                    affected=true
                    break 2
                  fi
                done < <(jq -r '((if (.watch_path // true) then [.path] else [] end) + (.watch // [])) | unique | .[]' <<<"$component")
              done <"$changed_file_list"
            fi

            if [[ "$affected" == "true" ]]; then
              selected="$(jq -c --argjson component "$component" '. + [$component]' <<<"$selected")"
              echo "Affected: $name ($(jq -r '.path' <<<"$component"))"
            fi
          done

          ci_groups="$(jq -c '
            [
              (map(select(.type == "go"))
                | group_by(.go_version // "stable")[]
                | {
                    target: ("Go " + (.[0].go_version // "stable")),
                    type: "go",
                    version: (.[0].go_version // "stable"),
                    components: .
                  }),
              (map(select(.type == "node"))
                | group_by(.node_version // "24")[]
                | {
                    target: ("Node " + (.[0].node_version // "24")),
                    type: "node",
                    version: (.[0].node_version // "24"),
                    components: .
                  }),
              (map(select(.type == "android"))
                | group_by(.java_version // "17")[]
                | {
                    target: ("Android Java " + (.[0].java_version // "17")),
                    type: "android",
                    version: (.[0].java_version // "17"),
                    components: .
                  })
            ]
          ' <<<"$selected")"

          ci_targets="$(jq -c 'map(.target)' <<<"$ci_groups")"
          ci_groups_by_target="$(jq -c 'reduce .[] as $group ({}; .[$group.target] = $group)' <<<"$ci_groups")"

          if [[ "$(jq 'length' <<<"$selected")" -gt 0 ]]; then
            has_changes=true
          else
            has_changes=false
          fi

          {
            echo "all_components=$selected"
            echo "ci_targets=$ci_targets"
            echo "ci_groups_by_target=$ci_groups_by_target"
            echo "has_changes=$has_changes"
            echo "git_log_opts=$git_log_opts"
          } >>"$GITHUB_OUTPUT"

  security:
    name: Security
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    uses: ./.github/workflows/security.yml
    with:
      components: ${{ needs.detect.outputs.all_components }}
      git_log_opts: ${{ needs.detect.outputs.git_log_opts }}

  ci:
    name: CI
    needs: detect
    if: needs.detect.outputs.ci_targets != '[]'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.ci_targets) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Go CI
        if: fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].type == 'go'
        uses: $/.github/actions/ci-go
        with:
          components: ${{ toJSON(fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].components) }}
          version: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].version }}
          go_private_patterns: ${{ inputs.go_private_patterns }}
          private_repo_token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

      - name: Node CI
        if: fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].type == 'node'
        uses: $/.github/actions/ci-node
        with:
          components: ${{ toJSON(fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].components) }}
          version: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].version }}

      - name: Android CI
        if: fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].type == 'android'
        uses: $/.github/actions/ci-android
        with:
          components: ${{ toJSON(fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].components) }}
          version: ${{ fromJSON(needs.detect.outputs.ci_groups_by_target)[matrix.target].version }}
