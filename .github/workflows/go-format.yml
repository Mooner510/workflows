name: Go Format

run-name: Go Format · ${{ inputs.branch || github.ref_name }} · ${{ inputs.path }}

on:
  workflow_call:
    inputs:
      branch:
        description: Target branch. Empty uses the branch selected by the caller.
        required: false
        type: string
        default: ''
      path:
        description: Repository-relative directory to format. / formats the whole repository.
        required: false
        type: string
        default: /
  workflow_dispatch:
    inputs:
      branch:
        description: Target branch. Empty uses the branch selected in the workflow UI.
        required: false
        type: string
        default: ''
      path:
        description: Repository-relative directory to format. / formats the whole repository.
        required: false
        type: string
        default: /

permissions:
  contents: write

concurrency:
  group: go-format-${{ github.repository }}-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Format Go files
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ inputs.branch }}
          EVENT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          branch="${REQUESTED_BRANCH:-$EVENT_BRANCH}"
          branch="${branch#refs/heads/}"

          if [[ -z "$branch" || "$branch" == "HEAD" ]]; then
            echo "::error::A valid target branch is required."
            exit 1
          fi

          if ! git check-ref-format --branch "$branch" >/dev/null 2>&1; then
            echo "::error::Invalid branch name: $branch"
            exit 1
          fi

          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Format, commit, and push
        shell: bash
        env:
          FORMAT_PATH: ${{ inputs.path }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail

          command -v gofmt >/dev/null || { echo "::error::gofmt is required."; exit 1; }
          command -v realpath >/dev/null || { echo "::error::realpath is required on the self-hosted runner."; exit 1; }

          workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          raw_path="${FORMAT_PATH:-/}"

          if [[ "$raw_path" == "/" ]]; then
            relative_path="."
          else
            relative_path="${raw_path#/}"
            relative_path="${relative_path%/}"
            [[ -n "$relative_path" ]] || relative_path="."
          fi

          target="$(realpath -e "$workspace/$relative_path" 2>/dev/null || true)"
          if [[ -z "$target" || ! -d "$target" ]]; then
            echo "::error::Format path does not exist or is not a directory: $raw_path"
            exit 1
          fi

          if [[ "$target" != "$workspace" && "$target" != "$workspace/"* ]]; then
            echo "::error::Format path must resolve inside the repository: $raw_path"
            exit 1
          fi

          target_relative="$(realpath --relative-to="$workspace" "$target")"
          if [[ "$target_relative" == "." ]]; then
            display_path="/"
          else
            display_path="/$target_relative"
          fi

          mapfile -d '' go_files < <(find "$target" -type f -name '*.go' -print0 | sort -z)

          if (( ${#go_files[@]} == 0 )); then
            echo "No Go files found under $display_path."
            {
              echo "### Go Format"
              echo
              echo "- Branch: \`$TARGET_BRANCH\`"
              echo "- Path: \`$display_path\`"
              echo "- Result: no Go files found"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s\0' "${go_files[@]}" | xargs -0 -r -n 100 gofmt -w

          for file in "${go_files[@]}"; do
            git add -- "$file"
          done

          if git diff --cached --quiet; then
            echo "All Go files under $display_path are already formatted."
            {
              echo "### Go Format"
              echo
              echo "- Branch: \`$TARGET_BRANCH\`"
              echo "- Path: \`$display_path\`"
              echo "- Files scanned: \`${#go_files[@]}\`"
              echo "- Result: no changes"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply gofmt"
          commit_sha="$(git rev-parse HEAD)"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          {
            echo "### Go Format"
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Path: \`$display_path\`"
            echo "- Files scanned: \`${#go_files[@]}\`"
            echo "- Files changed: \`$changed_count\`"
            echo "- Commit: \`$commit_sha\`"
          } >>"$GITHUB_STEP_SUMMARY"
