name: Go Format

run-name: Go Format · ${{ github.ref_name }} · ${{ inputs.path }}

on:
  workflow_call:
    inputs:
      path:
        description: Repository-relative directory to format. / formats the whole repository.
        required: false
        type: string
        default: /
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional GitHub token with read access to private Go module repositories.
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: go-format-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Format, push, and verify Go
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, "gharp-format-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 45

    steps:
      - name: Validate target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_BRANCH" || "$TARGET_BRANCH" == "HEAD" ]]; then
            echo "::error::Run this workflow from a branch."
            exit 1
          fi
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null

      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Load canonical project contract
        id: contract
        uses: Mooner510/workflows/.github/actions/config/load@v1

      - name: Set up Go for formatting
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Apply gofmt and go mod tidy
        id: format
        shell: bash
        env:
          FORMAT_PATH: ${{ inputs.path }}
          TARGET_BRANCH: ${{ github.ref_name }}
          CI_PRIVATE_REPO_TOKEN: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}
          GOPRIVATE: ${{ steps.contract.outputs.go_private_patterns }}
          GONOSUMDB: ${{ steps.contract.outputs.go_private_patterns }}
        run: |
          set -euo pipefail

          command -v go >/dev/null || { echo "::error::go is required."; exit 1; }
          command -v gofmt >/dev/null || { echo "::error::gofmt is required."; exit 1; }
          command -v realpath >/dev/null || { echo "::error::realpath is required on the self-hosted runner."; exit 1; }

          workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          raw_path="${FORMAT_PATH:-/}"

          if [[ "$raw_path" == "/" ]]; then
            relative_path="."
          else
            relative_path="${raw_path#/}"
            relative_path="${relative_path%/}"
            [[ -n "$relative_path" ]] || relative_path="."
          fi

          target="$(realpath -e "$workspace/$relative_path" 2>/dev/null || true)"
          if [[ -z "$target" || ! -d "$target" ]]; then
            echo "::error::Format path does not exist or is not a directory: $raw_path"
            exit 1
          fi

          if [[ "$target" != "$workspace" && "$target" != "$workspace/"* ]]; then
            echo "::error::Format path must resolve inside the repository: $raw_path"
            exit 1
          fi

          target_relative="$(realpath --relative-to="$workspace" "$target")"
          if [[ "$target_relative" == "." ]]; then
            display_path="/"
          else
            display_path="/$target_relative"
          fi

          mapfile -d '' go_files < <(find "$target" -type f -name '*.go' -print0 | sort -z)

          {
            echo "display_path=$display_path"
            echo "files_scanned=${#go_files[@]}"
          } >>"$GITHUB_OUTPUT"

          if (( ${#go_files[@]} == 0 )); then
            {
              echo "changed=false"
              echo "changed_count=0"
              echo "modules_tidied=0"
            } >>"$GITHUB_OUTPUT"
            echo "No Go files found under $display_path."
            {
              echo "### Go Format & Tidy"
              echo
              echo "- Branch: \`$TARGET_BRANCH\`"
              echo "- Path: \`$display_path\`"
              echo "- Result: no Go files found"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          declare -A modules=()
          for file in "${go_files[@]}"; do
            cursor="$(dirname "$file")"
            module=""

            while :; do
              if [[ -f "$cursor/go.mod" ]]; then
                module="$cursor"
                break
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            if [[ -z "$module" ]]; then
              relative_file="$(realpath --relative-to="$workspace" "$file")"
              echo "::error::No go.mod found for Go file '$relative_file'."
              exit 1
            fi
            modules["$module"]=1
          done

          mapfile -t module_list < <(printf '%s\n' "${!modules[@]}" | sort)
          echo "modules_tidied=${#module_list[@]}" >>"$GITHUB_OUTPUT"

          git_config="$RUNNER_TEMP/workflows-go-format-gitconfig"
          : >"$git_config"
          chmod 600 "$git_config"
          export GIT_CONFIG_GLOBAL="$git_config"
          trap 'rm -f "$git_config"' EXIT

          if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
            git config --global url."https://x-access-token:${CI_PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

          printf '%s\0' "${go_files[@]}" | xargs -0 -r -n 100 gofmt -w

          for module in "${module_list[@]}"; do
            module_relative="$(realpath --relative-to="$workspace" "$module")"
            echo "==> go mod tidy: $module_relative"
            (
              cd "$module"
              go mod tidy
            )
          done

          git -C "$workspace" add -A -- "$target_relative"

          for module in "${module_list[@]}"; do
            module_relative="$(realpath --relative-to="$workspace" "$module")"
            if [[ "$module_relative" == "." ]]; then
              go_mod_relative="go.mod"
              go_sum_relative="go.sum"
            else
              go_mod_relative="$module_relative/go.mod"
              go_sum_relative="$module_relative/go.sum"
            fi

            git -C "$workspace" add -A -- "$go_mod_relative"
            if [[ -e "$workspace/$go_sum_relative" ]] || git -C "$workspace" ls-files --error-unmatch -- "$go_sum_relative" >/dev/null 2>&1; then
              git -C "$workspace" add -A -- "$go_sum_relative"
            fi
          done

          if git -C "$workspace" diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "changed_count=0" >>"$GITHUB_OUTPUT"
            echo "All Go files under $display_path are formatted and all discovered modules are tidy."
            {
              echo "### Go Format & Tidy"
              echo
              echo "- Branch: \`$TARGET_BRANCH\`"
              echo "- Path: \`$display_path\`"
              echo "- Files scanned: \`${#go_files[@]}\`"
              echo "- Modules tidied: \`${#module_list[@]}\`"
              echo "- Result: no changes"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_count="$(git -C "$workspace" diff --cached --name-only | wc -l | tr -d ' ')"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "changed_count=$changed_count" >>"$GITHUB_OUTPUT"

      - name: Commit and push Go maintenance
        id: push
        if: steps.format.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          COMMITTER_NAME: ${{ github.actor }}
          COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "$COMMITTER_NAME"
          git config user.email "$COMMITTER_EMAIL"
          diff_base="$(git rev-parse HEAD)"
          git commit -m "style: format and tidy Go"
          commit_sha="$(git rev-parse HEAD)"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          {
            echo "commit_sha=$commit_sha"
            echo "diff_base=$diff_base"
          } >>"$GITHUB_OUTPUT"
          echo "Pushed Go maintenance commit $commit_sha to $TARGET_BRANCH."

      - name: Dispatch canonical caller CI
        if: steps.format.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
          DIFF_BASE: ${{ steps.push.outputs.diff_base }}
        run: |
          set -euo pipefail
          command -v curl >/dev/null || { echo "::error::curl is required."; exit 1; }
          command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }

          payload="$(jq -cn --arg ref "$TARGET_BRANCH" --arg diff_base "$DIFF_BASE" '{ref:$ref,inputs:{diff_base:$diff_base}}')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          code="$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "$payload")"
          [[ "$code" == "204" ]] || {
            cat "$response" >&2
            echo "::error::Failed to dispatch canonical caller CI (HTTP $code)."
            exit 1
          }

          echo "Canonical CI dispatched for $TARGET_BRANCH with diff_base=$DIFF_BASE."
          {
            echo "### Go Format & Tidy"
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Path: \`${{ steps.format.outputs.display_path }}\`"
            echo "- Files scanned: \`${{ steps.format.outputs.files_scanned }}\`"
            echo "- Files changed: \`${{ steps.format.outputs.changed_count }}\`"
            echo "- Modules tidied: \`${{ steps.format.outputs.modules_tidied }}\`"
            echo "- Commit: \`${{ steps.push.outputs.commit_sha }}\`"
            echo "- Canonical CI: dispatched"
          } >>"$GITHUB_STEP_SUMMARY"
