name: Go Format

run-name: Go Format · ${{ github.ref_name }} · ${{ inputs.path }}

on:
  workflow_call:
    inputs:
      path:
        description: Repository-relative directory to format. / formats the whole repository.
        required: false
        type: string
        default: /
      go_private_patterns:
        description: Optional GOPRIVATE pattern for private Go modules.
        required: false
        type: string
        default: ''
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional GitHub token with read access to private Go module repositories.
        required: false
  workflow_dispatch:
    inputs:
      path:
        description: Repository-relative directory to format. / formats the whole repository.
        required: false
        type: string
        default: /
      go_private_patterns:
        description: Optional GOPRIVATE pattern for private Go modules.
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: go-format-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Format, push, and verify Go
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45

    steps:
      - name: Validate target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_BRANCH" || "$TARGET_BRANCH" == "HEAD" ]]; then
            echo "::error::Run this workflow from a branch."
            exit 1
          fi
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null

      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go for formatting
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Apply gofmt and go mod tidy
        id: format
        shell: bash
        env:
          FORMAT_PATH: ${{ inputs.path }}
          TARGET_BRANCH: ${{ github.ref_name }}
          CI_PRIVATE_REPO_TOKEN: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}
          GOPRIVATE: ${{ inputs.go_private_patterns }}
          GONOSUMDB: ${{ inputs.go_private_patterns }}
        run: |
          set -euo pipefail

          command -v go >/dev/null || { echo "::error::go is required."; exit 1; }
          command -v gofmt >/dev/null || { echo "::error::gofmt is required."; exit 1; }
          command -v realpath >/dev/null || { echo "::error::realpath is required on the self-hosted runner."; exit 1; }

          workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          raw_path="${FORMAT_PATH:-/}"

          if [[ "$raw_path" == "/" ]]; then
            relative_path="."
          else
            relative_path="${raw_path#/}"
            relative_path="${relative_path%/}"
            [[ -n "$relative_path" ]] || relative_path="."
          fi

          target="$(realpath -e "$workspace/$relative_path" 2>/dev/null || true)"
          if [[ -z "$target" || ! -d "$target" ]]; then
            echo "::error::Format path does not exist or is not a directory: $raw_path"
            exit 1
          fi

          if [[ "$target" != "$workspace" && "$target" != "$workspace/"* ]]; then
            echo "::error::Format path must resolve inside the repository: $raw_path"
            exit 1
          fi

          target_relative="$(realpath --relative-to="$workspace" "$target")"
          if [[ "$target_relative" == "." ]]; then
            display_path="/"
          else
            display_path="/$target_relative"
          fi

          mapfile -d '' go_files < <(find "$target" -type f -name '*.go' -print0 | sort -z)

          {
            echo "display_path=$display_path"
            echo "files_scanned=${#go_files[@]}"
          } >>"$GITHUB_OUTPUT"

          if (( ${#go_files[@]} == 0 )); then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "changed_count=0" >>"$GITHUB_OUTPUT"
            echo "modules_tidied=0" >>"$GITHUB_OUTPUT"
            echo "No Go files found under $display_path."
            {
              echo "### Go Format & Tidy"
              echo
              echo "- Branch: `$TARGET_BRANCH`"
              echo "- Path: `$display_path`"
              echo "- Result: no Go files found"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          declare -A modules=()
          for file in "${go_files[@]}"; do
            cursor="$(dirname "$file")"
            module=""

            while :; do
              if [[ -f "$cursor/go.mod" ]]; then
                module="$cursor"
                break
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            if [[ -z "$module" ]]; then
              relative_file="$(realpath --relative-to="$workspace" "$file")"
              echo "::error::No go.mod found for Go file '$relative_file'."
              exit 1
            fi
            modules["$module"]=1
          done

          mapfile -t module_list < <(printf '%s\n' "${!modules[@]}" | sort)
          echo "modules_tidied=${#module_list[@]}" >>"$GITHUB_OUTPUT"

          git_config="$RUNNER_TEMP/workflows-go-format-gitconfig"
          : >"$git_config"
          chmod 600 "$git_config"
          export GIT_CONFIG_GLOBAL="$git_config"
          trap 'rm -f "$git_config"' EXIT

          if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
            git config --global url."https://x-access-token:${CI_PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

          printf '%s\0' "${go_files[@]}" | xargs -0 -r -n 100 gofmt -w

          for module in "${module_list[@]}"; do
            module_relative="$(realpath --relative-to="$workspace" "$module")"
            echo "==> go mod tidy: $module_relative"
            (
              cd "$module"
              go mod tidy
            )
          done

          git -C "$workspace" add -A -- "$target_relative"

          for module in "${module_list[@]}"; do
            module_relative="$(realpath --relative-to="$workspace" "$module")"
            if [[ "$module_relative" == "." ]]; then
              go_mod_relative="go.mod"
              go_sum_relative="go.sum"
            else
              go_mod_relative="$module_relative/go.mod"
              go_sum_relative="$module_relative/go.sum"
            fi

            git -C "$workspace" add -A -- "$go_mod_relative"
            if [[ -e "$workspace/$go_sum_relative" ]] || git -C "$workspace" ls-files --error-unmatch -- "$go_sum_relative" >/dev/null 2>&1; then
              git -C "$workspace" add -A -- "$go_sum_relative"
            fi
          done

          if git -C "$workspace" diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "changed_count=0" >>"$GITHUB_OUTPUT"
            echo "All Go files under $display_path are formatted and all discovered modules are tidy."
            {
              echo "### Go Format & Tidy"
              echo
              echo "- Branch: `$TARGET_BRANCH`"
              echo "- Path: `$display_path`"
              echo "- Files scanned: `${#go_files[@]}`"
              echo "- Modules tidied: `${#module_list[@]}`"
              echo "- Result: no changes"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_count="$(git -C "$workspace" diff --cached --name-only | wc -l | tr -d ' ')"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "changed_count=$changed_count" >>"$GITHUB_OUTPUT"

      - name: Commit and push Go maintenance
        id: push
        if: steps.format.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          COMMITTER_NAME: ${{ github.actor }}
          COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "$COMMITTER_NAME"
          git config user.email "$COMMITTER_EMAIL"
          git commit -m "style: format and tidy Go"
          commit_sha="$(git rev-parse HEAD)"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "commit_sha=$commit_sha" >>"$GITHUB_OUTPUT"
          echo "Pushed Go maintenance commit $commit_sha to $TARGET_BRANCH."

      - name: Prepare pushed Go CI
        id: go-ci
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }

          workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          pushed_sha="${{ steps.push.outputs.commit_sha }}"
          [[ "$(git rev-parse HEAD)" == "$pushed_sha" ]] || {
            echo "::error::Workspace HEAD does not match the pushed Go maintenance commit."
            exit 1
          }

          declare -A modules=()

          while IFS= read -r -d '' changed; do
            module=""

            case "$changed" in
              *.go)
                file="$workspace/$changed"
                cursor="$(dirname "$file")"

                while :; do
                  if [[ -f "$cursor/go.mod" ]]; then
                    module="$cursor"
                    break
                  fi
                  [[ "$cursor" == "$workspace" ]] && break
                  cursor="$(dirname "$cursor")"
                done
                ;;
              go.mod|*/go.mod|go.sum|*/go.sum)
                cursor="$workspace/$(dirname "$changed")"
                if [[ -f "$cursor/go.mod" ]]; then
                  module="$(realpath -e "$cursor")"
                fi
                ;;
              *)
                continue
                ;;
            esac

            if [[ -z "$module" ]]; then
              echo "::error::No go.mod found for changed Go file or module metadata '$changed'."
              exit 1
            fi
            modules["$module"]=1
          done < <(git diff-tree --no-commit-id --name-only -r -z "$pushed_sha")

          if (( ${#modules[@]} == 0 )); then
            echo "::error::The pushed Go maintenance commit contains no resolvable Go module."
            exit 1
          fi

          components='[]'
          common_version=""
          index=0

          while IFS= read -r module; do
            module_file="$module/go.mod"
            toolchain="$(awk '$1 == "toolchain" && $2 ~ /^go[0-9]/ { sub(/^go/, "", $2); print $2; exit }' "$module_file")"
            version="$toolchain"
            if [[ -z "$version" ]]; then
              version="$(awk '$1 == "go" { print $2; exit }' "$module_file")"
            fi

            if [[ -z "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Unable to resolve a valid Go version from '$module_file'."
              exit 1
            fi

            if [[ -z "$common_version" ]]; then
              common_version="$version"
            elif [[ "$common_version" != "$version" ]]; then
              echo "::error::The pushed commit spans Go modules with different Go versions ($common_version and $version). Run Go Format separately for each module path."
              exit 1
            fi

            relative="$(realpath --relative-to="$workspace" "$module")"
            index=$((index + 1))
            components="$(jq -c \
              --arg name "formatted-module-$index" \
              --arg path "$relative" \
              '. + [{name: $name, path: $path}]' <<<"$components")"
          done < <(printf '%s\n' "${!modules[@]}" | sort)

          echo "components=$components" >>"$GITHUB_OUTPUT"
          echo "version=$common_version" >>"$GITHUB_OUTPUT"

      - name: Verify pushed Go commit
        if: steps.format.outputs.changed == 'true'
        uses: Mooner510/workflows/.github/actions/ci/go@v1
        with:
          components: ${{ steps.go-ci.outputs.components }}
          version: ${{ steps.go-ci.outputs.version }}
          go_private_patterns: ${{ inputs.go_private_patterns }}
          private_repo_token: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}

      - name: Report result
        if: steps.format.outputs.changed == 'true' && success()
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          DISPLAY_PATH: ${{ steps.format.outputs.display_path }}
          FILES_SCANNED: ${{ steps.format.outputs.files_scanned }}
          CHANGED_COUNT: ${{ steps.format.outputs.changed_count }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          COMMITTER_NAME: ${{ github.actor }}
        run: |
          {
            echo "### Go Format & Tidy"
            echo
            echo "- Branch: `$TARGET_BRANCH`"
            echo "- Path: `$DISPLAY_PATH`"
            echo "- Files scanned: `$FILES_SCANNED`"
            echo "- Files changed: `$CHANGED_COUNT`"
            echo "- Modules tidied: `${{ steps.format.outputs.modules_tidied }}`"
            echo "- Commit: `$COMMIT_SHA`"
            echo "- Committer: `$COMMITTER_NAME`"
            echo "- Go CI: passed"
          } >>"$GITHUB_STEP_SUMMARY"
