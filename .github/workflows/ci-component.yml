name: Reusable Component CI

on:
  workflow_call:
    inputs:
      type:
        description: 'Component type: go, node, or android.'
        required: true
        type: string
      version:
        description: Language/runtime version for this component group.
        required: true
        type: string
      components:
        description: JSON array of affected components for this group.
        required: true
        type: string
      go_private_patterns:
        description: Optional GOPRIVATE pattern for private Go modules.
        required: false
        type: string
        default: ''
    secrets:
      CI_PRIVATE_REPO_TOKEN:
        description: Optional GitHub token with read access to private Go module repositories.
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare runner environment
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }

          cache_root="${RUNNER_TOOL_CACHE:-$HOME/.cache/github-actions-tool-cache}"
          mkdir -p "$cache_root"

          if [[ "$cache_root" == "/opt/cache/tool-cache" ]]; then
            echo "Using Gharp shared cache: $cache_root"
          else
            echo "Using self-hosted runner cache: $cache_root"
          fi

          if [[ "${{ inputs.type }}" == "node" ]]; then
            mkdir -p \
              "$cache_root/corepack" \
              "$cache_root/bun/install-cache" \
              "$cache_root/pnpm/store" \
              "$cache_root/yarn/cache" \
              "$cache_root/npm"
            {
              echo "COREPACK_HOME=$cache_root/corepack"
              echo "BUN_INSTALL_CACHE_DIR=$cache_root/bun/install-cache"
              echo "PNPM_STORE_DIR=$cache_root/pnpm/store"
              echo "YARN_CACHE_FOLDER=$cache_root/yarn/cache"
              echo "npm_config_cache=$cache_root/npm"
            } >>"$GITHUB_ENV"
          elif [[ "${{ inputs.type }}" == "android" ]]; then
            if [[ "$cache_root" == "/opt/cache/tool-cache" ]]; then
              android_sdk="/opt/cache/android-sdk"
              gradle_home="/opt/cache/gradle"
            else
              android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.cache/android-sdk}}"
              gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
            fi
            mkdir -p "$android_sdk" "$gradle_home"
            {
              echo "ANDROID_HOME=$android_sdk"
              echo "ANDROID_SDK_ROOT=$android_sdk"
              echo "GRADLE_USER_HOME=$gradle_home"
            } >>"$GITHUB_ENV"
          fi

      - name: Set up Go
        if: inputs.type == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.version }}
          cache: false

      - name: Set up Node.js
        if: inputs.type == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.version }}
          package-manager-cache: false

      - name: Detect Bun project
        if: inputs.type == 'node'
        id: bun
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          while IFS= read -r component_json; do
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
            [[ -n "$component" ]] || continue

            cursor="$component"
            while :; do
              if [[ -f "$cursor/bun.lock" || -f "$cursor/bun.lockb" ]]; then
                [[ -f "$cursor/package.json" ]] || {
                  echo "::error::Bun package root must contain package.json."
                  exit 1
                }
                relative="$(realpath --relative-to="$workspace" "$cursor/package.json")"
                echo "required=true" >>"$GITHUB_OUTPUT"
                echo "version_file=$relative" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done
          done < <(jq -c '.[]' <<<"$components")

          echo "required=false" >>"$GITHUB_OUTPUT"
          echo "version_file=" >>"$GITHUB_OUTPUT"

      - name: Set up Bun
        if: inputs.type == 'node' && steps.bun.outputs.required == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ steps.bun.outputs.version_file }}

      - name: Prepare Android SDK cache
        if: inputs.type == 'android'
        id: android_cache
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
          if [[ -x "$sdkmanager" ]] && [[ -f "$ANDROID_SDK_ROOT/licenses/android-sdk-license" ]]; then
            echo "android_sdk_ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "android_sdk_ready=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: inputs.type == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.version }}

      - name: Bootstrap Android SDK
        if: inputs.type == 'android' && steps.android_cache.outputs.android_sdk_ready != 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Configure Android SDK paths
        if: inputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_dir="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin"
          [[ -x "$sdkmanager_dir/sdkmanager" ]] || {
            echo "::error::Android sdkmanager is missing after setup."
            exit 1
          }
          echo "$sdkmanager_dir" >>"$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >>"$GITHUB_PATH"

      - name: Verify and build affected Go components
        if: inputs.type == 'go'
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
          CI_PRIVATE_REPO_TOKEN: ${{ secrets.CI_PRIVATE_REPO_TOKEN }}
          GOPRIVATE: ${{ inputs.go_private_patterns }}
          GONOSUMDB: ${{ inputs.go_private_patterns }}
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          git_config="$RUNNER_TEMP/workflows-go-gitconfig"
          : >"$git_config"
          chmod 600 "$git_config"
          export GIT_CONFIG_GLOBAL="$git_config"
          trap 'rm -f "$git_config"' EXIT

          if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
            git config --global url."https://x-access-token:${CI_PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

          declare -A verified_modules=()
          declare -A checked_scopes=()

          while IFS= read -r component_json; do
            name="$(jq -r '.name // empty' <<<"$component_json")"
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

            if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
              echo "::error::Go component '$name' must resolve inside the repository."
              exit 1
            fi

            cursor="$component"
            module=""
            while :; do
              if [[ -f "$cursor/go.mod" ]]; then
                module="$cursor"
                break
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            if [[ -z "$module" ]]; then
              echo "::error::No go.mod found from Go component '$name' up to the repository root."
              exit 1
            fi

            if [[ -z "${verified_modules[$module]+x}" ]]; then
              echo "==> Go module: $(realpath --relative-to="$workspace" "$module")"
              cd "$module"
              unformatted="$(gofmt -l .)"
              if [[ -n "$unformatted" ]]; then
                echo "::error::gofmt is required for the following files:"
                printf '%s\n' "$unformatted"
                exit 1
              fi
              go mod download
              go mod verify
              verified_modules[$module]=1
            fi

            relative="$(realpath --relative-to="$module" "$component")"
            if [[ "$relative" == "." ]]; then
              scope="./..."
            else
              scope="./$relative/..."
            fi

            scope_key="$module|$scope"
            if [[ -n "${checked_scopes[$scope_key]+x}" ]]; then
              continue
            fi

            echo "==> Go component: $name ($scope)"
            cd "$module"
            go vet "$scope"
            go test "$scope"
            go build "$scope"
            checked_scopes[$scope_key]=1
          done < <(jq -c '.[]' <<<"$components")

      - name: Install and check affected Node components
        if: inputs.type == 'node'
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          declare -A installed_roots=()
          declare -A checked_components=()

          resolve_project() {
            local component="$1"
            local cursor="$component"
            local matches=()
            PACKAGE_ROOT=""
            PACKAGE_MANAGER=""

            while :; do
              matches=()
              [[ -f "$cursor/pnpm-lock.yaml" ]] && matches+=("pnpm")
              [[ -f "$cursor/yarn.lock" ]] && matches+=("yarn")
              [[ -f "$cursor/package-lock.json" ]] && matches+=("npm")
              [[ -f "$cursor/bun.lock" ]] && matches+=("bun")
              [[ -f "$cursor/bun.lockb" ]] && matches+=("bun")

              if (( ${#matches[@]} > 1 )); then
                echo "::error::Multiple package-manager lockfiles found in '$cursor'. Keep exactly one."
                exit 1
              fi
              if (( ${#matches[@]} == 1 )); then
                PACKAGE_ROOT="$cursor"
                PACKAGE_MANAGER="${matches[0]}"
                return
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            echo "::error::No package-manager lockfile found from '$component' up to the repository root."
            exit 1
          }

          has_script() {
            local component="$1"
            local script="$2"
            (cd "$component" && node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$script")
          }

          run_script() {
            local manager="$1"
            local component="$2"
            local script="$3"
            case "$manager" in
              npm)  (cd "$component" && npm run "$script") ;;
              pnpm) (cd "$component" && pnpm run "$script") ;;
              yarn) (cd "$component" && yarn run "$script") ;;
              bun)  (cd "$component" && bun run "$script") ;;
            esac
          }

          while IFS= read -r component_json; do
            name="$(jq -r '.name // empty' <<<"$component_json")"
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

            if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
              echo "::error::Node component '$name' must resolve inside the repository."
              exit 1
            fi
            if [[ ! -f "$component/package.json" ]]; then
              echo "::error::Node component '$name' must contain package.json."
              exit 1
            fi

            resolve_project "$component"

            if [[ "$PACKAGE_MANAGER" == "pnpm" || "$PACKAGE_MANAGER" == "yarn" || "$PACKAGE_MANAGER" == "bun" ]]; then
              if [[ ! -f "$PACKAGE_ROOT/package.json" ]]; then
                echo "::error::$PACKAGE_MANAGER requires package.json at the package-manager root."
                exit 1
              fi

              package_manager_field="$(node -p 'require(process.argv[1]).packageManager || ""' "$PACKAGE_ROOT/package.json")"
              if [[ "$PACKAGE_MANAGER" == "pnpm" ]] && [[ ! "$package_manager_field" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
                echo "::error::pnpm projects must pin packageManager, for example \"pnpm@10.17.1\"."
                exit 1
              fi
              if [[ "$PACKAGE_MANAGER" == "yarn" ]] && [[ ! "$package_manager_field" =~ ^yarn@[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
                echo "::error::yarn projects must pin packageManager, for example \"yarn@4.9.2\"."
                exit 1
              fi
              if [[ "$PACKAGE_MANAGER" == "bun" ]]; then
                if [[ ! "$package_manager_field" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Bun projects must pin packageManager, for example \"bun@1.4.2\"."
                  exit 1
                fi
                command -v bun >/dev/null || { echo "::error::bun is required for Bun projects."; exit 1; }
                expected_bun="${package_manager_field#bun@}"
                actual_bun="$(bun --version)"
                if [[ "$actual_bun" != "$expected_bun" ]]; then
                  echo "::error::All Bun package roots in one Node CI job must use the same pinned Bun version. Expected $expected_bun, active $actual_bun."
                  exit 1
                fi
              fi
            fi

            if [[ -z "${installed_roots[$PACKAGE_ROOT]+x}" ]]; then
              echo "==> Install: $(realpath --relative-to="$workspace" "$PACKAGE_ROOT") ($PACKAGE_MANAGER)"
              case "$PACKAGE_MANAGER" in
                npm)
                  (cd "$PACKAGE_ROOT" && npm ci)
                  ;;
                pnpm)
                  command -v corepack >/dev/null || { echo "::error::corepack is required for pnpm."; exit 1; }
                  corepack enable
                  (cd "$PACKAGE_ROOT" && pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR")
                  ;;
                yarn)
                  command -v corepack >/dev/null || { echo "::error::corepack is required for yarn."; exit 1; }
                  corepack enable
                  yarn_major="$(cd "$PACKAGE_ROOT" && yarn --version | cut -d. -f1)"
                  if [[ "$yarn_major" == "1" ]]; then
                    (cd "$PACKAGE_ROOT" && yarn install --frozen-lockfile)
                  else
                    (cd "$PACKAGE_ROOT" && yarn install --immutable)
                  fi
                  ;;
                bun)
                  (cd "$PACKAGE_ROOT" && bun install --frozen-lockfile)
                  ;;
              esac
              installed_roots[$PACKAGE_ROOT]=1
            fi

            if [[ -n "${checked_components[$component]+x}" ]]; then
              continue
            fi

            echo "==> Node component: $name"
            if has_script "$component" lint; then
              run_script "$PACKAGE_MANAGER" "$component" lint
            fi
            for script in check-types typecheck type-check check; do
              if has_script "$component" "$script"; then
                run_script "$PACKAGE_MANAGER" "$component" "$script"
                break
              fi
            done
            if has_script "$component" test; then
              run_script "$PACKAGE_MANAGER" "$component" test
            fi
            if has_script "$component" build; then
              run_script "$PACKAGE_MANAGER" "$component" build
            fi
            checked_components[$component]=1
          done < <(jq -c '.[]' <<<"$components")

      - name: Run affected Android checks
        if: inputs.type == 'android'
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          declare -A checked=()

          while IFS= read -r component_json; do
            name="$(jq -r '.name // empty' <<<"$component_json")"
            path="$(jq -r '.path // empty' <<<"$component_json")"
            tasks_string="$(jq -r '.gradle_tasks // "lintDebug testDebugUnitTest assembleDebug"' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

            if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
              echo "::error::Android component '$name' must resolve inside the repository."
              exit 1
            fi
            if [[ ! -f "$component/gradlew" ]]; then
              echo "::error::Android component '$name' must point to a Gradle wrapper root containing gradlew."
              exit 1
            fi

            read -r -a tasks <<<"$tasks_string"
            if (( ${#tasks[@]} == 0 )); then
              echo "::error::gradle_tasks for '$name' must contain at least one task."
              exit 1
            fi
            for task in "${tasks[@]}"; do
              if [[ ! "$task" =~ ^[A-Za-z0-9_:.-]+$ ]]; then
                echo "::error::Invalid Gradle task '$task' for '$name'."
                exit 1
              fi
            done

            key="$component|$tasks_string"
            if [[ -n "${checked[$key]+x}" ]]; then
              continue
            fi

            echo "==> Android component: $name"
            cd "$component"
            chmod +x ./gradlew
            ./gradlew --no-daemon "${tasks[@]}"
            checked[$key]=1
          done < <(jq -c '.[]' <<<"$components")
