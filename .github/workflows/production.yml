name: Canonical Production Deployment

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate production request
    runs-on: [self-hosted, linux, "gharp-production-request-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10

    steps:
      - name: Validate repository dispatch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REQUESTED_SERVICE: ${{ github.event.client_payload.service }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          [[ "$EVENT_NAME" == "repository_dispatch" ]] || {
            echo "::error::Production deployment accepts repository_dispatch only."
            exit 1
          }
          [[ -n "$DEFAULT_BRANCH" && "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Production dispatch must resolve to the current repository default branch."
            exit 1
          }

          case "$EVENT_ACTION" in
            production_deploy|production_rollback) ;;
            *) echo "::error::Unsupported repository dispatch type '$EVENT_ACTION'."; exit 1 ;;
          esac

          if [[ -n "$REQUESTED_SERVICE" && ! "$REQUESTED_SERVICE" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "::error::Invalid requested service '$REQUESTED_SERVICE'."
            exit 1
          fi

      - name: Package trusted production request
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REQUESTED_SERVICE: ${{ github.event.client_payload.service }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gharp-production-request"
          jq -n             --arg action "$EVENT_ACTION"             --arg service "$REQUESTED_SERVICE"             --arg repository "$GITHUB_REPOSITORY"             --arg revision "$GITHUB_SHA"             '{action:$action,service:$service,repository:$repository,revision:$revision}'             >"$RUNNER_TEMP/gharp-production-request/request.json"

      - name: Publish trusted production request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gharp-production-request
          path: ${{ runner.temp }}/gharp-production-request
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
