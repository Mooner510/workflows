name: Reusable Node CI

on:
  workflow_call:
    inputs:
      components:
        description: JSON array of affected Node components.
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  ci:
    name: Node
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      CI: 'true'
      BUN_INSTALL_CACHE_DIR: /opt/cache/tool-cache/bun/install-cache

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify persistent tool cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_TOOL_CACHE:-}" != "/opt/cache/tool-cache" ]]; then
            echo "::error::Self-hosted runner must provide RUNNER_TOOL_CACHE=/opt/cache/tool-cache."
            exit 1
          fi
          mkdir -p "$RUNNER_TOOL_CACHE" "$BUN_INSTALL_CACHE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false

      - name: Detect Bun project
        id: bun
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail

          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          while IFS= read -r component_json; do
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
            [[ -n "$component" ]] || continue

            cursor="$component"
            while :; do
              if [[ -f "$cursor/bun.lock" || -f "$cursor/bun.lockb" ]]; then
                [[ -f "$cursor/package.json" ]] || {
                  echo "::error::Bun package root must contain package.json."
                  exit 1
                }
                relative="$(realpath --relative-to="$workspace" "$cursor/package.json")"
                echo "required=true" >>"$GITHUB_OUTPUT"
                echo "version_file=$relative" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done
          done < <(jq -c '.[]' <<<"$components")

          echo "required=false" >>"$GITHUB_OUTPUT"
          echo "version_file=" >>"$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.bun.outputs.required == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ steps.bun.outputs.version_file }}

      - name: Install and check affected Node components
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail

          command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          declare -A installed_roots=()
          declare -A checked_components=()

          resolve_project() {
            local component="$1"
            local cursor="$component"
            local matches=()

            PACKAGE_ROOT=""
            PACKAGE_MANAGER=""

            while :; do
              matches=()
              [[ -f "$cursor/pnpm-lock.yaml" ]] && matches+=("pnpm")
              [[ -f "$cursor/yarn.lock" ]] && matches+=("yarn")
              [[ -f "$cursor/package-lock.json" ]] && matches+=("npm")
              [[ -f "$cursor/bun.lock" ]] && matches+=("bun")
              [[ -f "$cursor/bun.lockb" ]] && matches+=("bun")

              if (( ${#matches[@]} > 1 )); then
                echo "::error::Multiple package-manager lockfiles found in '$cursor'. Keep exactly one."
                exit 1
              fi
              if (( ${#matches[@]} == 1 )); then
                PACKAGE_ROOT="$cursor"
                PACKAGE_MANAGER="${matches[0]}"
                return
              fi

              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            echo "::error::No package-manager lockfile found from '$component' up to the repository root."
            exit 1
          }

          has_script() {
            local component="$1"
            local script="$2"
            (cd "$component" && node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$script")
          }

          run_script() {
            local manager="$1"
            local component="$2"
            local script="$3"
            case "$manager" in
              npm)  (cd "$component" && npm run "$script") ;;
              pnpm) (cd "$component" && pnpm run "$script") ;;
              yarn) (cd "$component" && yarn run "$script") ;;
              bun)  (cd "$component" && bun run "$script") ;;
            esac
          }

          while IFS= read -r component_json; do
            name="$(jq -r '.name // empty' <<<"$component_json")"
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

            if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
              echo "::error::Node component '$name' must resolve inside the repository."
              exit 1
            fi
            if [[ ! -f "$component/package.json" ]]; then
              echo "::error::Node component '$name' must contain package.json."
              exit 1
            fi

            resolve_project "$component"

            if [[ "$PACKAGE_MANAGER" == "pnpm" || "$PACKAGE_MANAGER" == "yarn" || "$PACKAGE_MANAGER" == "bun" ]]; then
              if [[ ! -f "$PACKAGE_ROOT/package.json" ]]; then
                echo "::error::$PACKAGE_MANAGER requires package.json at the package-manager root."
                exit 1
              fi

              package_manager_field="$(node -p 'require(process.argv[1]).packageManager || ""' "$PACKAGE_ROOT/package.json")"
              if [[ "$PACKAGE_MANAGER" == "pnpm" ]] && [[ ! "$package_manager_field" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
                echo "::error::pnpm projects must pin packageManager, for example \"pnpm@10.17.1\"."
                exit 1
              fi
              if [[ "$PACKAGE_MANAGER" == "yarn" ]] && [[ ! "$package_manager_field" =~ ^yarn@[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
                echo "::error::yarn projects must pin packageManager, for example \"yarn@4.9.2\"."
                exit 1
              fi
              if [[ "$PACKAGE_MANAGER" == "bun" ]]; then
                if [[ ! "$package_manager_field" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Bun projects must pin packageManager, for example \"bun@1.4.2\"."
                  exit 1
                fi
                command -v bun >/dev/null || { echo "::error::bun is required for Bun projects."; exit 1; }
                expected_bun="${package_manager_field#bun@}"
                actual_bun="$(bun --version)"
                if [[ "$actual_bun" != "$expected_bun" ]]; then
                  echo "::error::All Bun package roots in one Node CI job must use the same pinned Bun version. Expected $expected_bun, active $actual_bun."
                  exit 1
                fi
              fi
            fi

            if [[ -z "${installed_roots[$PACKAGE_ROOT]+x}" ]]; then
              echo "==> Install: $(realpath --relative-to="$workspace" "$PACKAGE_ROOT") ($PACKAGE_MANAGER)"
              case "$PACKAGE_MANAGER" in
                npm)
                  (cd "$PACKAGE_ROOT" && npm ci)
                  ;;
                pnpm)
                  command -v corepack >/dev/null || { echo "::error::corepack is required for pnpm."; exit 1; }
                  corepack enable
                  (cd "$PACKAGE_ROOT" && pnpm install --frozen-lockfile)
                  ;;
                yarn)
                  command -v corepack >/dev/null || { echo "::error::corepack is required for yarn."; exit 1; }
                  corepack enable
                  yarn_major="$(cd "$PACKAGE_ROOT" && yarn --version | cut -d. -f1)"
                  if [[ "$yarn_major" == "1" ]]; then
                    (cd "$PACKAGE_ROOT" && yarn install --frozen-lockfile)
                  else
                    (cd "$PACKAGE_ROOT" && yarn install --immutable)
                  fi
                  ;;
                bun)
                  (cd "$PACKAGE_ROOT" && bun install --frozen-lockfile)
                  ;;
              esac
              installed_roots[$PACKAGE_ROOT]=1
            fi

            if [[ -n "${checked_components[$component]+x}" ]]; then
              continue
            fi

            echo "==> Node component: $name"
            if has_script "$component" lint; then
              run_script "$PACKAGE_MANAGER" "$component" lint
            fi

            for script in check-types typecheck type-check check; do
              if has_script "$component" "$script"; then
                run_script "$PACKAGE_MANAGER" "$component" "$script"
                break
              fi
            done

            if has_script "$component" test; then
              run_script "$PACKAGE_MANAGER" "$component" test
            fi
            if has_script "$component" build; then
              run_script "$PACKAGE_MANAGER" "$component" build
            fi

            checked_components[$component]=1
          done < <(jq -c '.[]' <<<"$components")
