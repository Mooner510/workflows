name: Reusable Deployment

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      script:
        description: Repository-relative path inside the component.
        required: false
        type: string
        default: .ci/deploy.sh
    secrets:
      deploy_env:
        description: Optional newline-separated KEY=VALUE environment entries for the deployment script.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment target
        id: target
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          DEPLOY_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          workspace="$(realpath "$GITHUB_WORKSPACE")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$WORKING_DIRECTORY" 2>/dev/null || true)"

          if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
            echo "::error::working_directory must resolve inside the repository."
            exit 1
          fi

          if [[ -z "$DEPLOY_SCRIPT" ]] || [[ "$DEPLOY_SCRIPT" == /* ]] || [[ "$DEPLOY_SCRIPT" == ".." || "$DEPLOY_SCRIPT" == ../* || "$DEPLOY_SCRIPT" == */../* || "$DEPLOY_SCRIPT" == */.. ]]; then
            echo "::error::script must be a safe path relative to the component."
            exit 1
          fi

          script="$(realpath -e "$component/$DEPLOY_SCRIPT" 2>/dev/null || true)"
          if [[ -z "$script" ]] || [[ "$script" != "$component/"* ]] || [[ ! -f "$script" ]]; then
            echo "::error::Deployment script '$DEPLOY_SCRIPT' must be a file inside the component."
            exit 1
          fi

          echo "component=$component" >>"$GITHUB_OUTPUT"
          echo "script=$script" >>"$GITHUB_OUTPUT"

      - name: Deploy
        shell: bash
        working-directory: ${{ steps.target.outputs.component }}
        env:
          DEPLOY_ENV: ${{ secrets.deploy_env }}
          DEPLOY_SCRIPT: ${{ steps.target.outputs.script }}
        run: |
          set -euo pipefail

          if [[ -n "${DEPLOY_ENV:-}" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" ]] && continue

              if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
                echo "::error::deploy_env must contain only KEY=VALUE lines with valid environment-variable names."
                exit 1
              fi

              key="${line%%=*}"
              value="${line#*=}"
              echo "::add-mask::$value"
              export "$key=$value"
            done <<<"$DEPLOY_ENV"
          fi

          unset DEPLOY_ENV
          bash "$DEPLOY_SCRIPT"
