name: Reusable Go CI

on:
  workflow_call:
    inputs:
      components:
        description: JSON array of affected Go components.
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: stable
    secrets:
      private_repo_token:
        description: Optional read-only GitHub token for private Go modules.
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: Go
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Verify and build affected Go components
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
          PRIVATE_REPO_TOKEN: ${{ secrets.private_repo_token }}
        run: |
          set -euo pipefail

          command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

          if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
            echo "::error::components must be a non-empty JSON array."
            exit 1
          fi

          private_patterns="$(jq -r '[.[] | (.go_private // empty)] | map(select(length > 0)) | unique | join(",")' <<<"$components")"
          if [[ -n "$private_patterns" ]]; then
            if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
              echo "::error::A private Go module is configured ($private_patterns), but private_repo_token was not provided."
              exit 1
            fi
            export GOPRIVATE="$private_patterns"
            export GONOSUMDB="$private_patterns"
            auth="$(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
            unset auth
          fi

          declare -A verified_modules=()
          declare -A checked_scopes=()

          while IFS= read -r component_json; do
            name="$(jq -r '.name // empty' <<<"$component_json")"
            path="$(jq -r '.path // empty' <<<"$component_json")"
            component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

            if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
              echo "::error::Go component '$name' must resolve inside the repository."
              exit 1
            fi

            cursor="$component"
            module=""
            while :; do
              if [[ -f "$cursor/go.mod" ]]; then
                module="$cursor"
                break
              fi
              [[ "$cursor" == "$workspace" ]] && break
              cursor="$(dirname "$cursor")"
            done

            if [[ -z "$module" ]]; then
              echo "::error::No go.mod found from Go component '$name' up to the repository root."
              exit 1
            fi

            if [[ -z "${verified_modules[$module]+x}" ]]; then
              echo "==> Go module: $(realpath --relative-to="$workspace" "$module")"
              cd "$module"

              unformatted="$(gofmt -l .)"
              if [[ -n "$unformatted" ]]; then
                echo "::error::gofmt is required for the following files:"
                printf '%s\n' "$unformatted"
                exit 1
              fi

              go mod download
              go mod verify
              verified_modules[$module]=1
            fi

            relative="$(realpath --relative-to="$module" "$component")"
            if [[ "$relative" == "." ]]; then
              scope="./..."
            else
              scope="./$relative/..."
            fi

            scope_key="$module|$scope"
            if [[ -n "${checked_scopes[$scope_key]+x}" ]]; then
              continue
            fi

            echo "==> Go component: $name ($scope)"
            cd "$module"
            go vet "$scope"
            go test "$scope"
            go build "$scope"
            checked_scopes[$scope_key]=1
          done < <(jq -c '.[]' <<<"$components")
