name: Set up pinned security scanners
description: Install checksum-pinned native scanners without exposing a container runtime socket.

runs:
  using: composite
  steps:
    - name: Install scanners
      shell: bash
      run: |
        set -euo pipefail

        command -v curl >/dev/null || { echo "::error::curl is required."; exit 1; }
        command -v sha256sum >/dev/null || { echo "::error::sha256sum is required."; exit 1; }
        [[ "$(uname -m)" == "x86_64" ]] || {
          echo "::error::Pinned scanner bundle is currently verified only for linux/amd64."
          exit 1
        }

        tool_base="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/isolated-scanners"
        bin_dir="$tool_base/bin"
        mkdir -p "$bin_dir"

        osv_version="2.6.0"
        osv="$bin_dir/osv-scanner"
        if [[ ! -x "$osv" ]]; then
          tmp="$(mktemp "$RUNNER_TEMP/osv-scanner-XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v$osv_version/osv-scanner_linux_amd64" -o "$tmp"
          printf '%s  %s\n' "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108" "$tmp" | sha256sum -c -
          install -m 0755 "$tmp" "$osv"
          rm -f "$tmp"
          trap - EXIT
        fi

        gitleaks_version="8.30.1"
        gitleaks="$bin_dir/gitleaks"
        if [[ ! -x "$gitleaks" ]]; then
          tmp="$(mktemp "$RUNNER_TEMP/gitleaks-XXXXXX.tar.gz")"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$gitleaks_version/gitleaks_${gitleaks_version}_linux_x64.tar.gz" -o "$tmp"
          printf '%s  %s\n' "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "$tmp" | sha256sum -c -
          tar -xzf "$tmp" -C "$bin_dir" gitleaks
          chmod 0755 "$gitleaks"
          rm -f "$tmp"
          trap - EXIT
        fi

        trivy_version="0.74.0"
        trivy="$bin_dir/trivy"
        if [[ ! -x "$trivy" ]]; then
          tmp="$(mktemp "$RUNNER_TEMP/trivy-XXXXXX.tar.gz")"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v$trivy_version/trivy_${trivy_version}_Linux-64bit.tar.gz" -o "$tmp"
          printf '%s  %s\n' "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a" "$tmp" | sha256sum -c -
          tar -xzf "$tmp" -C "$bin_dir" trivy
          chmod 0755 "$trivy"
          rm -f "$tmp"
          trap - EXIT
        fi

        echo "$bin_dir" >>"$GITHUB_PATH"
