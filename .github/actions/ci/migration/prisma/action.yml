name: Prisma migration CI
description: Validate Prisma migrations and apply them to an isolated disposable PostgreSQL instance.

inputs:
  components:
    description: JSON array of affected Node components using Prisma.
    required: true
  postgres-image:
    description: PostgreSQL image used for disposable migration validation.
    required: false
    default: postgres:17-alpine

runs:
  using: composite
  steps:
    - name: Validate Prisma migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }
        command -v docker >/dev/null || { echo "::error::docker is required for Prisma migration CI."; exit 1; }
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        jq -e 'type == "array" and length > 0' <<<"$components" >/dev/null || {
          echo "::error::components must be a non-empty JSON array."
          exit 1
        }

        run_prisma() {
          local manager="$1"
          local component="$2"
          shift 2
          case "$manager" in
            npm)  (cd "$component" && npm exec --offline -- prisma "$@") ;;
            pnpm) (cd "$component" && pnpm exec prisma "$@") ;;
            yarn) (cd "$component" && yarn exec prisma "$@") ;;
            bun)  (cd "$component" && bunx --bun prisma "$@") ;;
            *) echo "::error::Unsupported Prisma package manager '$manager'."; return 1 ;;
          esac
        }

        cleanup_container() {
          local container="$1"
          docker rm -f "$container" >/dev/null 2>&1 || true
        }

        start_postgres() {
          local container="$1"
          local port=""

          docker run -d --rm \
            --name "$container" \
            -e POSTGRES_USER=prisma \
            -e POSTGRES_PASSWORD=prisma \
            -e POSTGRES_DB=prisma \
            -p 127.0.0.1::5432 \
            "$POSTGRES_IMAGE" >/dev/null

          for _ in {1..60}; do
            if docker exec "$container" pg_isready -U prisma -d prisma >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! docker exec "$container" pg_isready -U prisma -d prisma >/dev/null 2>&1; then
            docker logs "$container" >&2 || true
            echo "::error::PostgreSQL did not become ready for Prisma migration CI." >&2
            return 1
          fi

          port="$(docker port "$container" 5432/tcp | awk -F: 'NR == 1 { print $NF }')"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the temporary PostgreSQL port." >&2
            return 1
          fi
          printf '%s' "$port"
        }

        while IFS= read -r component_json; do
          name="$(jq -r '.name // empty' <<<"$component_json")"
          path="$(jq -r '.path // empty' <<<"$component_json")"
          manager="$(jq -r '.package_manager // empty' <<<"$component_json")"
          schema_path="$(jq -r '.migration_schema // "prisma/schema.prisma"' <<<"$component_json")"
          migrations_path="$(jq -r '.migration_path // "prisma/migrations"' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

          if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
            echo "::error::Prisma component '$name' must resolve inside the repository."
            exit 1
          fi
          case "$manager" in npm|pnpm|yarn|bun) ;; *) echo "::error::Prisma component '$name' has invalid package manager '$manager'."; exit 1 ;; esac

          schema="$(realpath -e "$component/$schema_path" 2>/dev/null || true)"
          migrations="$(realpath -e "$component/$migrations_path" 2>/dev/null || true)"
          [[ -f "$schema" ]] || { echo "::error::Prisma schema '$schema_path' does not exist for '$name'."; exit 1; }
          [[ -d "$migrations" ]] || { echo "::error::Prisma migrations directory '$migrations_path' does not exist for '$name'."; exit 1; }

          expected_migrations="$(realpath -m "$(dirname "$schema")/migrations")"
          if [[ "$migrations" != "$expected_migrations" ]]; then
            echo "::error::Prisma migration_path for '$name' must resolve to the native migrations directory next to its schema."
            exit 1
          fi

          if ! (cd "$component" && node -e 'require.resolve("prisma/package.json")' >/dev/null 2>&1); then
            echo "::error::Prisma CLI must be installed as a local project dependency for '$name'."
            exit 1
          fi

          run_prisma "$manager" "$component" validate --schema "$schema"

          mapfile -t migration_dirs < <(find "$migrations" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          (( ${#migration_dirs[@]} > 0 )) || { echo "::error::No Prisma migration directories found for '$name'."; exit 1; }

          for migration_dir in "${migration_dirs[@]}"; do
            if [[ ! "$migration_dir" =~ ^[0-9]+_[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
              echo "::error::Invalid Prisma migration directory '$migration_dir' for '$name'."
              exit 1
            fi
            [[ -s "$migrations/$migration_dir/migration.sql" ]] || {
              echo "::error::Prisma migration '$migration_dir' must contain a non-empty migration.sql."
              exit 1
            }
          done

          safe_name="$(tr -cs 'A-Za-z0-9_.-' '-' <<<"$name" | sed 's/^-*//; s/-*$//' | cut -c1-40)"
          container="prisma-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${safe_name}-${RANDOM}"
          trap 'cleanup_container "$container"' EXIT

          echo "==> Prisma migration CI: applying $name (${#migration_dirs[@]} migrations) to disposable PostgreSQL"
          port="$(start_postgres "$container")" || exit 1
          database_url="postgresql://prisma:prisma@127.0.0.1:${port}/prisma?sslmode=disable"
          (
            export DATABASE_URL="$database_url"
            run_prisma "$manager" "$component" migrate deploy --schema "$schema"
          )

          cleanup_container "$container"
          trap - EXIT
        done < <(jq -c '.[]' <<<"$components")
