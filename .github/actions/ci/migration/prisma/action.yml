name: Prisma migration CI
description: Validate and apply Prisma migrations to the Gharp-managed job-scoped PostgreSQL.

inputs:
  components:
    description: JSON array of affected Node components using Prisma.
    required: true

runs:
  using: composite
  steps:
    - name: Validate and apply Prisma migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v node >/dev/null || { echo "::error::Node.js must be prepared before Prisma migration CI."; exit 1; }
        [[ -n "${DATABASE_URL:-}" ]] || { echo "::error::DATABASE_URL is required."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        run_prisma() {
          local manager="$1" component="$2"
          shift 2
          case "$manager" in
            npm)  (cd "$component" && npm exec --offline -- prisma "$@") ;;
            pnpm) (cd "$component" && pnpm exec prisma "$@") ;;
            yarn) (cd "$component" && yarn exec prisma "$@") ;;
            bun)  (cd "$component" && bunx --bun prisma "$@") ;;
            *) return 1 ;;
          esac
        }

        while IFS= read -r c; do
          name="$(jq -r '.name' <<<"$c")"
          path="$(jq -r '.path' <<<"$c")"
          manager="$(jq -r '.package_manager // empty' <<<"$c")"
          schema_path="$(jq -r '.migration_schema // "prisma/schema.prisma"' <<<"$c")"
          migrations_path="$(jq -r '.migration_path // "prisma/migrations"' <<<"$c")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" && ( "$component" == "$workspace" || "$component" == "$workspace/"* ) ]] || { echo "::error::Invalid Prisma component '$name'."; exit 1; }
          schema="$(realpath -e "$component/$schema_path" 2>/dev/null || true)"
          migrations="$(realpath -e "$component/$migrations_path" 2>/dev/null || true)"
          [[ -f "$schema" && -d "$migrations" ]] || { echo "::error::Missing Prisma schema/migrations for '$name'."; exit 1; }
          [[ "$migrations" == "$(realpath -m "$(dirname "$schema")/migrations")" ]] || { echo "::error::Prisma migrations must be next to schema for '$name'."; exit 1; }
          (cd "$component" && node -e 'require.resolve("prisma/package.json")' >/dev/null 2>&1) || { echo "::error::Prisma must be a local dependency for '$name'."; exit 1; }

          mapfile -t dirs < <(find "$migrations" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          (( ${#dirs[@]} > 0 )) || { echo "::error::No Prisma migrations for '$name'."; exit 1; }
          for d in "${dirs[@]}"; do
            [[ "$d" =~ ^[0-9]+_[A-Za-z0-9][A-Za-z0-9_-]*$ && -s "$migrations/$d/migration.sql" ]] || { echo "::error::Invalid Prisma migration '$d'."; exit 1; }
          done
          run_prisma "$manager" "$component" validate --schema "$schema"
          run_prisma "$manager" "$component" migrate deploy --schema "$schema"
        done < <(jq -c '.[]' <<<"$COMPONENTS_JSON")
