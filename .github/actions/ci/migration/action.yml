name: Migration CI
description: Dispatch migration validation to the configured engine after language CI.

inputs:
  components:
    description: JSON array of affected components in one CI group.
    required: true

runs:
  using: composite
  steps:
    - name: Partition migration components
      id: migration
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }

        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        jq -e 'type == "array" and length > 0' <<<"$components" >/dev/null || {
          echo "::error::components must be a non-empty JSON array."
          exit 1
        }

        invalid="$(jq -r '.[] | (.migration_engine // "none") | select(. != "none" and . != "goose" and . != "go-command" and . != "prisma" and . != "drizzle" and . != "flyway")' <<<"$components" | head -n1)"
        [[ -z "$invalid" ]] || { echo "::error::Unsupported migration engine '$invalid'."; exit 1; }

        goose="$(jq -c '[.[] | select((.migration_engine // "none") == "goose" and (.migration_changed // true))]' <<<"$components")"
        go_command="$(jq -c '[.[] | select((.migration_engine // "none") == "go-command" and (.migration_changed // true))]' <<<"$components")"
        prisma="$(jq -c '[.[] | select((.migration_engine // "none") == "prisma" and (.migration_changed // true))]' <<<"$components")"
        drizzle="$(jq -c '[.[] | select((.migration_engine // "none") == "drizzle" and (.migration_changed // true))]' <<<"$components")"
        flyway="$(jq -c '[.[] | select((.migration_engine // "none") == "flyway" and (.migration_changed // true))]' <<<"$components")"

        {
          echo "goose=$goose"
          echo "go_command=$go_command"
          echo "prisma=$prisma"
          echo "drizzle=$drizzle"
          echo "flyway=$flyway"
          echo "has_goose=$([[ $(jq 'length' <<<"$goose") -gt 0 ]] && echo true || echo false)"
          echo "has_go_command=$([[ $(jq 'length' <<<"$go_command") -gt 0 ]] && echo true || echo false)"
          echo "has_prisma=$([[ $(jq 'length' <<<"$prisma") -gt 0 ]] && echo true || echo false)"
          echo "has_drizzle=$([[ $(jq 'length' <<<"$drizzle") -gt 0 ]] && echo true || echo false)"
          echo "has_flyway=$([[ $(jq 'length' <<<"$flyway") -gt 0 ]] && echo true || echo false)"
        } >>"$GITHUB_OUTPUT"

    - name: Enforce isolated migration adapters
      if: steps.migration.outputs.has_go_command == 'true' || steps.migration.outputs.has_prisma == 'true' || steps.migration.outputs.has_drizzle == 'true' || steps.migration.outputs.has_flyway == 'true'
      shell: bash
      run: |
        echo "::error::This migration engine still depends on the retired host-Docker CI path."
        echo "::error::No Docker/Podman runtime socket fallback is permitted on isolated runners."
        exit 1

    - name: Goose migration CI
      if: steps.migration.outputs.has_goose == 'true'
      uses: Mooner510/workflows/.github/actions/ci/migration/goose@2c61131329dd166ffbe29c8bab565653a33b09c2
      with:
        components: ${{ steps.migration.outputs.goose }}

    - name: Go command migration CI
      if: steps.migration.outputs.has_go_command == 'true'
      uses: Mooner510/workflows/.github/actions/ci/migration/go-command@v1
      with:
        components: ${{ steps.migration.outputs.go_command }}

    - name: Prisma migration CI
      if: steps.migration.outputs.has_prisma == 'true'
      uses: Mooner510/workflows/.github/actions/ci/migration/prisma@v1
      with:
        components: ${{ steps.migration.outputs.prisma }}

    - name: Drizzle migration CI
      if: steps.migration.outputs.has_drizzle == 'true'
      uses: Mooner510/workflows/.github/actions/ci/migration/drizzle@v1
      with:
        components: ${{ steps.migration.outputs.drizzle }}

    - name: Flyway migration CI
      if: steps.migration.outputs.has_flyway == 'true'
      uses: Mooner510/workflows/.github/actions/ci/migration/flyway@v1
      with:
        components: ${{ steps.migration.outputs.flyway }}