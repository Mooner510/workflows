name: Goose migration CI
description: Validate and apply Goose SQL migrations to the Gharp-managed job-scoped PostgreSQL.

inputs:
  components:
    description: JSON array of affected components using Goose.
    required: true
  default-version:
    description: Goose version used when a component does not explicitly select one and its nearest go.mod does not pin Goose.
    required: false
    default: v3.28.0

runs:
  using: composite
  steps:
    - name: Validate and apply Goose SQL migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
        DEFAULT_GOOSE_VERSION: ${{ inputs.default-version }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v curl >/dev/null || { echo "::error::curl is required."; exit 1; }
        command -v sha256sum >/dev/null || { echo "::error::sha256sum is required."; exit 1; }
        [[ -n "${CI_POSTGRES_URL:-}" ]] || { echo "::error::CI_POSTGRES_URL is required for Goose migration CI."; exit 1; }

        curl_args=(--fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-max-time 90 --connect-timeout 10 --retry-connrefused)
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"

        normalize_version() {
          local version="$1"
          [[ "$version" == v* ]] || version="v$version"
          [[ "$version" =~ ^v3\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || return 1
          printf '%s' "$version"
        }

        resolve_goose_version() {
          local component_json="$1" component="$2" explicit module_file detected cursor
          explicit="$(jq -r '.goose_version // empty' <<<"$component_json")"
          if [[ -n "$explicit" ]]; then normalize_version "$explicit"; return; fi
          module_file=""
          cursor="$component"
          while :; do
            if [[ -f "$cursor/go.mod" ]]; then module_file="$cursor/go.mod"; break; fi
            [[ "$cursor" == "$workspace" ]] && break
            cursor="$(dirname "$cursor")"
          done
          if [[ -n "$module_file" ]]; then
            detected="$(awk '
              $1 == "require" && $2 == "github.com/pressly/goose/v3" { print $3; exit }
              $1 == "github.com/pressly/goose/v3" { print $2; exit }
            ' "$module_file")"
            if [[ -n "$detected" ]]; then normalize_version "$detected"; return; fi
          fi
          normalize_version "$DEFAULT_GOOSE_VERSION"
        }

        goose_binary() {
          local version="$1" machine asset arch cache_root binary tmp expected staged
          machine="$(uname -m)"
          case "$machine" in
            x86_64|amd64) asset="goose_linux_x86_64"; arch="x86_64" ;;
            aarch64|arm64) asset="goose_linux_arm64"; arch="arm64" ;;
            *) echo "::error::Unsupported runner architecture '$machine' for Goose." >&2; return 1 ;;
          esac
          cache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/goose/$version/$arch"
          binary="$cache_root/goose"
          if [[ -x "$binary" ]]; then printf '%s' "$binary"; return; fi
          mkdir -p "$cache_root"
          tmp="$(mktemp -d)"
          curl "${curl_args[@]}" "https://github.com/pressly/goose/releases/download/$version/checksums.txt" -o "$tmp/checksums.txt"
          curl "${curl_args[@]}" "https://github.com/pressly/goose/releases/download/$version/$asset" -o "$tmp/$asset"
          expected="$(awk -v asset="$asset" '$2 == asset { print $1; exit }' "$tmp/checksums.txt")"
          [[ -n "$expected" ]] || { rm -rf "$tmp"; echo "::error::Missing Goose checksum." >&2; return 1; }
          printf '%s  %s\n' "$expected" "$tmp/$asset" | sha256sum -c - >/dev/null
          staged="$cache_root/.goose.$$.$RANDOM"
          install -m 0755 "$tmp/$asset" "$staged"
          mv -f "$staged" "$binary"
          rm -rf "$tmp"
          printf '%s' "$binary"
        }

        while IFS= read -r component_json; do
          name="$(jq -r '.name // empty' <<<"$component_json")"
          path="$(jq -r '.path // empty' <<<"$component_json")"
          migrations_path="$(jq -r '.migration_path // "db/migrations"' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" && ( "$component" == "$workspace" || "$component" == "$workspace/"* ) ]] || {
            echo "::error::Goose component '$name' must resolve inside the repository."; exit 1;
          }

          migrations="$(realpath -e "$component/$migrations_path" 2>/dev/null || true)"
          [[ -d "$migrations" && ( "$migrations" == "$component" || "$migrations" == "$component/"* ) ]] || {
            echo "::error::Invalid Goose migration path for '$name'."; exit 1;
          }
          if find "$migrations" -type f -name '*.go' -print -quit | grep -q .; then
            echo "::error::Goose CI supports SQL migrations only for '$name'."; exit 1;
          fi
          find "$migrations" -type f -name '*.sql' -print -quit | grep -q . || {
            echo "::error::No Goose SQL migrations found for '$name'."; exit 1;
          }

          goose_version="$(resolve_goose_version "$component_json" "$component")" || {
            echo "::error::Invalid Goose version for '$name'."; exit 1;
          }
          goose="$(goose_binary "$goose_version")"
          "$goose" -dir "$migrations" validate
          "$goose" -dir "$migrations" postgres "$CI_POSTGRES_URL?sslmode=disable" up
        done < <(jq -c '.[]' <<<"$components")
