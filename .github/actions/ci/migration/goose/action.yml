name: Goose migration CI
description: Validate and apply Goose SQL migrations inside the isolated BuildKit execution boundary.

inputs:
  components:
    description: JSON array of affected components using Goose.
    required: true
  default-version:
    description: Goose version used when a component does not explicitly select one and its nearest go.mod does not pin Goose.
    required: false
    default: v3.28.0

runs:
  using: composite
  steps:
    - name: Set up isolated BuildKit
      uses: Mooner510/workflows/.github/actions/ci/buildkit@v1

    - name: Validate Goose SQL migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
        DEFAULT_GOOSE_VERSION: ${{ inputs.default-version }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v curl >/dev/null || { echo "::error::curl is required."; exit 1; }
        command -v sha256sum >/dev/null || { echo "::error::sha256sum is required."; exit 1; }
        command -v buildctl >/dev/null || { echo "::error::buildctl is required."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        jq -e 'type == "array" and length > 0' <<<"$components" >/dev/null || {
          echo "::error::components must be a non-empty JSON array."
          exit 1
        }

        normalize_version() {
          local version="$1"
          [[ "$version" == v* ]] || version="v$version"
          if [[ ! "$version" =~ ^v3\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Goose v3 version '$1'." >&2
            return 1
          fi
          printf '%s' "$version"
        }

        resolve_goose_version() {
          local component_json="$1"
          local component="$2"
          local explicit module_file detected cursor

          explicit="$(jq -r '.goose_version // empty' <<<"$component_json")"
          if [[ -n "$explicit" ]]; then
            normalize_version "$explicit"
            return
          fi

          module_file=""
          cursor="$component"
          while :; do
            if [[ -f "$cursor/go.mod" ]]; then
              module_file="$cursor/go.mod"
              break
            fi
            [[ "$cursor" == "$workspace" ]] && break
            cursor="$(dirname "$cursor")"
          done

          if [[ -n "$module_file" ]]; then
            detected="$(awk '
              $1 == "require" && $2 == "github.com/pressly/goose/v3" { print $3; exit }
              $1 == "github.com/pressly/goose/v3" { print $2; exit }
            ' "$module_file")"
            if [[ -n "$detected" ]]; then
              normalize_version "$detected"
              return
            fi
          fi

          normalize_version "$DEFAULT_GOOSE_VERSION"
        }

        goose_binary() {
          local version="$1"
          local machine asset arch cache_root binary tmp expected staged

          machine="$(uname -m)"
          case "$machine" in
            x86_64|amd64)
              asset="goose_linux_x86_64"
              arch="x86_64"
              ;;
            aarch64|arm64)
              asset="goose_linux_arm64"
              arch="arm64"
              ;;
            *)
              echo "::error::Unsupported runner architecture '$machine' for Goose." >&2
              return 1
              ;;
          esac

          cache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/goose/$version/$arch"
          binary="$cache_root/goose"
          if [[ -x "$binary" ]]; then
            printf '%s' "$binary"
            return
          fi

          mkdir -p "$cache_root"
          tmp="$(mktemp -d)"
          if ! curl -fsSL "https://github.com/pressly/goose/releases/download/$version/checksums.txt" -o "$tmp/checksums.txt" ||              ! curl -fsSL "https://github.com/pressly/goose/releases/download/$version/$asset" -o "$tmp/$asset"; then
            rm -rf "$tmp"
            echo "::error::Failed to download Goose $version." >&2
            return 1
          fi

          expected="$(awk -v asset="$asset" '$2 == asset { print $1; exit }' "$tmp/checksums.txt")"
          if [[ -z "$expected" ]]; then
            rm -rf "$tmp"
            echo "::error::No checksum found for Goose asset '$asset' in $version." >&2
            return 1
          fi
          if ! printf '%s  %s\n' "$expected" "$tmp/$asset" | sha256sum -c - >/dev/null; then
            rm -rf "$tmp"
            echo "::error::Checksum verification failed for Goose $version/$asset." >&2
            return 1
          fi

          staged="$cache_root/.goose.$$.$RANDOM"
          install -m 0755 "$tmp/$asset" "$staged"
          mv -f "$staged" "$binary"
          rm -rf "$tmp"
          printf '%s' "$binary"
        }

        while IFS= read -r component_json; do
          name="$(jq -r '.name // empty' <<<"$component_json")"
          path="$(jq -r '.path // empty' <<<"$component_json")"
          migrations_path="$(jq -r '.migration_path // "db/migrations"' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

          if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
            echo "::error::Goose component '$name' must resolve inside the repository."
            exit 1
          fi

          migrations="$(realpath -e "$component/$migrations_path" 2>/dev/null || true)"
          if [[ -z "$migrations" || ! -d "$migrations" ]] || { [[ "$migrations" != "$component" ]] && [[ "$migrations" != "$component/"* ]]; }; then
            echo "::error::Goose migrations directory '$migrations_path' does not resolve inside component '$name'."
            exit 1
          fi

          if find "$migrations" -type f -name '*.go' -print -quit | grep -q .; then
            echo "::error::Goose CI supports portable SQL migrations only; Go migration files are not supported for '$name'."
            exit 1
          fi
          if ! find "$migrations" -type f -name '*.sql' -print -quit | grep -q .; then
            echo "::error::No SQL migration files found in '$migrations_path' for '$name'."
            exit 1
          fi

          goose_version="$(resolve_goose_version "$component_json" "$component")" || exit 1
          goose="$(goose_binary "$goose_version")" || exit 1

          echo "==> Goose $goose_version: static validation $name"
          "$goose" -dir "$migrations" validate

          safe_name="$(printf '%s' "$name" | tr -cs 'A-Za-z0-9_.-' '-' | sed 's/^-*//; s/-*$//' | cut -c1-40)"
          context="$RUNNER_TEMP/goose-build-$safe_name"
          dockerfile_dir="$RUNNER_TEMP/goose-dockerfile-$safe_name"
          rm -rf "$context" "$dockerfile_dir"
          mkdir -p "$context/migrations" "$dockerfile_dir"
          cp -a "$migrations/." "$context/migrations/"
          install -m 0755 "$goose" "$context/goose"

          cat >"$dockerfile_dir/Dockerfile" <<'DOCKERFILE'
        FROM postgres@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
        COPY goose /usr/local/bin/goose
        COPY migrations /migrations
        RUN set -eux;             export POSTGRES_USER=goose POSTGRES_PASSWORD=goose POSTGRES_DB=goose;             docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 &             pid=$!;             trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT;             ready=false;             for i in $(seq 1 60); do               if pg_isready -h 127.0.0.1 -U goose -d goose >/dev/null 2>&1; then ready=true; break; fi;               sleep 1;             done;             test "$ready" = true;             goose -dir /migrations postgres 'postgres://goose:goose@127.0.0.1:5432/goose?sslmode=disable' up;             kill "$pid";             wait "$pid" || true;             trap - EXIT
        DOCKERFILE

          echo "==> Goose $goose_version: isolated disposable PostgreSQL $name"
          buildctl --addr "$BUILDKIT_HOST" build             --frontend dockerfile.v0             --local "context=$context"             --local "dockerfile=$dockerfile_dir"             --opt filename=Dockerfile
        done < <(jq -c '.[]' <<<"$components")
