name: Flyway migration CI
description: Validate and apply Flyway SQL migrations to the Gharp-managed job-scoped PostgreSQL using project-pinned runtime dependencies.

inputs:
  components:
    description: JSON array of affected Java/Kotlin components using Flyway.
    required: true

runs:
  using: composite
  steps:
    - name: Validate and apply Flyway migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v java >/dev/null || { echo "::error::Java must be prepared before Flyway migration CI."; exit 1; }
        command -v javac >/dev/null || { echo "::error::javac is required."; exit 1; }
        for key in FLYWAY_URL FLYWAY_USER FLYWAY_PASSWORD; do
          [[ -n "${!key:-}" ]] || { echo "::error::$key is required."; exit 1; }
        done

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        source_dir="$RUNNER_TEMP/gharp-flyway"
        rm -rf "$source_dir"
        mkdir -p "$source_dir"
        cat >"$source_dir/GharpFlywayMigrate.java" <<'JAVA'
        import org.flywaydb.core.Flyway;
        public class GharpFlywayMigrate {
            public static void main(String[] args) {
                Flyway.configure()
                    .dataSource(args[0], args[1], args[2])
                    .locations("filesystem:" + args[3])
                    .load()
                    .migrate();
            }
        }
        JAVA

        while IFS= read -r c; do
          name="$(jq -r '.name' <<<"$c")"
          path="$(jq -r '.path' <<<"$c")"
          build_tool="$(jq -r '.build_tool // empty' <<<"$c")"
          migrations_path="$(jq -r '.migration_path // "src/main/resources/db/migration"' <<<"$c")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" && ( "$component" == "$workspace" || "$component" == "$workspace/"* ) ]] || { echo "::error::Invalid Flyway component '$name'."; exit 1; }
          if [[ ! -e "$component/$migrations_path" ]]; then
            echo "==> SKIP Flyway for '$name': migration path does not exist."
            continue
          fi
          migrations="$(realpath -e "$component/$migrations_path")"
          [[ -d "$migrations" && ( "$migrations" == "$component" || "$migrations" == "$component/"* ) ]] || { echo "::error::Invalid Flyway migration path for '$name'."; exit 1; }

          mapfile -t sql < <(find "$migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if (( ${#sql[@]} == 0 )); then
            echo "==> SKIP Flyway for '$name': no SQL migrations."
            continue
          fi
          declare -A versions=()
          for file in "${sql[@]}"; do
            if [[ "$file" =~ ^V([^_]+)__[A-Za-z0-9][A-Za-z0-9_.-]*\.sql$ ]]; then
              v="${BASH_REMATCH[1]}"
              [[ -z "${versions[$v]+x}" ]] || { echo "::error::Duplicate Flyway version '$v'."; exit 1; }
              versions[$v]=1
            elif [[ "$file" =~ ^(R__|B[^_]+__|U[^_]+__)[A-Za-z0-9][A-Za-z0-9_.-]*\.sql$ ]]; then
              :
            else
              echo "::error::Invalid Flyway filename '$file'."; exit 1
            fi
            [[ -s "$migrations/$file" ]] || { echo "::error::Empty Flyway migration '$file'."; exit 1; }
          done

          cp_file="$RUNNER_TEMP/flyway-classpath-$(printf '%s' "$name" | sha256sum | cut -c1-16)"
          case "$build_tool" in
            gradle)
              [[ -f "$component/gradlew" ]] || { echo "::error::Gradle wrapper required for '$name'."; exit 1; }
              chmod +x "$component/gradlew"
              init="$RUNNER_TEMP/gharp-flyway.init.gradle"
              cat >"$init" <<'GRADLE'
        allprojects {
            tasks.register("gharpRuntimeClasspath") {
                doLast {
                    def runtime = configurations.findByName("runtimeClasspath")
                    if (runtime == null) throw new GradleException("runtimeClasspath unavailable")
                    println(runtime.asPath)
                }
            }
        }
        GRADLE
              (cd "$component" && ./gradlew --no-daemon -q -I "$init" gharpRuntimeClasspath) >"$cp_file"
              ;;
            maven)
              [[ -f "$component/mvnw" ]] || { echo "::error::Maven wrapper required for '$name'."; exit 1; }
              chmod +x "$component/mvnw"
              (cd "$component" && ./mvnw -B -ntp dependency:build-classpath -Dmdep.outputFile="$cp_file" -DincludeScope=runtime)
              ;;
            *) echo "::error::Unsupported Flyway build tool '$build_tool'."; exit 1 ;;
          esac

          classpath="$(tail -n1 "$cp_file")"
          [[ -n "$classpath" ]] || { echo "::error::Unable to resolve Flyway runtime classpath for '$name'."; exit 1; }
          rm -rf "$source_dir/classes"
          mkdir -p "$source_dir/classes"
          javac -cp "$classpath" -d "$source_dir/classes" "$source_dir/GharpFlywayMigrate.java"
          java -cp "$classpath:$source_dir/classes" GharpFlywayMigrate "$FLYWAY_URL" "$FLYWAY_USER" "$FLYWAY_PASSWORD" "$migrations"
          rm -f "$cp_file"
        done < <(jq -c '.[]' <<<"$COMPONENTS_JSON")
