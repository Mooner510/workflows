name: Drizzle migration CI
description: Validate and apply Drizzle migrations to the Gharp-managed job-scoped PostgreSQL.

inputs:
  components:
    description: JSON array of affected Node components using Drizzle.
    required: true

runs:
  using: composite
  steps:
    - name: Validate and apply Drizzle migrations
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v node >/dev/null || { echo "::error::Node.js must be prepared before Drizzle migration CI."; exit 1; }
        [[ -n "${DATABASE_URL:-}" ]] || { echo "::error::DATABASE_URL is required."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        run_drizzle() {
          local manager="$1" component="$2"
          shift 2
          case "$manager" in
            npm)  (cd "$component" && npm exec --offline -- drizzle-kit "$@") ;;
            pnpm) (cd "$component" && pnpm exec drizzle-kit "$@") ;;
            yarn) (cd "$component" && yarn exec drizzle-kit "$@") ;;
            bun)  (cd "$component" && bunx --bun drizzle-kit "$@") ;;
            *) return 1 ;;
          esac
        }

        while IFS= read -r c; do
          name="$(jq -r '.name' <<<"$c")"
          path="$(jq -r '.path' <<<"$c")"
          manager="$(jq -r '.package_manager // empty' <<<"$c")"
          migrations_path="$(jq -r '.migration_path // "drizzle"' <<<"$c")"
          config_path="$(jq -r '.migration_config // "drizzle.config.ts"' <<<"$c")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" && ( "$component" == "$workspace" || "$component" == "$workspace/"* ) ]] || { echo "::error::Invalid Drizzle component '$name'."; exit 1; }
          config="$(realpath -e "$component/$config_path" 2>/dev/null || true)"
          migrations="$(realpath -e "$component/$migrations_path" 2>/dev/null || true)"
          [[ -f "$config" && -d "$migrations" ]] || { echo "::error::Missing Drizzle config/migrations for '$name'."; exit 1; }
          (cd "$component" && node -e 'require.resolve("drizzle-kit/package.json")' >/dev/null 2>&1) || { echo "::error::drizzle-kit must be a local dependency for '$name'."; exit 1; }
          find "$migrations" -type f -name '*.sql' -print -quit | grep -q . || { echo "::error::No Drizzle SQL migrations for '$name'."; exit 1; }

          run_drizzle "$manager" "$component" check --config "$config"
          run_drizzle "$manager" "$component" migrate --config "$config"
        done < <(jq -c '.[]' <<<"$COMPONENTS_JSON")
