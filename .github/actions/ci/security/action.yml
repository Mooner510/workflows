name: Security verification
description: Canonical source, dependency, secret, and configuration security gates for isolated runners.

inputs:
  components:
    description: JSON array of affected normalized components.
    required: true
  git_log_opts:
    description: Commit range passed to Gitleaks git history scanning.
    required: false
    default: --all

runs:
  using: composite
  steps:
    - name: Enforce trusted self-hosted execution
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        [[ "$EVENT_NAME" != "pull_request_target" ]] || {
          echo "::error::pull_request_target is not allowed on the self-hosted runner."
          exit 1
        }
        if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
          echo "::error::Fork pull requests are not allowed on the self-hosted runner."
          exit 1
        fi

    - name: Checkout caller repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Set up isolated BuildKit
      uses: Mooner510/workflows/.github/actions/ci/buildkit@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e

    - name: Set up pinned security scanners
      uses: Mooner510/workflows/.github/actions/ci/security-tools@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e

    - name: Resolve unique scan targets
      id: targets
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
          echo "::error::components must be a non-empty JSON array."
          exit 1
        fi

        scan_targets="$RUNNER_TEMP/workflows-security-targets.txt"
        dependency_targets="$RUNNER_TEMP/workflows-dependency-targets.txt"
        : >"$scan_targets"
        : >"$dependency_targets"

        while IFS= read -r component_json; do
          name="$(jq -r '.name // empty' <<<"$component_json")"
          type="$(jq -r '.type // empty' <<<"$component_json")"
          path="$(jq -r '.path // empty' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

          case "$type" in
            go|node|java-kotlin|android) ;;
            *) echo "::error::Unsupported component type '$type' for '$name'."; exit 1 ;;
          esac

          if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
            echo "::error::Component '$name' must resolve inside the repository."
            exit 1
          fi

          component_rel="$(realpath --relative-to="$workspace" "$component")"
          printf '%s\n' "$component_rel" >>"$scan_targets"

          dependency_root="$component"
          case "$type" in
            go)
              cursor="$component"
              dependency_root=""
              while :; do
                if [[ -f "$cursor/go.mod" ]]; then dependency_root="$cursor"; break; fi
                [[ "$cursor" == "$workspace" ]] && break
                cursor="$(dirname "$cursor")"
              done
              [[ -n "$dependency_root" ]] || {
                echo "::error::No go.mod found from Go component '$name' up to repository root."
                exit 1
              }
              ;;
            node)
              cursor="$component"
              dependency_root=""
              while :; do
                matches=0
                [[ -f "$cursor/pnpm-lock.yaml" ]] && ((matches+=1))
                [[ -f "$cursor/yarn.lock" ]] && ((matches+=1))
                [[ -f "$cursor/package-lock.json" ]] && ((matches+=1))
                [[ -f "$cursor/bun.lock" || -f "$cursor/bun.lockb" ]] && ((matches+=1))
                if (( matches > 1 )); then
                  echo "::error::Multiple Node package-manager lockfiles found in '$cursor'."
                  exit 1
                fi
                if (( matches == 1 )); then dependency_root="$cursor"; break; fi
                [[ "$cursor" == "$workspace" ]] && break
                cursor="$(dirname "$cursor")"
              done
              [[ -n "$dependency_root" ]] || {
                echo "::error::No Node lockfile found from '$name' up to repository root."
                exit 1
              }
              ;;
            java-kotlin|android)
              if ! find "$component" -type f \(                 -name gradle.lockfile -o                 -name buildscript-gradle.lockfile -o                 -name verification-metadata.xml -o                 -name pom.xml               \) -print -quit | grep -q .; then
                echo "::warning::No OSV-supported JVM dependency metadata found for '$name'; dependency coverage may be incomplete."
              fi
              ;;
          esac

          dependency_rel="$(realpath --relative-to="$workspace" "$dependency_root")"
          printf '%s\n' "$dependency_rel" >>"$dependency_targets"
        done < <(jq -c '.[]' <<<"$components")

        dedupe_tree_targets() {
          local source="$1"
          local output="${source}.dedup"
          local target kept covered
          local -a ordered=()
          mapfile -t ordered < <(awk '{ print length($0) "\t" $0 }' "$source" | sort -n -k1,1 -k2,2 | cut -f2-)
          : >"$output"
          for target in "${ordered[@]}"; do
            covered=false
            while IFS= read -r kept; do
              if [[ "$kept" == "." || "$target" == "$kept" || "$target" == "$kept/"* ]]; then
                covered=true
                break
              fi
            done <"$output"
            [[ "$covered" == "true" ]] || printf '%s\n' "$target" >>"$output"
          done
          mv "$output" "$source"
        }

        dedupe_tree_targets "$scan_targets"
        dedupe_tree_targets "$dependency_targets"
        {
          echo "scan_targets=$scan_targets"
          echo "dependency_targets=$dependency_targets"
        } >>"$GITHUB_OUTPUT"

    - name: Validate GitHub Actions refs
      shell: bash
      run: |
        set -euo pipefail
        workflows_dir="$GITHUB_WORKSPACE/.github"
        [[ -d "$workflows_dir" ]] || exit 0
        invalid=0
        while IFS= read -r file; do
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^#[:space:]]+) ]]; then
              ref="${BASH_REMATCH[2]}"
              ref="${ref#\"}"; ref="${ref%\"}"; ref="${ref#\'}"; ref="${ref%\'}"
              [[ "$ref" == ./* ]] && continue
              [[ "$ref" == docker://* ]] && continue
              [[ "$ref" == *@* ]] || continue
              action="${ref%@*}"
              version="${ref##*@}"
              [[ "$version" =~ ^[0-9a-fA-F]{40}$ ]] && continue
              if [[ "$action" == Mooner510/workflows/* ]] && [[ "$version" =~ ^v[0-9]+$ ]]; then continue; fi
              echo "::error file=${file#$GITHUB_WORKSPACE/}::Mutable GitHub Actions ref '$ref' is not allowed."
              invalid=1
            fi
          done <"$file"
        done < <(find "$workflows_dir" -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
        (( invalid == 0 )) || exit 1

    - name: Semgrep SAST
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail

        context="$RUNNER_TEMP/semgrep-context"
        dockerfile_dir="$RUNNER_TEMP/semgrep-dockerfile"
        rm -rf "$context" "$dockerfile_dir"
        mkdir -p "$context" "$dockerfile_dir"

        (
          cd "$GITHUB_WORKSPACE"
          git ls-files -z | tar --null -T - -cf -
        ) | tar -xf - -C "$context"

        rm -f "$context/.dockerignore"

        cat >"$dockerfile_dir/Dockerfile" <<'DOCKERFILE'
        FROM semgrep/semgrep@sha256:012c8fe81c14da2d7691b90fcd826ce07f460a3301442b16c460575c87d3efb6
        ARG TARGET
        ARG SCAN_NONCE
        COPY . /src
        WORKDIR /src
        RUN test -n "$SCAN_NONCE" && semgrep scan --config p/default             --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag             --error --metrics off --disable-version-check "$TARGET"
        DOCKERFILE

        while IFS= read -r target; do
          [[ "$target" == "." || "$target" != /* ]] || {
            echo "::error::Invalid Semgrep target '$target'."
            exit 1
          }
          echo "==> Semgrep: $target"
          buildctl --addr "$BUILDKIT_HOST" build             --frontend dockerfile.v0             --local "context=$context"             --local "dockerfile=$dockerfile_dir"             --opt filename=Dockerfile             --opt "build-arg:TARGET=$target"             --opt "build-arg:SCAN_NONCE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"             --output type=cacheonly
        done <"$TARGET_FILE"

    - name: OSV dependency vulnerabilities
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.dependency_targets }}
      run: |
        set -euo pipefail
        command -v osv-scanner >/dev/null || { echo "::error::osv-scanner is required."; exit 1; }

        while IFS= read -r target; do
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid OSV target '$target'."
            exit 1
          }
          echo "==> OSV: $target"
          osv-scanner scan source --recursive --allow-no-lockfiles --no-call-analysis=go "$host_target"
        done <"$TARGET_FILE"

    - name: Gitleaks current files
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null || { echo "::error::gitleaks is required."; exit 1; }

        while IFS= read -r target; do
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid Gitleaks target '$target'."
            exit 1
          }
          echo "==> Gitleaks files: $target"
          gitleaks dir --redact --no-banner "$host_target"
        done <"$TARGET_FILE"

    - name: Gitleaks git history secrets
      shell: bash
      env:
        GIT_LOG_OPTS: ${{ inputs.git_log_opts }}
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null || { echo "::error::gitleaks is required."; exit 1; }
        gitleaks git --redact --no-banner --log-opts="$GIT_LOG_OPTS" "$GITHUB_WORKSPACE"

    - name: Trivy misconfiguration
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail
        command -v trivy >/dev/null || { echo "::error::trivy is required."; exit 1; }

        while IFS= read -r target; do
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid Trivy target '$target'."
            exit 1
          }
          echo "==> Trivy: $target"
          trivy fs             --scanners misconfig             --severity HIGH,CRITICAL             --exit-code 1             --no-progress             --skip-version-check             --skip-dirs .git             --skip-dirs node_modules             --skip-dirs build             --skip-dirs .gradle             "$host_target"
        done <"$TARGET_FILE"
