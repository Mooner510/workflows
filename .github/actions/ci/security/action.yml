name: Security verification
description: Canonical source, dependency, secret, and configuration security gates for isolated runners.

inputs:
  components:
    description: JSON array of affected normalized components.
    required: true
  git_log_opts:
    description: Commit range passed to Gitleaks git history scanning.
    required: false
    default: --all
  go_private_patterns:
    description: Optional GOPRIVATE pattern for private Go modules.
    required: false
    default: ''
  private_repo_token:
    description: Optional GitHub token with read access to private Go module repositories.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Enforce trusted self-hosted execution
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        [[ "$EVENT_NAME" != "pull_request_target" ]] || {
          echo "::error::pull_request_target is not allowed on the self-hosted runner."
          exit 1
        }
        if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
          echo "::error::Fork pull requests are not allowed on the self-hosted runner."
          exit 1
        fi

    - name: Checkout caller repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Set up isolated BuildKit
      uses: Mooner510/workflows/.github/actions/ci/buildkit@v1

    - name: Resolve Go vulnerability scanner toolchain
      id: go_toolchain
      if: ${{ contains(inputs.components, '"type":"go"') }}
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        version="$(jq -r '[.[] | select(.type == "go") | .go_version] | unique | if length == 1 then .[0] else empty end' <<<"$COMPONENTS_JSON")"
        if [[ ! "$version" =~ ^([0-9]+[.][0-9]+([.][0-9]+)?|stable)$ ]]; then
          echo "::error::Security scan requires one declared Go toolchain for the affected components."
          exit 1
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"

    - name: Set up Go vulnerability analysis
      if: ${{ contains(inputs.components, '"type":"go"') }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go_toolchain.outputs.version }}
        cache: false

    - name: Set up pinned security scanners
      uses: Mooner510/workflows/.github/actions/ci/security-tools@v1

    - name: Resolve unique scan targets
      id: targets
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        if [[ "$(jq 'type' <<<"$components")" != '"array"' ]] || [[ "$(jq 'length' <<<"$components")" -eq 0 ]]; then
          echo "::error::components must be a non-empty JSON array."
          exit 1
        fi

        scan_targets="$RUNNER_TEMP/workflows-security-targets.txt"
        go_vuln_targets="$RUNNER_TEMP/workflows-go-vulnerability-targets.txt"
        osv_lockfiles="$RUNNER_TEMP/workflows-osv-lockfiles.txt"
        : >"$scan_targets"
        : >"$go_vuln_targets"
        : >"$osv_lockfiles"

        while IFS= read -r component_json; do
          name="$(jq -r '.name // empty' <<<"$component_json")"
          type="$(jq -r '.type // empty' <<<"$component_json")"
          path="$(jq -r '.path // empty' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"

          case "$type" in
            go|node|java-kotlin|android) ;;
            *) echo "::error::Unsupported component type '$type' for '$name'."; exit 1 ;;
          esac

          if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
            echo "::error::Component '$name' must resolve inside the repository."
            exit 1
          fi

          component_rel="$(realpath --relative-to="$workspace" "$component")"
          printf '%s\n' "$component_rel" >>"$scan_targets"

          case "$type" in
            go)
              cursor="$component"
              module=""
              while :; do
                if [[ -f "$cursor/go.mod" ]]; then module="$cursor"; break; fi
                [[ "$cursor" == "$workspace" ]] && break
                cursor="$(dirname "$cursor")"
              done
              [[ -n "$module" ]] || {
                echo "::error::No go.mod found from Go component '$name' up to repository root."
                exit 1
              }
              realpath --relative-to="$workspace" "$module" >>"$go_vuln_targets"
              ;;
            node)
              cursor="$component"
              lockfile=""
              while :; do
                matches=()
                [[ -f "$cursor/pnpm-lock.yaml" ]] && matches+=("$cursor/pnpm-lock.yaml")
                [[ -f "$cursor/yarn.lock" ]] && matches+=("$cursor/yarn.lock")
                [[ -f "$cursor/package-lock.json" ]] && matches+=("$cursor/package-lock.json")
                [[ -f "$cursor/bun.lock" ]] && matches+=("$cursor/bun.lock")
                [[ -f "$cursor/bun.lockb" ]] && matches+=("$cursor/bun.lockb")
                if (( ${#matches[@]} > 1 )); then
                  echo "::error::Multiple Node package-manager lockfiles found in '$cursor'."
                  exit 1
                fi
                if (( ${#matches[@]} == 1 )); then lockfile="${matches[0]}"; break; fi
                [[ "$cursor" == "$workspace" ]] && break
                cursor="$(dirname "$cursor")"
              done
              [[ -n "$lockfile" ]] || {
                echo "::error::No Node lockfile found from '$name' up to repository root."
                exit 1
              }
              realpath --relative-to="$workspace" "$lockfile" >>"$osv_lockfiles"
              ;;
            java-kotlin|android)
              found=false
              while IFS= read -r lockfile; do
                found=true
                realpath --relative-to="$workspace" "$lockfile" >>"$osv_lockfiles"
              done < <(find "$component" -type f \( -name gradle.lockfile -o -name buildscript-gradle.lockfile -o -name pom.xml \) -print)
              if [[ "$found" != "true" ]]; then
                echo "::warning::No OSV-supported JVM lockfile found for '$name'; dependency coverage may be incomplete."
              fi
              ;;
          esac
        done < <(jq -c '.[]' <<<"$components")

        dedupe_tree_targets() {
          local source="$1"
          local output="${source}.dedup"
          local target kept covered
          local -a ordered=()
          mapfile -t ordered < <(awk '{ print length($0) "\t" $0 }' "$source" | sort -n -k1,1 -k2,2 | cut -f2-)
          : >"$output"
          for target in "${ordered[@]}"; do
            covered=false
            while IFS= read -r kept; do
              if [[ "$kept" == "." || "$target" == "$kept" || "$target" == "$kept/"* ]]; then
                covered=true
                break
              fi
            done <"$output"
            [[ "$covered" == "true" ]] || printf '%s\n' "$target" >>"$output"
          done
          mv "$output" "$source"
        }

        printf '.\n' >>"$scan_targets"
        dedupe_tree_targets "$scan_targets"
        dedupe_tree_targets "$go_vuln_targets"
        sort -u -o "$osv_lockfiles" "$osv_lockfiles"

        {
          echo "scan_targets=$scan_targets"
          echo "go_vuln_targets=$go_vuln_targets"
          echo "osv_lockfiles=$osv_lockfiles"
        } >>"$GITHUB_OUTPUT"

    - name: Validate GitHub Actions refs
      id: action_refs
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        workflows_dir="$GITHUB_WORKSPACE/.github"
        [[ -d "$workflows_dir" ]] || exit 0
        invalid=0
        while IFS= read -r file; do
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^#[:space:]]+) ]]; then
              ref="${BASH_REMATCH[2]}"
              ref="${ref#\"}"; ref="${ref%\"}"; ref="${ref#\'}"; ref="${ref%\'}"
              [[ "$ref" == ./* ]] && continue
              [[ "$ref" == docker://* ]] && continue
              [[ "$ref" == *@* ]] || continue
              action="${ref%@*}"
              version="${ref##*@}"
              [[ "$version" =~ ^[0-9a-fA-F]{40}$ ]] && continue
              if [[ "$action" == Mooner510/workflows/* ]] && [[ "$version" =~ ^v[0-9]+$ ]]; then continue; fi
              echo "::error file=${file#$GITHUB_WORKSPACE/}::Mutable GitHub Actions ref '$ref' is not allowed."
              invalid=1
            fi
          done <"$file"
        done < <(find "$workflows_dir" -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
        (( invalid == 0 )) || exit 1

    - name: Semgrep SAST
      id: semgrep
      continue-on-error: true
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail

        context="$RUNNER_TEMP/semgrep-context"
        dockerfile_dir="$RUNNER_TEMP/semgrep-dockerfile"
        rm -rf "$context" "$dockerfile_dir"
        mkdir -p "$context" "$dockerfile_dir"

        (
          cd "$GITHUB_WORKSPACE"
          git ls-files -z | tar --null -T - -cf -
        ) | tar -xf - -C "$context"

        rm -f "$context/.dockerignore"

        cat >"$dockerfile_dir/Dockerfile" <<'DOCKERFILE'
        FROM semgrep/semgrep@sha256:012c8fe81c14da2d7691b90fcd826ce07f460a3301442b16c460575c87d3efb6
        ARG TARGET
        ARG SCAN_NONCE
        COPY . /src
        WORKDIR /src
        RUN test -n "$SCAN_NONCE" && semgrep scan --config p/default             --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag             --error --metrics off --disable-version-check "$TARGET"
        DOCKERFILE

        while IFS= read -r target; do
          [[ "$target" == "." || "$target" != /* ]] || {
            echo "::error::Invalid Semgrep target '$target'."
            exit 1
          }
          echo "==> Semgrep: $target"
          buildctl --addr "$BUILDKIT_HOST" build             --frontend dockerfile.v0             --local "context=$context"             --local "dockerfile=$dockerfile_dir"             --opt filename=Dockerfile             --opt "build-arg:TARGET=$target"             --opt "build-arg:SCAN_NONCE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        done <"$TARGET_FILE"

    - name: Go reachable vulnerabilities
      id: govuln
      if: ${{ contains(inputs.components, '"type":"go"') }}
      continue-on-error: true
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.go_vuln_targets }}
        CI_PRIVATE_REPO_TOKEN: ${{ inputs.private_repo_token }}
        GOPRIVATE: ${{ inputs.go_private_patterns }}
        GONOSUMDB: ${{ inputs.go_private_patterns }}
      run: |
        set -euo pipefail
        command -v go >/dev/null || { echo "::error::Go is required for govulncheck."; exit 1; }

        git_config="$RUNNER_TEMP/workflows-security-go-gitconfig"
        : >"$git_config"
        chmod 600 "$git_config"
        export GIT_CONFIG_GLOBAL="$git_config"
        trap 'rm -f "$git_config"' EXIT

        if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
          echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
          git config --global url."https://x-access-token:${CI_PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

        while IFS= read -r target; do
          [[ -n "$target" ]] || continue
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid Go vulnerability target '$target'."
            exit 1
          }
          [[ -f "$host_target/go.mod" ]] || {
            echo "::error::Go vulnerability target '$target' does not contain go.mod."
            exit 1
          }
          echo "==> govulncheck: $target"
          (
            cd "$host_target"
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          )
        done <"$TARGET_FILE"

    - name: OSV lockfile vulnerabilities
      id: osv
      continue-on-error: true
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.osv_lockfiles }}
      run: |
        set -euo pipefail
        command -v osv-scanner >/dev/null || { echo "::error::osv-scanner is required."; exit 1; }

        while IFS= read -r target; do
          [[ -n "$target" ]] || continue
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && "$host_target" == "$GITHUB_WORKSPACE/"* && -f "$host_target" ]] || {
            echo "::error::Invalid OSV lockfile '$target'."
            exit 1
          }
          echo "==> OSV lockfile: $target"
          osv-scanner scan source --lockfile=":$host_target"
        done <"$TARGET_FILE"

    - name: Gitleaks current files
      id: gitleaks_files
      continue-on-error: true
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null || { echo "::error::gitleaks is required."; exit 1; }

        while IFS= read -r target; do
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid Gitleaks target '$target'."
            exit 1
          }
          echo "==> Gitleaks files: $target"
          gitleaks dir --redact --no-banner "$host_target"
        done <"$TARGET_FILE"

    - name: Gitleaks git history secrets
      id: gitleaks_history
      continue-on-error: true
      shell: bash
      env:
        GIT_LOG_OPTS: ${{ inputs.git_log_opts }}
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null || { echo "::error::gitleaks is required."; exit 1; }
        gitleaks git --redact --no-banner --log-opts="$GIT_LOG_OPTS" "$GITHUB_WORKSPACE"

    - name: Trivy misconfiguration
      id: trivy
      continue-on-error: true
      shell: bash
      env:
        TARGET_FILE: ${{ steps.targets.outputs.scan_targets }}
      run: |
        set -euo pipefail
        command -v trivy >/dev/null || { echo "::error::trivy is required."; exit 1; }

        while IFS= read -r target; do
          host_target="$(realpath -e "$GITHUB_WORKSPACE/$target" 2>/dev/null || true)"
          [[ -n "$host_target" && ( "$host_target" == "$GITHUB_WORKSPACE" || "$host_target" == "$GITHUB_WORKSPACE/"* ) ]] || {
            echo "::error::Invalid Trivy target '$target'."
            exit 1
          }
          echo "==> Trivy: $target"
          trivy fs             --scanners misconfig             --severity HIGH,CRITICAL             --exit-code 1             --no-progress             --skip-version-check             --skip-dirs .git             --skip-dirs node_modules             --skip-dirs build             --skip-dirs .gradle             "$host_target"
        done <"$TARGET_FILE"

    - name: Aggregate security result
      if: ${{ always() }}
      shell: bash
      env:
        ACTION_REFS: ${{ steps.action_refs.outcome }}
        SEMGREP: ${{ steps.semgrep.outcome }}
        GOVULN: ${{ steps.govuln.outcome }}
        OSV: ${{ steps.osv.outcome }}
        GITLEAKS_FILES: ${{ steps.gitleaks_files.outcome }}
        GITLEAKS_HISTORY: ${{ steps.gitleaks_history.outcome }}
        TRIVY: ${{ steps.trivy.outcome }}
      run: |
        set -euo pipefail
        failed=0
        for result in \
          "action-refs=$ACTION_REFS" \
          "semgrep=$SEMGREP" \
          "govuln=$GOVULN" \
          "osv=$OSV" \
          "gitleaks-files=$GITLEAKS_FILES" \
          "gitleaks-history=$GITLEAKS_HISTORY" \
          "trivy=$TRIVY"; do
          name="${result%%=*}"
          status="${result#*=}"
          echo "$name: $status"
          if [[ "$status" == "failure" || "$status" == "cancelled" ]]; then
            failed=1
          fi
        done
        (( failed == 0 )) || {
          echo "::error::One or more security gates failed."
          exit 1
        }
