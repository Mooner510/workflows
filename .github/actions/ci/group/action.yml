name: Component group CI
description: Run the canonical language, migration, and optional PostgreSQL integration checks for one normalized CI group.

inputs:
  components:
    description: JSON array of normalized components in this CI group.
    required: true
  type:
    description: go, node, or java-kotlin.
    required: true
  version:
    description: Canonical language runtime version for this group.
    required: true
  package-manager:
    required: false
    default: ''
  build-tool:
    required: false
    default: ''
  profile:
    required: false
    default: ''
  postgres-required:
    description: Whether this CI group is attached to a Gharp job-scoped PostgreSQL sidecar.
    required: false
    default: 'false'
  go-private-patterns:
    required: false
    default: ''
  private-repo-token:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure job-scoped PostgreSQL environment
      if: inputs.postgres-required == 'true'
      shell: bash
      env:
        COMPONENT_TYPE: ${{ inputs.type }}
      run: |
        set -euo pipefail

        required=(
          CI_POSTGRES_HOST
          CI_POSTGRES_PORT
          CI_POSTGRES_USER
          CI_POSTGRES_PASSWORD
          CI_POSTGRES_DB
        )
        for key in "${required[@]}"; do
          [[ -n "${!key:-}" ]] || {
            echo "::error::Gharp PostgreSQL capability is required but $key is missing."
            exit 1
          }
        done

        echo "::add-mask::$CI_POSTGRES_PASSWORD"

        postgres_url="postgresql://$CI_POSTGRES_USER:$CI_POSTGRES_PASSWORD@$CI_POSTGRES_HOST:$CI_POSTGRES_PORT/$CI_POSTGRES_DB"
        jdbc_url="jdbc:postgresql://$CI_POSTGRES_HOST:$CI_POSTGRES_PORT/$CI_POSTGRES_DB"

        {
          echo "CI_POSTGRES_URL=$postgres_url"
          case "$COMPONENT_TYPE" in
            java-kotlin)
              echo "DATABASE_URL=$jdbc_url"
              echo "SPRING_DATASOURCE_URL=$jdbc_url"
              echo "SPRING_DATASOURCE_USERNAME=$CI_POSTGRES_USER"
              echo "SPRING_DATASOURCE_PASSWORD=$CI_POSTGRES_PASSWORD"
              echo "FLYWAY_URL=$jdbc_url"
              echo "FLYWAY_USER=$CI_POSTGRES_USER"
              echo "FLYWAY_PASSWORD=$CI_POSTGRES_PASSWORD"
              ;;
            node|go)
              echo "DATABASE_URL=$postgres_url"
              ;;
            *)
              echo "::error::Unsupported component type for PostgreSQL environment: $COMPONENT_TYPE"
              exit 1
              ;;
          esac
        } >>"$GITHUB_ENV"

    - name: Prepare direct L2 build caches
      uses: Mooner510/workflows/.github/actions/ci/build-cache@v1
      with:
        components: ${{ inputs.components }}

    - name: Prepare Node migration runtime
      if: inputs.postgres-required == 'true' && inputs.type == 'node'
      uses: Mooner510/workflows/.github/actions/ci/node@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        package-manager: ${{ inputs.package-manager }}
        private_repo_token: ${{ inputs.private-repo-token }}
        run-checks: 'false'

    - name: Prepare Java/Kotlin migration runtime
      if: inputs.postgres-required == 'true' && inputs.type == 'java-kotlin'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        build-tool: ${{ inputs.build-tool }}
        profile: ${{ inputs.profile }}
        run-checks: 'false'

    - name: Migration CI
      uses: Mooner510/workflows/.github/actions/ci/migration@v1
      with:
        components: ${{ inputs.components }}

    - name: Go CI
      if: inputs.type == 'go'
      uses: Mooner510/workflows/.github/actions/ci/go@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        go_private_patterns: ${{ inputs.go-private-patterns }}
        private_repo_token: ${{ inputs.private-repo-token }}

    - name: Node CI
      if: inputs.type == 'node'
      uses: Mooner510/workflows/.github/actions/ci/node@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        package-manager: ${{ inputs.package-manager }}
        private_repo_token: ${{ inputs.private-repo-token }}

    - name: Java/Kotlin CI
      if: inputs.type == 'java-kotlin'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        build-tool: ${{ inputs.build-tool }}
        profile: ${{ inputs.profile }}

    - name: Go PostgreSQL integration CI
      if: inputs.type == 'go'
      uses: Mooner510/workflows/.github/actions/ci/go-postgres@v1
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
