name: Component group CI
description: Run the canonical language, migration, and optional PostgreSQL integration checks for one normalized CI group.

inputs:
  components:
    description: JSON array of normalized components in this CI group.
    required: true
  type:
    description: go, node, or java-kotlin.
    required: true
  version:
    description: Canonical language runtime version for this group.
    required: true
  package-manager:
    required: false
    default: ''
  build-tool:
    required: false
    default: ''
  profile:
    required: false
    default: ''
  go-private-patterns:
    required: false
    default: ''
  private-repo-token:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Go CI
      if: inputs.type == 'go'
      uses: Mooner510/workflows/.github/actions/ci/go@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        go_private_patterns: ${{ inputs.go-private-patterns }}
        private_repo_token: ${{ inputs.private-repo-token }}

    - name: Node CI
      if: inputs.type == 'node'
      uses: Mooner510/workflows/.github/actions/ci/node@1472bb45cca916cf0b138fb6e0de01c099f4704f
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        package-manager: ${{ inputs.package-manager }}
        private_repo_token: ${{ inputs.private-repo-token }}

    - name: Java/Kotlin CI
      if: inputs.type == 'java-kotlin'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e
      with:
        components: ${{ inputs.components }}
        version: ${{ inputs.version }}
        build-tool: ${{ inputs.build-tool }}
        profile: ${{ inputs.profile }}

    - name: Migration CI
      uses: Mooner510/workflows/.github/actions/ci/migration@1472bb45cca916cf0b138fb6e0de01c099f4704f
      with:
        components: ${{ inputs.components }}

    - name: Go PostgreSQL integration CI
      if: inputs.type == 'go'
      uses: Mooner510/workflows/.github/actions/ci/go-postgres@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e
      with:
        components: ${{ inputs.components }}
