name: Go PostgreSQL integration CI
description: Run opt-in Go integration tests against the same Gharp-managed job-scoped PostgreSQL used for migrations.

inputs:
  components:
    description: JSON array of affected Go components.
    required: true
  version:
    description: Exact Go version for the integration test toolchain.
    required: true

runs:
  using: composite
  steps:
    - name: Run PostgreSQL integration tests
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
      run: |
        set -euo pipefail
        [[ -n "${CI_POSTGRES_URL:-}" ]] || {
          if jq -e 'any(.[]; (.postgres_test // false) == true)' <<<"$COMPONENTS_JSON" >/dev/null; then
            echo "::error::CI_POSTGRES_URL is required for PostgreSQL integration tests."
            exit 1
          fi
          exit 0
        }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        while IFS= read -r c; do
          [[ "$(jq -r '.postgres_test // false' <<<"$c")" == "true" ]] || continue
          name="$(jq -r '.name' <<<"$c")"
          path="$(jq -r '.path' <<<"$c")"
          db_env="$(jq -r '.postgres_database_env // "TEST_DATABASE_URL"' <<<"$c")"
          args="$(jq -c '.postgres_test_args // ["./..."]' <<<"$c")"
          extra="$(jq -c '.postgres_test_env // {}' <<<"$c")"

          [[ "$db_env" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid postgres_database_env for '$name'."; exit 1; }
          jq -e 'type=="array" and length>0 and all(.[]; type=="string" and length>0)' <<<"$args" >/dev/null || { echo "::error::Invalid postgres_test_args for '$name'."; exit 1; }
          jq -e 'type=="object" and all(to_entries[]; (.key|test("^[A-Za-z_][A-Za-z0-9_]*$")) and (.value|type=="string"))' <<<"$extra" >/dev/null || { echo "::error::Invalid postgres_test_env for '$name'."; exit 1; }
          jq -e --arg key "$db_env" 'has($key) | not' <<<"$extra" >/dev/null || { echo "::error::postgres_test_env must not override $db_env."; exit 1; }

          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" && ( "$component" == "$workspace" || "$component" == "$workspace/"* ) ]] || { echo "::error::Invalid Go integration component '$name'."; exit 1; }

          export "$db_env=$CI_POSTGRES_URL?sslmode=disable"
          while IFS= read -r item; do
            key="$(jq -r '.key' <<<"$item")"
            value="$(jq -r '.value' <<<"$item")"
            export "$key=$value"
          done < <(jq -c 'to_entries[]' <<<"$extra")

          cmd=(go test)
          while IFS= read -r arg; do cmd+=("$arg"); done < <(jq -r '.[]' <<<"$args")
          (cd "$component" && "${cmd[@]}")
        done < <(jq -c '.[]' <<<"$COMPONENTS_JSON")
