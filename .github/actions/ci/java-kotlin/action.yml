name: Java Kotlin CI
description: Set up the JVM, prepare an optional platform profile, and delegate to Gradle or Maven.

inputs:
  components:
    description: JSON array of affected Java/Kotlin components.
    required: true
  version:
    description: Java version to install.
    required: true
  build-tool:
    description: Build tool shared by this CI group (gradle or maven).
    required: true
  profile:
    description: Optional profile shared by this CI group (none, android, or spring-boot).
    required: true
  run-checks:
    description: Run profile validation and Gradle/Maven CI after Java setup.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate Java/Kotlin CI group
      shell: bash
      env:
        COMPONENTS_JSON: ${{ inputs.components }}
        BUILD_TOOL: ${{ inputs.build-tool }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        jq -e 'type == "array" and length > 0' <<<"$COMPONENTS_JSON" >/dev/null || {
          echo "::error::components must be a non-empty JSON array."
          exit 1
        }
        case "$BUILD_TOOL" in gradle|maven) ;; *) echo "::error::Unsupported build tool '$BUILD_TOOL'."; exit 1 ;; esac
        case "$PROFILE" in none|android|spring-boot) ;; *) echo "::error::Unsupported Java/Kotlin profile '$PROFILE'."; exit 1 ;; esac
        if [[ "$PROFILE" == "android" && "$BUILD_TOOL" != "gradle" ]]; then
          echo "::error::Android profile requires Gradle."
          exit 1
        fi

    - name: Seed Java from read-only runner cache
      shell: bash
      env:
        JAVA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Read-only jobs (same-repository pull requests) get a job-local RUNNER_TOOL_CACHE, so
        # setup-java would download the JDK again. Trusted writers install it under /cache/tool.
        src=/cache/tool/Java_Temurin-Hotspot_jdk
        if [[ "${GHARP_CACHE_MODE:-}" != "ro" || ! -d "$src" || -z "${RUNNER_TOOL_CACHE:-}" ]]; then
          exit 0
        fi
        dest="$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk"
        seeded=()
        while IFS= read -r -d '' dir; do
          name="$(basename "$dir")"
          [[ "$name" == "$JAVA_VERSION" || "$name" == "$JAVA_VERSION".* || "$name" == "$JAVA_VERSION"-* ]] || continue
          [[ ! -e "$dest/$name" ]] || continue
          mkdir -p "$dest"
          cp -a "$dir" "$dest/"
          seeded+=("$name")
        done < <(find "$src" -mindepth 1 -maxdepth 1 -type d -print0)
        if (( ${#seeded[@]} > 0 )); then
          echo "==> Seeded JDK from read-only runner cache: ${seeded[*]}"
        else
          echo "==> No cached JDK $JAVA_VERSION in the read-only runner cache."
        fi

    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ inputs.version }}

    - name: Prepare Android profile
      if: inputs.run-checks == 'true' && inputs.profile == 'android'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin/profiles/android@v1

    - name: Validate Spring Boot profile
      if: inputs.run-checks == 'true' && inputs.profile == 'spring-boot'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin/profiles/spring-boot@v1
      with:
        components: ${{ inputs.components }}
        build-tool: ${{ inputs.build-tool }}

    - name: Run Gradle CI
      if: inputs.run-checks == 'true' && inputs.build-tool == 'gradle'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin/build-tools/gradle@v1
      with:
        components: ${{ inputs.components }}
        profile: ${{ inputs.profile }}

    - name: Run Maven CI
      if: inputs.run-checks == 'true' && inputs.build-tool == 'maven'
      uses: Mooner510/workflows/.github/actions/ci/java-kotlin/build-tools/maven@v1
      with:
        components: ${{ inputs.components }}
        profile: ${{ inputs.profile }}