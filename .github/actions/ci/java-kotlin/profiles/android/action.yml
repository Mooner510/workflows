name: Android profile
description: Prepare Android SDK tooling for Java/Kotlin CI or release jobs.

runs:
  using: composite
  steps:
    - name: Prepare Android SDK paths
      id: cache
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_TOOL_CACHE:-}" == "/opt/cache/tool-cache" ]]; then
          android_sdk="/opt/cache/android-sdk"
        else
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}}"
        fi
        mkdir -p "$android_sdk"
        echo "ANDROID_HOME=$android_sdk" >>"$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$android_sdk" >>"$GITHUB_ENV"

        sdkmanager=""
        if [[ -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager" ]]; then
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
        else
          sdkmanager="$(find "$android_sdk/cmdline-tools" -mindepth 2 -maxdepth 2 -type f -name sdkmanager -perm -u+x -print 2>/dev/null | sort -V | tail -n1 || true)"
        fi
        if [[ -n "$sdkmanager" ]] && [[ -f "$android_sdk/licenses/android-sdk-license" ]]; then
          echo "android_sdk_ready=true" >>"$GITHUB_OUTPUT"
        else
          echo "android_sdk_ready=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Bootstrap Android SDK
      if: steps.cache.outputs.android_sdk_ready != 'true'
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ''

    - name: Configure Android SDK paths
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager="$(command -v sdkmanager 2>/dev/null || true)"
        if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 2 -type f -name sdkmanager -perm -u+x -print 2>/dev/null | sort -V | tail -n1 || true)"
          fi
        fi
        [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || {
          echo "::error::Android sdkmanager is missing after setup."
          exit 1
        }
        sdkmanager_dir="$(dirname "$sdkmanager")"
        echo "$sdkmanager_dir" >>"$GITHUB_PATH"
        echo "$ANDROID_SDK_ROOT/platform-tools" >>"$GITHUB_PATH"
