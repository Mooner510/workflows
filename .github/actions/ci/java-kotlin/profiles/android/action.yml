name: Android profile
description: Prepare Android SDK tooling for Java/Kotlin CI or release jobs.

runs:
  using: composite
  steps:
    - name: Prepare Android SDK paths
      id: cache
      shell: bash
      run: |
        set -euo pipefail
        # Gharp mounts the job's persistent cache volume at /cache: writable on trusted
        # dev/master pushes, read-only on same-repository pull requests.
        if [[ -d /cache && -w /cache ]]; then
          android_sdk="/cache/android-sdk"
          sdk_cache="persistent (read-write)"
        elif [[ -d /cache/android-sdk/licenses && -r /cache/android-sdk ]]; then
          # sdkmanager and AGP install missing packages in place, so the SDK root must be writable,
          # but copying ~500 MB per job wears the runner disk. Build a writable tree of links:
          # each installed package (build-tools/<v>, platforms/<v>, platform-tools, ...) links to
          # the read-only cache, and a missing package installs next to them. Small files
          # (licenses, metadata) and hidden entries (sdkmanager's .sdk store and its lock,
          # .temp download dirs) are copied, so installing a package never writes to the cache.
          android_sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$android_sdk"
          ro_sdk=/cache/android-sdk
          while IFS= read -r -d '' entry; do
            name="$(basename "$entry")"
            case "$name" in
              build-tools|platforms|cmdline-tools|ndk|cmake|system-images|sources|extras|add-ons)
                mkdir -p "$android_sdk/$name"
                while IFS= read -r -d '' package; do
                  if [[ -d "$package" && "$(basename "$package")" != .* ]]; then
                    ln -s "$package" "$android_sdk/$name/$(basename "$package")"
                  else
                    cp -a "$package" "$android_sdk/$name/"
                  fi
                done < <(find "$entry" -mindepth 1 -maxdepth 1 -print0)
                ;;
              licenses|.*)
                cp -a "$entry" "$android_sdk/"
                ;;
              *)
                if [[ -d "$entry" ]]; then
                  ln -s "$entry" "$android_sdk/$name"
                else
                  cp -a "$entry" "$android_sdk/"
                fi
                ;;
            esac
          done < <(find "$ro_sdk" -mindepth 1 -maxdepth 1 -print0)
          sdk_cache="linked to read-only cache"
        else
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}}"
          sdk_cache="none"
        fi
        mkdir -p "$android_sdk"
        echo "==> Android SDK: $android_sdk (cache: $sdk_cache)"
        echo "ANDROID_HOME=$android_sdk" >>"$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$android_sdk" >>"$GITHUB_ENV"

        sdkmanager=""
        if [[ -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager" ]]; then
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
        else
          sdkmanager="$(find "$android_sdk/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -path "*/bin/sdkmanager" -perm -u+x -print 2>/dev/null | sort -V | tail -n1 || true)"
        fi
        if [[ -n "$sdkmanager" ]] && [[ -f "$android_sdk/licenses/android-sdk-license" ]]; then
          echo "android_sdk_ready=true" >>"$GITHUB_OUTPUT"
        else
          echo "android_sdk_ready=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Bootstrap Android SDK
      if: steps.cache.outputs.android_sdk_ready != 'true'
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ''

    - name: Configure Android SDK paths
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager="$(command -v sdkmanager 2>/dev/null || true)"
        if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -path "*/bin/sdkmanager" -perm -u+x -print 2>/dev/null | sort -V | tail -n1 || true)"
          fi
        fi
        [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || {
          echo "::error::Android sdkmanager is missing after setup."
          exit 1
        }
        sdkmanager_dir="$(dirname "$sdkmanager")"
        echo "$sdkmanager_dir" >>"$GITHUB_PATH"
        echo "$ANDROID_SDK_ROOT/platform-tools" >>"$GITHUB_PATH"
