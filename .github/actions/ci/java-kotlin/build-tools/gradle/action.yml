name: Gradle CI
description: Run Gradle wrapper checks for affected Java/Kotlin components.

inputs:
  components:
    description: JSON array of affected Java/Kotlin components normalized to Gradle.
    required: true
  profile:
    description: Java/Kotlin profile (none, android, or spring-boot).
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Gradle cache
      shell: bash
      run: |
        set -euo pipefail
        # Gharp mounts the job's persistent cache volume at /cache: writable on trusted
        # dev/master pushes, read-only on same-repository pull requests.
        if [[ -d /cache && -w /cache ]]; then
          gradle_home="/cache/gradle"
          gradle_cache="persistent (read-write)"
        else
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          gradle_cache="none"
          ro_home="/cache/gradle"
          if [[ -d "$ro_home/caches/modules-2" && -r "$ro_home/caches/modules-2" ]]; then
            # Dependencies are read in place (Gradle's read-only dependency cache). The rest of
            # the Gradle home must be writable, but copying 1-2 GB per job wears the runner
            # disk, so large immutable entries (wrapper distributions, transform workspaces,
            # build cache entries, generated API jars) are linked into a writable tree and only
            # small mutable state (indexes, locks) is copied. This Gradle home is thrown away
            # with the job, so cache cleanup is disabled: it must never touch linked entries.
            echo "GRADLE_RO_DEP_CACHE=$ro_home/caches" >>"$GITHUB_ENV"
            mkdir -p "$gradle_home/caches" "$gradle_home/wrapper/dists" "$gradle_home/init.d"
            cat >"$gradle_home/init.d/gharp-read-only-cache.gradle" <<'GRADLE'
        beforeSettings { settings ->
            settings.caches.cleanup.set(org.gradle.api.cache.Cleanup.DISABLED)
        }
        GRADLE
            started=$SECONDS

            # link_entries SRC DEST MODE: link SRC's child directories into DEST (MODE=all also
            # links regular files); lock and properties files are always copied.
            link_entries() {
              local src="$1" dest="$2" mode="$3" entry name
              mkdir -p "$dest"
              while IFS= read -r -d '' entry; do
                name="$(basename "$entry")"
                if [[ -d "$entry" ]] || [[ "$mode" == all && "$name" != *.lock && "$name" != *.lck && "$name" != *.properties ]]; then
                  ln -s "$entry" "$dest/$name"
                elif [[ "$name" != *.lck ]]; then
                  cp -a "$entry" "$dest/"
                fi
              done < <(find "$src" -mindepth 1 -maxdepth 1 -print0)
            }

            if [[ -d "$ro_home/wrapper/dists" ]]; then
              # dists/<distribution>/<hash>/: the wrapper writes its lock next to the unpacked distribution.
              while IFS= read -r -d '' hash_dir; do
                rel="${hash_dir#"$ro_home/wrapper/dists/"}"
                link_entries "$hash_dir" "$gradle_home/wrapper/dists/$rel" all
              done < <(find "$ro_home/wrapper/dists" -mindepth 2 -maxdepth 2 -type d -print0)
              while IFS= read -r -d '' dist_dir; do
                mkdir -p "$gradle_home/wrapper/dists/$(basename "$dist_dir")"
              done < <(find "$ro_home/wrapper/dists" -mindepth 1 -maxdepth 1 -type d -print0)
            fi

            while IFS= read -r -d '' dir; do
              name="$(basename "$dir")"
              case "$name" in
                build-cache-*)
                  link_entries "$dir" "$gradle_home/caches/$name" all
                  ;;
                transforms-*|jars-*)
                  link_entries "$dir" "$gradle_home/caches/$name" dirs
                  ;;
                [0-9]*)
                  # Per-Gradle-version caches: link the large immutable stores, copy the rest.
                  mkdir -p "$gradle_home/caches/$name"
                  while IFS= read -r -d '' sub; do
                    case "$(basename "$sub")" in
                      transforms) link_entries "$sub" "$gradle_home/caches/$name/transforms" dirs ;;
                      generated-gradle-jars) link_entries "$sub" "$gradle_home/caches/$name/generated-gradle-jars" all ;;
                      *) cp -a "$sub" "$gradle_home/caches/$name/" ;;
                    esac
                  done < <(find "$dir" -mindepth 1 -maxdepth 1 -print0)
                  ;;
                *)
                  cp -a "$dir" "$gradle_home/caches/"
                  ;;
              esac
            done < <(find "$ro_home/caches" -mindepth 1 -maxdepth 1 -type d ! -name modules-2 ! -name journal-1 -print0)
            gradle_cache="linked to read-only cache in $((SECONDS - started))s ($(du -sh "$gradle_home" 2>/dev/null | cut -f1) written)"
          fi
        fi
        mkdir -p "$gradle_home"
        echo "GRADLE_USER_HOME=$gradle_home" >>"$GITHUB_ENV"
        echo "==> Gradle user home: $gradle_home (cache: $gradle_cache)"

    - name: Run Gradle checks
      shell: bash
      env:
        CI: 'true'
        COMPONENTS_JSON: ${{ inputs.components }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        declare -A checked=()

        # Gradle's last lines say how much work was reused; put them in the job summary so a
        # slow run shows whether tasks executed or came from cache.
        summary_started=false
        write_summary() {
          local name="$1" tasks="$2" log="$3" result outcome
          result="$(grep -E '^BUILD (SUCCESSFUL|FAILED) in ' "$log" | tail -n1 || true)"
          outcome="$(grep -E '^[0-9]+ actionable tasks?: ' "$log" | tail -n1 | sed -E 's/^[0-9]+ actionable tasks?: //' || true)"
          [[ -z "$outcome" ]] || echo "==> Gradle tasks for $name: $outcome"
          [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || return 0
          if [[ "$summary_started" != "true" ]]; then
            printf '### Gradle\n\n| Component | Tasks | Result | Tasks run |\n|---|---|---|---|\n' >>"$GITHUB_STEP_SUMMARY"
            summary_started=true
          fi
          printf '| `%s` | `%s` | %s | %s |\n' "$name" "$tasks" "${result:-unknown}" "${outcome:-unknown}" >>"$GITHUB_STEP_SUMMARY"
        }

        while IFS= read -r component_json; do
          name="$(jq -r '.name' <<<"$component_json")"
          path="$(jq -r '.path' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" ]] || { echo "::error::Gradle component '$name' does not exist."; exit 1; }
          [[ -f "$component/gradlew" ]] || { echo "::error::Gradle component '$name' must contain gradlew at its component root."; exit 1; }

          default_tasks="build"
          [[ "$PROFILE" == "android" ]] && default_tasks="lintDebug testDebugUnitTest assembleDebug"
          tasks_string="$(jq -r --arg fallback "$default_tasks" '.gradle_tasks // $fallback' <<<"$component_json")"
          read -r -a tasks <<<"$tasks_string"
          (( ${#tasks[@]} > 0 )) || { echo "::error::Gradle component '$name' has no tasks."; exit 1; }
          for task in "${tasks[@]}"; do
            [[ "$task" =~ ^[A-Za-z0-9_:.-]+$ ]] || { echo "::error::Invalid Gradle task '$task' for '$name'."; exit 1; }
          done

          key="$component|$tasks_string"
          [[ -z "${checked[$key]+x}" ]] || continue
          echo "==> Gradle component: $name ($tasks_string)"
          log="$(mktemp "${RUNNER_TEMP:-/tmp}/gradle-XXXXXX.log")"
          status=0
          (cd "$component" && chmod +x ./gradlew && ./gradlew --no-daemon "${tasks[@]}") 2>&1 | tee "$log" || status=$?
          write_summary "$name" "$tasks_string" "$log"
          rm -f -- "$log"
          (( status == 0 )) || exit "$status"
          checked[$key]=1
        done < <(jq -c '.[]' <<<"$components")
