name: Gradle CI
description: Run Gradle wrapper checks for affected Java/Kotlin components.

inputs:
  components:
    description: JSON array of affected Java/Kotlin components normalized to Gradle.
    required: true
  profile:
    description: Java/Kotlin profile (none, android, or spring-boot).
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Gradle cache
      shell: bash
      run: |
        set -euo pipefail
        # Gharp mounts the job's persistent cache volume at /cache: writable on trusted
        # dev/master pushes, read-only on same-repository pull requests.
        if [[ -d /cache && -w /cache ]]; then
          gradle_home="/cache/gradle"
          gradle_cache="persistent (read-write)"
        else
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          gradle_cache="none"
          ro_home="/cache/gradle"
          if [[ -d "$ro_home/caches/modules-2" && -r "$ro_home/caches/modules-2" ]]; then
            # Dependencies are read in place (Gradle's read-only dependency cache). The wrapper
            # distribution, generated Gradle API jars and the build cache need a writable copy.
            echo "GRADLE_RO_DEP_CACHE=$ro_home/caches" >>"$GITHUB_ENV"
            mkdir -p "$gradle_home/caches" "$gradle_home/wrapper"
            started=$SECONDS
            if [[ -d "$ro_home/wrapper/dists" ]]; then
              cp -a "$ro_home/wrapper/dists" "$gradle_home/wrapper/"
            fi
            while IFS= read -r -d '' dir; do
              cp -a "$dir" "$gradle_home/caches/"
            done < <(find "$ro_home/caches" -mindepth 1 -maxdepth 1 -type d ! -name modules-2 ! -name journal-1 -print0)
            gradle_cache="seeded from read-only cache in $((SECONDS - started))s ($(du -sh "$gradle_home" 2>/dev/null | cut -f1))"
          fi
        fi
        mkdir -p "$gradle_home"
        echo "GRADLE_USER_HOME=$gradle_home" >>"$GITHUB_ENV"
        echo "==> Gradle user home: $gradle_home (cache: $gradle_cache)"

    - name: Run Gradle checks
      shell: bash
      env:
        CI: 'true'
        COMPONENTS_JSON: ${{ inputs.components }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        components="$(jq -c '.' <<<"$COMPONENTS_JSON")"
        declare -A checked=()

        while IFS= read -r component_json; do
          name="$(jq -r '.name' <<<"$component_json")"
          path="$(jq -r '.path' <<<"$component_json")"
          component="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
          [[ -n "$component" ]] || { echo "::error::Gradle component '$name' does not exist."; exit 1; }
          [[ -f "$component/gradlew" ]] || { echo "::error::Gradle component '$name' must contain gradlew at its component root."; exit 1; }

          default_tasks="build"
          [[ "$PROFILE" == "android" ]] && default_tasks="lintDebug testDebugUnitTest assembleDebug"
          tasks_string="$(jq -r --arg fallback "$default_tasks" '.gradle_tasks // $fallback' <<<"$component_json")"
          read -r -a tasks <<<"$tasks_string"
          (( ${#tasks[@]} > 0 )) || { echo "::error::Gradle component '$name' has no tasks."; exit 1; }
          for task in "${tasks[@]}"; do
            [[ "$task" =~ ^[A-Za-z0-9_:.-]+$ ]] || { echo "::error::Invalid Gradle task '$task' for '$name'."; exit 1; }
          done

          key="$component|$tasks_string"
          [[ -z "${checked[$key]+x}" ]] || continue
          echo "==> Gradle component: $name ($tasks_string)"
          (cd "$component" && chmod +x ./gradlew && ./gradlew --no-daemon "${tasks[@]}")
          checked[$key]=1
        done < <(jq -c '.[]' <<<"$components")
