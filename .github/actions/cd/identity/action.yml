name: Resolve repository deployment identity
description: Derive canonical project/service identity, environment-specific Docker network, readable physical container name, and project/service image repository.

inputs:
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  network:
    description: Optional Docker network override. Empty uses project-<repository-name> for prod and project-<repository-name>-dev for dev.
    required: false
    default: ''
  service:
    description: Optional logical service name.
    required: false
    default: ''
  image:
    description: Optional logical image repository name. Empty uses service.
    required: false
    default: ''

outputs:
  project:
    description: Canonical project identifier derived from the caller repository name.
    value: ${{ steps.identity.outputs.project }}
  environment:
    description: Resolved deployment environment.
    value: ${{ steps.identity.outputs.environment }}
  network:
    description: Resolved Docker network name.
    value: ${{ steps.identity.outputs.network }}
  service:
    description: Readable Docker container name in <project>[.<service>][.dev] form.
    value: ${{ steps.identity.outputs.service }}
  image:
    description: Local Docker image repository in project/service form.
    value: ${{ steps.identity.outputs.image }}

runs:
  using: composite
  steps:
    - name: Resolve repository identity
      id: identity
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        NETWORK_INPUT: ${{ inputs.network }}
        SERVICE_INPUT: ${{ inputs.service }}
        IMAGE_INPUT: ${{ inputs.image }}
      run: |
        set -euo pipefail

        [[ "$REPOSITORY" == */* ]] || {
          echo "::error::github.repository must use owner/repository form."
          exit 1
        }
        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac

        repository_name="${REPOSITORY#*/}"
        project="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
        [[ "$project" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || {
          echo "::error::Repository name '$repository_name' cannot be normalized to canonical project naming: ^[a-z][a-z0-9-]{0,62}$."
          exit 1
        }

        network="$NETWORK_INPUT"
        if [[ -z "$network" ]]; then
          network="project-$project"
          [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || network="$network-dev"
        fi
        [[ "$network" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || {
          echo "::error::Invalid Docker network '$network'."
          exit 1
        }

        logical_service="$SERVICE_INPUT"
        logical_image="$IMAGE_INPUT"
        service="$project"
        image=""
        if [[ -n "$logical_service" ]]; then
          [[ "$logical_service" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || { echo "::error::Invalid logical service '$logical_service'."; exit 1; }
          [[ -n "$logical_image" ]] || logical_image="$logical_service"
          [[ "$logical_image" =~ ^[a-z0-9][a-z0-9_./-]*$ ]] || { echo "::error::Invalid logical image '$logical_image'."; exit 1; }

          service="$project.$logical_service"
          image="$project/$logical_image"
        elif [[ -n "$logical_image" ]]; then
          echo "::error::image requires service."
          exit 1
        fi
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || service="$service.dev"

        {
          echo "project=$project"
          echo "environment=$DEPLOY_ENVIRONMENT"
          echo "network=$network"
          echo "service=$service"
          echo "image=$image"
        } >>"$GITHUB_OUTPUT"
