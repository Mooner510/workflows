name: Caddy reverse proxy
description: Register or update one reverse-proxy site for the shared Docker Caddy container and reload it safely.

inputs:
  operation:
    description: apply or remove.
    required: false
    default: apply
  service-name:
    description: Stable service identifier used for the generated site filename.
    required: true
  domain:
    description: Public hostname handled by Caddy. Required for apply.
    required: false
    default: ''
  upstream:
    description: Reverse proxy upstream reachable on caddy-shared, for example api:8080. Required for apply.
    required: false
    default: ''
  caddyfile:
    description: Main Caddyfile which imports the sites directory.
    required: false
    default: /opt/stacks/shared/caddy/Caddyfile
  sites-directory:
    description: Directory imported by the main Caddyfile.
    required: false
    default: /opt/stacks/shared/caddy/sites

runs:
  using: composite
  steps:
    - name: Register Caddy site
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SERVICE_NAME: ${{ inputs.service-name }}
        DOMAIN: ${{ inputs.domain }}
        UPSTREAM: ${{ inputs.upstream }}
        CADDYFILE: ${{ inputs.caddyfile }}
        SITES_DIRECTORY: ${{ inputs.sites-directory }}
      run: |
        set -euo pipefail
        command -v docker >/dev/null || { echo "::error::Docker is required on the deployment runner."; exit 1; }
        docker container inspect shared-caddy >/dev/null 2>&1 || { echo "::error::shared-caddy container does not exist."; exit 1; }
        [[ "$(docker inspect shared-caddy --format '{{.State.Running}}')" == "true" ]] || { echo "::error::shared-caddy container is not running."; exit 1; }
        docker exec shared-caddy test -d /etc/caddy/sites || {
          echo "::error::shared-caddy must mount the host sites directory at /etc/caddy/sites."
          exit 1
        }
        case "$OPERATION" in apply|remove) ;; *) echo "::error::Caddy operation must be apply or remove."; exit 1 ;; esac
        [[ "$SERVICE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid service-name '$SERVICE_NAME'."; exit 1; }
        if [[ "$OPERATION" == "apply" ]]; then
          [[ "$DOMAIN" =~ ^[A-Za-z0-9*.-]+$ ]] || { echo "::error::Invalid Caddy domain '$DOMAIN'."; exit 1; }
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "::error::Invalid Caddy upstream '$UPSTREAM'."; exit 1; }
        fi
        [[ -f "$CADDYFILE" ]] || { echo "::error::Main Caddyfile '$CADDYFILE' does not exist."; exit 1; }
        mkdir -p "$SITES_DIRECTORY"

        site="$SITES_DIRECTORY/$SERVICE_NAME.caddy"
        backup="$RUNNER_TEMP/$SERVICE_NAME.caddy.backup"
        had_previous=false
        if [[ -f "$site" ]]; then
          cp "$site" "$backup"
          had_previous=true
        fi

        if [[ "$OPERATION" == "apply" ]]; then
          tmp="$(mktemp "$SITES_DIRECTORY/.${SERVICE_NAME}.XXXXXX")"
          {
            printf '%s {\n' "$DOMAIN"
            printf '  reverse_proxy %s\n' "$UPSTREAM"
            printf '}\n'
          } >"$tmp"
          mv "$tmp" "$site"
        else
          rm -f "$site"
        fi

        restore() {
          if [[ "$had_previous" == "true" ]]; then cp "$backup" "$site"; else rm -f "$site"; fi
        }

        if ! docker exec shared-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
          restore
          echo "::error::Caddy validation failed; previous site configuration was restored."
          exit 1
        fi
        if ! docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
          restore
          docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || true
          echo "::error::Caddy reload failed; previous site configuration was restored."
          exit 1
        fi
        rm -f "$backup"
        if [[ "$OPERATION" == "remove" ]]; then
          echo "Removed Caddy route for $SERVICE_NAME"
        fi
