name: Docker service rollback
description: Roll back one Docker service to the previous known-good deployment recorded in shared state/history.

inputs:
  production-branch:
    description: Branch whose history is allowed to reach production.
    required: true
  project:
    description: Deprecated compatibility input. Ignored; the caller repository name is always the canonical project identifier.
    required: false
    default: ''
  service-name:
    description: Stable Docker container, state, and Caddy site name.
    required: true
  container-port:
    description: Internal application port.
    required: true
  domain:
    description: Optional compatibility override. Empty reads DEPLOY_DOMAIN from canonical host deploy.env.
    required: false
    default: ''
  db-credential-source:
    description: host reads database credentials from /opt/stacks/projects/<repository-name>/db.env. github is a compatibility mode for caller-provided credentials.
    required: false
    default: host
  env-files-json:
    description: Optional JSON array of additional repository-relative Docker env files. Canonical project host deploy.env is discovered automatically.
    required: false
    default: '[]'
  env-names-json:
    description: JSON array of caller environment variable names forwarded into the Docker container from GitHub Environment secrets or variables.
    required: false
    default: '[]'
  volumes-json:
    description: JSON array of Docker volume specifications.
    required: false
    default: '[]'
  network:
    description: Optional Docker network override. Empty uses project-<repository-name>.
    required: false
    default: ''
  restart-policy:
    description: Docker restart policy.
    required: false
    default: unless-stopped
  init:
    description: Run Docker's built-in init process inside the container.
    required: false
    default: 'false'
  security-opts-json:
    description: JSON array of Docker --security-opt values.
    required: false
    default: '[]'
  cap-drop-json:
    description: JSON array of Linux capabilities to drop.
    required: false
    default: '[]'
  stop-timeout:
    description: Seconds allowed for graceful stop.
    required: false
    default: '15'
  health-path:
    description: HTTP path checked on the loopback host port after rollback.
    required: false
    default: /health
  health-attempts:
    description: Maximum health-check attempts.
    required: false
    default: '20'
  state-root:
    description: Persistent deployment state root.
    required: false
    default: /var/lib/stacks
  caddyfile:
    description: Main Caddyfile importing generated sites.
    required: false
    default: /opt/stacks/shared/caddy/Caddyfile
  caddy-sites-directory:
    description: Directory imported by the main Caddyfile.
    required: false
    default: /opt/stacks/shared/caddy/sites

outputs:
  revision:
    description: Revision restored by the rollback.
    value: ${{ steps.target.outputs.revision }}
  image:
    description: Image reference restored by the rollback.
    value: ${{ steps.target.outputs.image }}
  image-id:
    description: Image ID restored by the rollback.
    value: ${{ steps.target.outputs['image-id'] }}

runs:
  using: composite
  steps:
    - name: Validate production rollback
      uses: $/.github/actions/cd/guard
      with:
        production-branch: ${{ inputs.production-branch }}

    - name: Resolve repository deployment identity
      id: identity
      uses: $/.github/actions/cd/identity
      with:
        network: ${{ inputs.network }}

    - name: Resolve database credentials
      id: credentials
      uses: $/.github/actions/cd/resolve-db-credentials
      with:
        project: ${{ steps.identity.outputs.project }}
        credential-source: ${{ inputs.db-credential-source }}
        migration-engine: none
        env-names-json: ${{ inputs.env-names-json }}

    - name: Resolve runtime environment files
      id: runtime_env
      uses: $/.github/actions/cd/resolve-runtime-env-files
      with:
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        env-files-json: ${{ inputs.env-files-json }}

    - name: Resolve rollback contract
      id: contract
      shell: bash
      env:
        DOMAIN_INPUT: ${{ inputs.domain }}
        DEPLOY_DOMAIN: ${{ steps.runtime_env.outputs['deploy-domain'] }}
        HEALTH_PATH: ${{ inputs.health-path }}
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        HOST_ENV_KEYS_JSON: ${{ steps.runtime_env.outputs.env-keys-json }}
      run: |
        set -euo pipefail
        [[ "$HEALTH_PATH" == /* ]] || { echo "::error::health-path must start with '/'."; exit 1; }

        domain="$DOMAIN_INPUT"
        [[ -n "$domain" ]] || domain="$DEPLOY_DOMAIN"

        [[ "$domain" =~ ^[A-Za-z0-9*.-]+$ ]] || {
          echo "::error::DEPLOY_DOMAIN is required in the canonical deploy.env and must be a valid hostname."
          exit 1
        }

        if [[ -n "$ENV_NAMES_JSON" && "$ENV_NAMES_JSON" != "[]" ]]; then
          command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_NAMES_JSON" >/dev/null || {
            echo "::error::env-names-json must be a JSON array of strings."
            exit 1
          }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$HOST_ENV_KEYS_JSON" >/dev/null || {
            echo "::error::resolved host env keys must be a JSON array of strings."
            exit 1
          }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid environment variable name '$name'."; exit 1; }
            if [[ -v "$name" ]]; then
              continue
            fi
            if jq -e --arg name "$name" 'index($name) != null' <<<"$HOST_ENV_KEYS_JSON" >/dev/null; then
              continue
            fi
            echo "::error::Environment variable '$name' is neither set on the caller rollback step nor present in the canonical project deploy.env."
            exit 1
          done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")
        fi

        echo "domain=$domain" >>"$GITHUB_OUTPUT"

    - name: Merge container environment names
      id: container_env
      shell: bash
      env:
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        RESOLVED_ENV_NAMES_JSON: ${{ steps.credentials.outputs.resolved-env-names-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        caller_set='[]'
        while IFS= read -r name; do
          if [[ -v "$name" ]]; then
            caller_set="$(jq -c --arg name "$name" '. + [$name]' <<<"$caller_set")"
          fi
        done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")
        merged="$(jq -cn --argjson caller "$caller_set" --argjson resolved "$RESOLVED_ENV_NAMES_JSON" '$caller + $resolved | unique')"
        echo "env_names_json=$merged" >>"$GITHUB_OUTPUT"

    - name: Read current known-good deployment
      id: current
      uses: $/.github/actions/cd/state
      with:
        operation: read
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        root: ${{ inputs.state-root }}

    - name: Read previous known-good deployment
      id: target
      uses: $/.github/actions/cd/state
      with:
        operation: previous
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        root: ${{ inputs.state-root }}

    - name: Validate rollback target
      shell: bash
      env:
        CURRENT_EXISTS: ${{ steps.current.outputs.exists }}
        TARGET_EXISTS: ${{ steps.target.outputs.exists }}
        TARGET_IMAGE_ID: ${{ steps.target.outputs['image-id'] }}
      run: |
        set -euo pipefail
        [[ "$CURRENT_EXISTS" == "true" ]] || { echo "::error::No current deployment state exists for this service."; exit 1; }
        [[ "$TARGET_EXISTS" == "true" && -n "$TARGET_IMAGE_ID" ]] || { echo "::error::No previous known-good deployment is available to roll back to."; exit 1; }
        docker image inspect "$TARGET_IMAGE_ID" >/dev/null 2>&1 || { echo "::error::Previous known-good image $TARGET_IMAGE_ID is not available on this Docker host."; exit 1; }

    - name: Deploy previous known-good image
      id: rollback
      uses: $/.github/actions/cd/docker/deploy
      with:
        container-name: ${{ inputs.service-name }}
        image: ${{ steps.target.outputs['image-id'] }}
        container-port: ${{ inputs.container-port }}
        env-files-json: ${{ steps.runtime_env.outputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json != '[]' && inputs.volumes-json || steps.runtime_env.outputs.deploy-volumes-json }}
        network: ${{ steps.identity.outputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
        restore-previous-on-failure: 'true'

    - name: Verify rolled back service
      id: rollback_health
      uses: $/.github/actions/cd/docker/health
      with:
        url: http://127.0.0.1:${{ steps.rollback.outputs['published-port'] }}${{ inputs.health-path }}
        attempts: ${{ inputs.health-attempts }}

    - name: Register Caddy route
      id: caddy
      uses: $/.github/actions/cd/caddy
      with:
        service-name: ${{ inputs.service-name }}
        domain: ${{ steps.contract.outputs.domain }}
        upstream: ${{ inputs.service-name }}:${{ inputs.container-port }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Record successful manual rollback
      id: record
      uses: $/.github/actions/cd/state
      with:
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ steps.target.outputs.revision }}
        image: ${{ steps.target.outputs.image }}
        image-id: ${{ steps.target.outputs['image-id'] }}
        event: rollback
        root: ${{ inputs.state-root }}

    - name: Restore original deployment after rollback failure
      id: restore
      if: failure() && steps.rollback.outcome == 'success' && steps.current.outputs.exists == 'true'
      uses: $/.github/actions/cd/docker/deploy
      with:
        container-name: ${{ inputs.service-name }}
        image: ${{ steps.current.outputs['image-id'] }}
        container-port: ${{ inputs.container-port }}
        env-files-json: ${{ steps.runtime_env.outputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json != '[]' && inputs.volumes-json || steps.runtime_env.outputs.deploy-volumes-json }}
        network: ${{ steps.identity.outputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
        restore-previous-on-failure: 'false'

    - name: Verify restored original deployment
      id: restore_health
      if: failure() && steps.restore.outcome == 'success'
      uses: $/.github/actions/cd/docker/health
      with:
        url: http://127.0.0.1:${{ steps.restore.outputs['published-port'] }}${{ inputs.health-path }}
        attempts: ${{ inputs.health-attempts }}

    - name: Restore original Caddy route
      id: restore_caddy
      if: failure() && steps.restore_health.outcome == 'success'
      uses: $/.github/actions/cd/caddy
      with:
        service-name: ${{ inputs.service-name }}
        domain: ${{ steps.contract.outputs.domain }}
        upstream: ${{ inputs.service-name }}:${{ inputs.container-port }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Restore original deployment state
      if: failure() && steps.restore_health.outcome == 'success' && steps.restore_caddy.outcome == 'success'
      uses: $/.github/actions/cd/state
      with:
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ steps.current.outputs.revision }}
        image: ${{ steps.current.outputs.image }}
        image-id: ${{ steps.current.outputs['image-id'] }}
        event: rollback-restore
        root: ${{ inputs.state-root }}
