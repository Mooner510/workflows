name: Android production release
description: Canonical Android release entrypoint using andr-managed host signing material and service runtime configuration.

inputs:
  production-branch:
    description: Production branch. Empty uses repository default branch.
    required: false
    default: ''
  working-directory:
    description: Android project root relative to repository.
    required: true
  service-name:
    description: Host service directory containing Android release config/signing material.
    required: false
    default: android
  java-version:
    description: Java version.
    required: false
    default: '17'
  gradle-task:
    description: Gradle release task.
    required: false
    default: assembleRelease
  artifact-glob:
    description: Artifact glob relative to working-directory.
    required: false
    default: app/build/outputs/apk/release/*.apk
  version:
    description: Optional semantic version for manual production release builds, without a leading v.
    required: false
    default: ''
  version-env-prefix:
    description: Optional prefix for <PREFIX>_VERSION_NAME and <PREFIX>_VERSION_CODE.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve Android release operation
      id: contract
      shell: bash
      env:
        BRANCH_INPUT: ${{ inputs.production-branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        SERVICE: ${{ inputs.service-name }}
        VERSION_PREFIX: ${{ inputs.version-env-prefix }}
        VERSION_INPUT: ${{ inputs.version }}
        ACTOR: ${{ github.actor }}
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        branch="$BRANCH_INPUT"; [[ -n "$branch" ]] || branch="$DEFAULT_BRANCH"
        [[ -n "$branch" ]] || { echo "::error::Unable to resolve production branch."; exit 1; }
        [[ "$EVENT_NAME" == "workflow_dispatch" ]] || {
          echo "::error::Android production release supports only workflow_dispatch."
          exit 1
        }
        [[ "$ACTOR" == "Mooner510" && "$TRIGGERING_ACTOR" == "Mooner510" ]] || {
          echo "::error::Android production deployment is restricted to Mooner510."
          exit 1
        }
        checkout_ref="$branch"
        version="$VERSION_INPUT"
        if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must match MAJOR.MINOR.PATCH."
          exit 1
        fi
        project="${GITHUB_REPOSITORY#*/}"
        root="/opt/stacks/projects/$project/$SERVICE"
        signing_env="$root/secret/android/signing.env"
        keystore="$root/secret/android/release.jks"
        [[ -f "$signing_env" ]] || { echo "::error::Missing andr signing config: $signing_env"; exit 1; }
        [[ -f "$keystore" ]] || { echo "::error::Missing andr keystore: $keystore"; exit 1; }

        {
          echo "branch=$branch"
          echo "checkout_ref=$checkout_ref"
          echo "keystore=$keystore"
          echo "version=$version"
        } >>"$GITHUB_OUTPUT"

    - name: Checkout release revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ steps.contract.outputs.checkout_ref }}

    - name: Load Android release configuration
      shell: bash
      env:
        SERVICE: ${{ inputs.service-name }}
        VERSION_PREFIX: ${{ inputs.version-env-prefix }}
        VERSION: ${{ steps.contract.outputs.version }}
      run: |
        set -euo pipefail
        project="${GITHUB_REPOSITORY#*/}"
        root="/opt/stacks/projects/$project/$SERVICE"
        runtime="$root/deploy.env"
        signing="$root/secret/android/signing.env"

        export_env_file() {
          local file="$1"
          [[ -f "$file" ]] || return 0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//$'\r'/}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            [[ "$line" == *=* ]] || { echo "::error::Invalid env assignment in $file."; exit 1; }
            key="${line%%=*}"
            value="${line#*=}"
            key="$(printf '%s' "$key" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid env key '$key' in $file."; exit 1; }
            {
              echo "${key}<<__ANDROID_ENV__"
              printf '%s\n' "$value"
              echo "__ANDROID_ENV__"
            } >>"$GITHUB_ENV"
          done <"$file"
        }

        export_env_file "$runtime"
        export_env_file "$signing"

        # andr canonical keys.
        set -a
        # shellcheck disable=SC1090
        source "$signing"
        set +a

        for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          [[ -n "${!name:-}" ]] || { echo "::error::$name is missing from $signing."; exit 1; }
          echo "::add-mask::${!name}"
          {
            echo "${name}<<__ANDROID_SIGNING__"
            printf '%s\n' "${!name}"
            echo "__ANDROID_SIGNING__"
          } >>"$GITHUB_ENV"
        done

        if [[ -n "$VERSION_PREFIX" ]]; then
          [[ "$VERSION_PREFIX" =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error::version-env-prefix must be uppercase env prefix."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A stable release version is required for version-env-prefix."; exit 1; }
          IFS=. read -r major minor patch <<<"$VERSION"
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code > 0 && code <= 2100000000 )) || { echo "::error::Computed Android versionCode is invalid."; exit 1; }
          {
            echo "${VERSION_PREFIX}_VERSION_NAME=$VERSION"
            echo "${VERSION_PREFIX}_VERSION_CODE=$code"
          } >>"$GITHUB_ENV"
        fi

    - name: Build and sign Android release
      uses: Mooner510/workflows/.github/actions/cd/android/release@v1
      with:
        production-branch: ${{ steps.contract.outputs.branch }}
        working-directory: ${{ inputs.working-directory }}
        java-version: ${{ inputs.java-version }}
        gradle-task: ${{ inputs.gradle-task }}
        artifact-glob: ${{ inputs.artifact-glob }}
        keystore-path: ${{ steps.contract.outputs.keystore }}
