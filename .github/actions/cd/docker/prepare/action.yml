name: Prepare canonical Docker image
description: Build and scan one deployable service using the fixed service-path Dockerfile and repository-root build context.

inputs:
  service:
    description: Canonical normalized service JSON from the project contract loader.
    required: true
  environment:
    description: prod or dev; selects non-secret build-argument config only.
    required: true
  private-repo-token:
    description: Optional read-only GitHub token exposed only as the CI_PRIVATE_REPO_TOKEN BuildKit secret.
    required: false
    default: ''

outputs:
  image:
    value: ${{ steps.build.outputs.image }}
  image-id:
    value: ${{ steps.build.outputs.image_id }}
  exposed-port:
    value: ${{ steps.build.outputs.exposed_port }}

runs:
  using: composite
  steps:
    - name: Build and scan temporary image
      id: build
      shell: bash
      env:
        SERVICE_JSON: ${{ inputs.service }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        CI_PRIVATE_REPO_TOKEN: ${{ inputs.private-repo-token }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        command -v docker >/dev/null || { echo "::error::Docker is required."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }

        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac

        service="$(jq -r '.name' <<<"$SERVICE_JSON")"
        path="$(jq -r '.path' <<<"$SERVICE_JSON")"
        [[ "$service" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || { echo "::error::Invalid service '$service'."; exit 1; }

        repository_name="${GITHUB_REPOSITORY#*/}"
        project="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
        [[ "$project" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || { echo "::error::Invalid canonical project '$project'."; exit 1; }

        workspace="$(realpath -e "$GITHUB_WORKSPACE")"
        service_root="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
        [[ -n "$service_root" && ( "$service_root" == "$workspace" || "$service_root" == "$workspace/"* ) ]] || {
          echo "::error::Service path must resolve inside the repository: $path"
          exit 1
        }
        dockerfile="$service_root/Dockerfile"
        [[ -f "$dockerfile" ]] || { echo "::error::Canonical Dockerfile is missing: $path/Dockerfile"; exit 1; }

        env_file="deploy.env"
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || env_file="deploy.dev.env"
        project_config="/opt/stacks/projects/$project/$env_file"
        service_config="/opt/stacks/projects/$project/$service/$env_file"

        read_env_value() {
          local key="$1" file="$2" line value
          [[ -f "$file" ]] || return 1
          line="$(grep -E "^[[:space:]]*${key}=" "$file" | tail -n1 || true)"
          [[ -n "$line" ]] || return 1
          value="${line#*=}"
          value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if (( ${#value} >= 2 )); then
            if [[ "${value:0:1}" == '"' && "${value: -1}" == '"' ]]; then
              value="${value:1:${#value}-2}"
            elif [[ "${value:0:1}" == "'" && "${value: -1}" == "'" ]]; then
              value="${value:1:${#value}-2}"
            fi
          fi
          printf '%s' "$value"
        }

        build_args=()
        while IFS= read -r key; do
          [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid build argument '$key'."; exit 1; }
          value=""
          if read_env_value "$key" "$service_config" >/dev/null 2>&1; then
            value="$(read_env_value "$key" "$service_config")"
          elif read_env_value "$key" "$project_config" >/dev/null 2>&1; then
            value="$(read_env_value "$key" "$project_config")"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "::warning::Build argument '$key' is absent from canonical $env_file config; PR validation will rely on the Dockerfile's CI-safe default."
              continue
            fi
            echo "::error::Build argument '$key' is not defined in canonical non-secret $env_file config."
            exit 1
          fi
          build_args+=(--build-arg "$key=$value")
        done < <(jq -r '.build_args[]' <<<"$SERVICE_JSON")

        temp_tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || temp_tag="dev-$temp_tag"
        image="$project/$service:$temp_tag"

        args=(
          docker build
          -f "$dockerfile"
          -t "$image"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "kr.mooner510.stacks.project=$project"
          --label "kr.mooner510.stacks.service=$service"
          --label "kr.mooner510.stacks.environment=$DEPLOY_ENVIRONMENT"
        )
        args+=("${build_args[@]}")
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          args+=(--build-arg "CI=true")
        fi
        if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
          echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
          args+=(--secret "id=CI_PRIVATE_REPO_TOKEN,env=CI_PRIVATE_REPO_TOKEN")
        fi
        args+=("$workspace")

        echo "==> Building temporary image $image"
        DOCKER_BUILDKIT=1 "${args[@]}"

        inspect="$(docker image inspect "$image")"
        exposed="$(jq -c '.[0].Config.ExposedPorts // {} | keys' <<<"$inspect")"
        if jq -e 'any(.[]; endswith("/tcp") | not)' <<<"$exposed" >/dev/null; then
          docker image rm -f "$image" >/dev/null 2>&1 || true
          echo "::error::Deployable images may expose only the single canonical TCP service port."
          exit 1
        fi
        exposed_count="$(jq 'length' <<<"$exposed")"
        (( exposed_count <= 1 )) || {
          docker image rm -f "$image" >/dev/null 2>&1 || true
          echo "::error::Deployable image exposes more than one TCP port; exactly zero or one is allowed."
          exit 1
        }
        exposed_port=""
        if (( exposed_count == 1 )); then
          exposed_port="$(jq -r '.[0] | sub("/tcp$";"")' <<<"$exposed")"
          [[ "$exposed_port" =~ ^[0-9]+$ ]] && (( exposed_port >= 1 && exposed_port <= 65535 )) || {
            docker image rm -f "$image" >/dev/null 2>&1 || true
            echo "::error::Invalid canonical EXPOSE port '$exposed_port'."
            exit 1
          }
        fi

        health_test="$(jq -c '.[0].Config.Healthcheck.Test // []' <<<"$inspect")"
        if (( exposed_count == 1 )); then
          jq -e 'type=="array" and length>0 and .[0] != "NONE"' <<<"$health_test" >/dev/null || {
            docker image rm -f "$image" >/dev/null 2>&1 || true
            echo "::error::Routable images must define a Docker HEALTHCHECK."
            exit 1
          }
        fi

        echo "==> Trivy image vulnerability scan (HIGH/CRITICAL)"
        archive="$(mktemp "$RUNNER_TEMP/stacks-image-XXXXXX.tar")"
        scanner=""
        cleanup() {
          rm -f "$archive"
          [[ -z "$scanner" ]] || docker rm -f "$scanner" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        docker save "$image" -o "$archive"
        # docker cp preserves the source mode. mktemp creates 0600 files, while
        # the pinned Trivy image runs as a non-root user and must be able to
        # read the archive inside the scanner container.
        chmod 0644 "$archive"
        scan_args=(--cap-drop=ALL --security-opt=no-new-privileges)
        if [[ "${RUNNER_TOOL_CACHE:-}" == "/opt/cache/tool-cache" ]]; then
          mkdir -p /opt/cache/tool-cache/trivy
          scan_args+=(-v /opt/cache/tool-cache/trivy:/root/.cache/trivy)
        fi
        scanner="$(docker create "${scan_args[@]}"           ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969           image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1           --no-progress --skip-version-check)"
        docker cp "$archive" "$scanner:/image.tar"

        set +e
        docker start --attach "$scanner"
        scan_rc=$?
        set -e
        docker rm -f "$scanner" >/dev/null 2>&1 || true
        scanner=""
        rm -f "$archive"
        trap - EXIT

        if (( scan_rc != 0 )); then
          docker image rm -f "$image" >/dev/null 2>&1 || true
          echo "::error::Temporary image failed the HIGH/CRITICAL vulnerability gate."
          exit "$scan_rc"
        fi

        image_id="$(docker image inspect "$image" --format '{{.Id}}')"
        {
          echo "image=$image"
          echo "image_id=$image_id"
          echo "exposed_port=$exposed_port"
        } >>"$GITHUB_OUTPUT"
