name: Prepare isolated OCI image
description: Build and scan one deployable service through the Gharp rootless BuildKit boundary without host runtime access.

inputs:
  service:
    description: Canonical normalized service JSON from the project contract loader.
    required: true
  environment:
    description: prod or dev; used only as artifact metadata.
    required: true
  private-repo-token:
    description: Optional read-only GitHub token exposed only as a BuildKit secret.
    required: false
    default: ''

outputs:
  image:
    value: ${{ steps.build.outputs.image }}
  image-id:
    value: ${{ steps.build.outputs.image_id }}
  manifest-digest:
    value: ${{ steps.build.outputs.manifest_digest }}
  exposed-port:
    value: ${{ steps.build.outputs.exposed_port }}
  artifact-path:
    value: ${{ steps.build.outputs.artifact_path }}

runs:
  using: composite
  steps:
    - name: Set up isolated BuildKit
      uses: Mooner510/workflows/.github/actions/ci/buildkit@d57afcd9d167b3ac6dd9b6851acbb5dec1b7475e

    - name: Build and scan OCI artifact
      id: build
      shell: bash
      env:
        SERVICE_JSON: ${{ inputs.service }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        CI_PRIVATE_REPO_TOKEN: ${{ inputs.private-repo-token }}
      run: |
        set -euo pipefail

        command -v buildctl >/dev/null || { echo "::error::buildctl is required."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        command -v curl >/dev/null || { echo "::error::curl is required."; exit 1; }
        command -v sha256sum >/dev/null || { echo "::error::sha256sum is required."; exit 1; }

        case "$DEPLOY_ENVIRONMENT" in
          prod|dev) ;;
          *) echo "::error::environment must be prod or dev."; exit 1 ;;
        esac

        service="$(jq -r '.name' <<<"$SERVICE_JSON")"
        path="$(jq -r '.path' <<<"$SERVICE_JSON")"
        [[ "$service" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || {
          echo "::error::Invalid service '$service'."
          exit 1
        }

        build_args="$(jq -c '.build_args // []' <<<"$SERVICE_JSON")"
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$build_args" >/dev/null || {
          echo "::error::service.build_args must be a string array."
          exit 1
        }
        if [[ "$(jq 'length' <<<"$build_args")" -ne 0 ]]; then
          echo "::error::Isolated CI does not read build arguments from host /opt/stacks state."
          echo "::error::Move non-secret build configuration into a repository-owned build contract before enabling this service."
          exit 1
        fi

        repository_name="${GITHUB_REPOSITORY#*/}"
        project="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
        [[ "$project" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || {
          echo "::error::Invalid canonical project '$project'."
          exit 1
        }

        workspace="$(realpath -e "$GITHUB_WORKSPACE")"
        service_root="$(realpath -e "$GITHUB_WORKSPACE/$path" 2>/dev/null || true)"
        [[ -n "$service_root" && ( "$service_root" == "$workspace" || "$service_root" == "$workspace/"* ) ]] || {
          echo "::error::Service path must resolve inside the repository: $path"
          exit 1
        }
        [[ -f "$service_root/Dockerfile" ]] || {
          echo "::error::Canonical Dockerfile is missing: $path/Dockerfile"
          exit 1
        }

        artifact_root="$RUNNER_TEMP/oci-$service"
        archive="$artifact_root/image.oci.tar"
        layout="$artifact_root/layout"
        metadata="$artifact_root/metadata.json"
        rm -rf "$artifact_root"
        mkdir -p "$artifact_root" "$layout"

        args=(
          buildctl
          --addr "$BUILDKIT_HOST"
          build
          --frontend dockerfile.v0
          --local "context=$workspace"
          --local "dockerfile=$service_root"
          --opt filename=Dockerfile
          --metadata-file "$metadata"
          --output "type=oci,dest=$archive,name=$project/$service:$GITHUB_SHA"
        )
        if [[ -n "${CI_PRIVATE_REPO_TOKEN:-}" ]]; then
          echo "::add-mask::$CI_PRIVATE_REPO_TOKEN"
          args+=(--secret id=CI_PRIVATE_REPO_TOKEN,env=CI_PRIVATE_REPO_TOKEN)
        fi

        echo "==> Building isolated OCI artifact $project/$service@$GITHUB_SHA"
        "${args[@]}"

        tar -xf "$archive" -C "$layout"

        manifest_digest="$(jq -r '.["containerimage.digest"] // empty' "$metadata")"
        config_digest="$(jq -r '.["containerimage.config.digest"] // empty' "$metadata")"
        [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo "::error::BuildKit did not emit a valid manifest digest."
          exit 1
        }
        [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo "::error::BuildKit did not emit a valid config digest."
          exit 1
        }

        config_blob="$layout/blobs/sha256/${config_digest#sha256:}"
        [[ -f "$config_blob" ]] || {
          echo "::error::OCI config blob is missing from exported artifact."
          exit 1
        }

        exposed="$(jq -c '.config.ExposedPorts // {} | keys' "$config_blob")"
        if jq -e 'any(.[]; endswith("/tcp") | not)' <<<"$exposed" >/dev/null; then
          echo "::error::Deployable images may expose only TCP service ports."
          exit 1
        fi
        exposed_count="$(jq 'length' <<<"$exposed")"
        (( exposed_count <= 1 )) || {
          echo "::error::Deployable image exposes more than one TCP port."
          exit 1
        }

        exposed_port=""
        if (( exposed_count == 1 )); then
          exposed_port="$(jq -r '.[0] | sub("/tcp$";"")' <<<"$exposed")"
          [[ "$exposed_port" =~ ^[0-9]+$ ]] && (( exposed_port >= 1 && exposed_port <= 65535 )) || {
            echo "::error::Invalid canonical EXPOSE port '$exposed_port'."
            exit 1
          }
          jq -e '.config.Healthcheck.Test | type=="array" and length>0 and .[0] != "NONE"' "$config_blob" >/dev/null || {
            echo "::error::Routable images must define a HEALTHCHECK."
            exit 1
          }
        fi

        trivy_version="0.74.0"
        trivy_expected="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        trivy_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/trivy/$trivy_version"
        trivy="$trivy_root/trivy"
        if [[ ! -x "$trivy" ]]; then
          trivy_archive="$(mktemp "$RUNNER_TEMP/trivy-XXXXXX.tar.gz")"
          trap 'rm -f "$trivy_archive"' EXIT
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v$trivy_version/trivy_${trivy_version}_Linux-64bit.tar.gz" -o "$trivy_archive"
          printf '%s  %s\n' "$trivy_expected" "$trivy_archive" | sha256sum -c -
          mkdir -p "$trivy_root"
          tar -xzf "$trivy_archive" -C "$trivy_root" trivy
          chmod 0755 "$trivy"
          rm -f "$trivy_archive"
          trap - EXIT
        fi

        echo "==> Trivy isolated OCI vulnerability scan (HIGH/CRITICAL)"
        "$trivy" image           --input "$layout"           --scanners vuln           --severity HIGH,CRITICAL           --exit-code 1           --no-progress           --skip-version-check

        image="$project/$service:$GITHUB_SHA"
        {
          echo "image=$image"
          echo "image_id=$config_digest"
          echo "manifest_digest=$manifest_digest"
          echo "exposed_port=$exposed_port"
          echo "artifact_path=$archive"
        } >>"$GITHUB_OUTPUT"
