name: Docker build
description: Build a production Docker image from a repository component.

inputs:
  working-directory:
    description: Docker build context relative to the caller repository.
    required: true
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  image-name:
    description: Local Docker image repository name without a tag.
    required: true
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  build-args-json:
    description: JSON array of non-secret KEY=VALUE build arguments.
    required: false
    default: '[]'
  secret-env-names-json:
    description: JSON array of caller environment variable names exposed to Docker BuildKit as secret ids with the same names.
    required: false
    default: '[]'

outputs:
  image:
    description: Built image reference tagged with GITHUB_SHA.
    value: ${{ steps.build.outputs.image }}
  image-id:
    description: Docker image ID.
    value: ${{ steps.build.outputs.image_id }}

runs:
  using: composite
  steps:
    - name: Build image
      id: build
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE_NAME: ${{ inputs.image-name }}
        TARGET: ${{ inputs.target }}
        BUILD_ARGS_JSON: ${{ inputs.build-args-json }}
        SECRET_ENV_NAMES_JSON: ${{ inputs.secret-env-names-json }}
      run: |
        set -euo pipefail
        command -v docker >/dev/null || { echo "::error::Docker is required on the deployment runner."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        command -v base64 >/dev/null || { echo "::error::base64 is required on the deployment runner."; exit 1; }

        [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || { echo "::error::image-name must be a lowercase local Docker repository name without a tag."; exit 1; }
        [[ -n "${GITHUB_SHA:-}" ]] || { echo "::error::GITHUB_SHA is required."; exit 1; }
        if [[ -n "$TARGET" && ! "$TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::Invalid Docker target '$TARGET'."
          exit 1
        fi
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$BUILD_ARGS_JSON" >/dev/null || {
          echo "::error::build-args-json must be a JSON array of strings."
          exit 1
        }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$SECRET_ENV_NAMES_JSON" >/dev/null || {
          echo "::error::secret-env-names-json must be a JSON array of strings."
          exit 1
        }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        context="$(realpath -e "$GITHUB_WORKSPACE/$WORKING_DIRECTORY" 2>/dev/null || true)"
        if [[ -z "$context" ]] || { [[ "$context" != "$workspace" ]] && [[ "$context" != "$workspace/"* ]]; }; then
          echo "::error::working-directory must resolve inside the caller repository."
          exit 1
        fi
        if [[ -z "$DOCKERFILE" || "$DOCKERFILE" == /* || "$DOCKERFILE" == *'..'* ]]; then
          echo "::error::dockerfile must be a safe path relative to working-directory."
          exit 1
        fi
        dockerfile="$(realpath -e "$context/$DOCKERFILE" 2>/dev/null || true)"
        [[ -f "$dockerfile" ]] || { echo "::error::Dockerfile '$DOCKERFILE' does not exist."; exit 1; }

        image="$IMAGE_NAME:$GITHUB_SHA"
        args=(docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f "$dockerfile" -t "$image")
        [[ -z "$TARGET" ]] || args+=(--target "$TARGET")
        while IFS= read -r encoded; do
          value="$(printf '%s' "$encoded" | base64 --decode)"
          [[ "$value" == *=* ]] || { echo "::error::Docker build arguments must use KEY=VALUE form."; exit 1; }
          args+=(--build-arg "$value")
        done < <(jq -r '.[] | @base64' <<<"$BUILD_ARGS_JSON")
        while IFS= read -r name; do
          [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid build secret environment variable name '$name'."; exit 1; }
          [[ -v "$name" ]] || { echo "::error::Build secret environment variable '$name' is not set in the caller step."; exit 1; }
          args+=(--secret "id=$name,env=$name")
        done < <(jq -r '.[]' <<<"$SECRET_ENV_NAMES_JSON")
        args+=("$context")

        echo "==> Building $image"
        DOCKER_BUILDKIT=1 "${args[@]}"

        echo "==> Scanning built image for HIGH/CRITICAL vulnerabilities"
        archive="$(mktemp "$RUNNER_TEMP/workflows-image-XXXXXX.tar")"
        container=""
        cleanup_scan() {
          rm -f "$archive"
          if [[ -n "$container" ]]; then
            docker rm -f "$container" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup_scan EXIT

        docker save "$image" -o "$archive"
        scan_args=(--cap-drop=ALL --security-opt=no-new-privileges)
        if [[ "${RUNNER_TOOL_CACHE:-}" == "/opt/cache/tool-cache" ]]; then
          mkdir -p /opt/cache/tool-cache/trivy
          scan_args+=(-v /opt/cache/tool-cache/trivy:/root/.cache/trivy)
        fi
        container="$(docker create "${scan_args[@]}"           ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969           image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1             --no-progress --skip-version-check)"
        docker cp "$archive" "$container:/image.tar"

        set +e
        docker start --attach "$container"
        scan_rc=$?
        set -e
        docker rm -f "$container" >/dev/null 2>&1 || true
        container=""
        rm -f "$archive"
        trap - EXIT
        if (( scan_rc != 0 )); then
          docker image rm -f "$image" >/dev/null 2>&1 || true
          echo "::error::Built image failed the HIGH/CRITICAL vulnerability gate."
          exit "$scan_rc"
        fi

        image_id="$(docker image inspect "$image" --format '{{.Id}}')"
        {
          echo "image=$image"
          echo "image_id=$image_id"
        } >>"$GITHUB_OUTPUT"
