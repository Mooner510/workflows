name: Docker deploy
description: Replace one local Docker service container, publish a loopback health port, and attach it to the shared Caddy proxy network.

inputs:
  project:
    description: Canonical project identifier used for management labels.
    required: false
    default: ''
  service:
    description: Logical service identifier used for management labels.
    required: false
    default: ''
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  container-name:
    description: Docker container name.
    required: true
  image:
    description: Docker image reference to run.
    required: true
  container-port:
    description: Internal application port.
    required: true
  env-files-json:
    description: JSON array of resolved Docker env-file paths. Repository-relative files and canonical host files under /opt/stacks/projects are accepted.
    required: false
    default: '[]'
  env-names-json:
    description: JSON array of environment variable names inherited from the caller and forwarded with docker -e NAME.
    required: false
    default: '[]'
  volumes-json:
    description: JSON array of Docker volume specifications.
    required: false
    default: '[]'
  network:
    description: Optional project Docker network name.
    required: false
    default: ''
  proxy-network:
    description: Shared reverse-proxy Docker network attached in addition to the project network.
    required: false
    default: caddy-shared
  restart-policy:
    description: Docker restart policy.
    required: false
    default: unless-stopped
  init:
    description: Run Docker's built-in init process inside the container.
    required: false
    default: 'false'
  security-opts-json:
    description: JSON array of Docker --security-opt values.
    required: false
    default: '[]'
  cap-drop-json:
    description: JSON array of Linux capabilities to drop.
    required: false
    default: '[]'
  stop-timeout:
    description: Seconds allowed for graceful stop.
    required: false
    default: '15'
  restore-previous-on-failure:
    description: Restore the replaced image when the requested image cannot start.
    required: false
    default: 'true'

outputs:
  published-port:
    description: Docker-assigned loopback published port for the running container.
    value: ${{ steps.deploy.outputs.published_port }}

runs:
  using: composite
  steps:
    - name: Replace container
      id: deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        LOGICAL_SERVICE: ${{ inputs.service }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        IMAGE: ${{ inputs.image }}
        CONTAINER_PORT: ${{ inputs.container-port }}
        ENV_FILES_JSON: ${{ inputs.env-files-json }}
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        VOLUMES_JSON: ${{ inputs.volumes-json }}
        NETWORK: ${{ inputs.network }}
        PROXY_NETWORK: ${{ inputs.proxy-network }}
        RESTART_POLICY: ${{ inputs.restart-policy }}
        INIT: ${{ inputs.init }}
        SECURITY_OPTS_JSON: ${{ inputs.security-opts-json }}
        CAP_DROP_JSON: ${{ inputs.cap-drop-json }}
        STOP_TIMEOUT: ${{ inputs.stop-timeout }}
        RESTORE_PREVIOUS_ON_FAILURE: ${{ inputs.restore-previous-on-failure }}
      run: |
        set -euo pipefail
        command -v docker >/dev/null || { echo "::error::Docker is required on the deployment runner."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }
        command -v base64 >/dev/null || { echo "::error::base64 is required on the self-hosted runner."; exit 1; }

        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac
        [[ -z "$PROJECT" || "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid project '$PROJECT'."; exit 1; }
        [[ -z "$LOGICAL_SERVICE" || "$LOGICAL_SERVICE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid service '$LOGICAL_SERVICE'."; exit 1; }
        [[ "$CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid container-name '$CONTAINER_NAME'."; exit 1; }
        [[ -n "$IMAGE" && "$IMAGE" != *$'\n'* && "$IMAGE" != *$'\r'* ]] || { echo "::error::Invalid image reference."; exit 1; }
        [[ "$CONTAINER_PORT" =~ ^[0-9]+$ ]] && (( CONTAINER_PORT >= 1 && CONTAINER_PORT <= 65535 )) || {
          echo "::error::container-port must be an integer from 1 to 65535."
          exit 1
        }
        [[ "$STOP_TIMEOUT" =~ ^[0-9]+$ ]] || { echo "::error::stop-timeout must be an integer."; exit 1; }
        case "$RESTART_POLICY" in no|always|unless-stopped|on-failure) ;; *) echo "::error::Invalid restart policy '$RESTART_POLICY'."; exit 1 ;; esac
        case "$INIT" in true|false) ;; *) echo "::error::init must be true or false."; exit 1 ;; esac
        case "$RESTORE_PREVIOUS_ON_FAILURE" in true|false) ;; *) echo "::error::restore-previous-on-failure must be true or false."; exit 1 ;; esac
        if [[ -n "$NETWORK" && ! "$NETWORK" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
          echo "::error::Invalid Docker network '$NETWORK'."
          exit 1
        fi
        [[ "$PROXY_NETWORK" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || {
          echo "::error::Invalid proxy network '$PROXY_NETWORK'."
          exit 1
        }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_FILES_JSON" >/dev/null || { echo "::error::env-files-json must be a string array."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_NAMES_JSON" >/dev/null || { echo "::error::env-names-json must be a string array."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$VOLUMES_JSON" >/dev/null || { echo "::error::volumes-json must be a string array."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$SECURITY_OPTS_JSON" >/dev/null || { echo "::error::security-opts-json must be a string array."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$CAP_DROP_JSON" >/dev/null || { echo "::error::cap-drop-json must be a string array."; exit 1; }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        declare -a env_args=()
        while IFS= read -r encoded; do
          value="$(printf '%s' "$encoded" | base64 --decode)"
          [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid Docker env file path."; exit 1; }
          if [[ "$value" == /* ]]; then
            env_file="$(realpath -e "$value" 2>/dev/null || true)"
            if [[ -z "$env_file" || "$env_file" != /opt/stacks/projects/* ]]; then
              echo "::error::Absolute Docker env files must resolve under /opt/stacks/projects."
              exit 1
            fi
          else
            env_file="$(realpath -e "$GITHUB_WORKSPACE/$value" 2>/dev/null || true)"
            if [[ -z "$env_file" ]] || { [[ "$env_file" != "$workspace" ]] && [[ "$env_file" != "$workspace/"* ]]; }; then
              echo "::error::Repository env file '$value' must resolve inside the repository."
              exit 1
            fi
          fi
          [[ -f "$env_file" ]] || { echo "::error::Docker env file '$value' does not exist."; exit 1; }
          env_args+=(--env-file "$env_file")
        done < <(jq -r '.[] | @base64' <<<"$ENV_FILES_JSON")

        while IFS= read -r name; do
          [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid environment variable name '$name'."; exit 1; }
          [[ -v "$name" ]] || { echo "::error::Environment variable '$name' is not set in the caller step."; exit 1; }
          env_args+=(-e "$name")
        done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")

        declare -a volume_args=()
        tls_gid=""
        if [[ -n "$PROJECT" && -n "$LOGICAL_SERVICE" ]]; then
          tls_dir="/opt/stacks/projects/$PROJECT/$LOGICAL_SERVICE/secret/tls/$DEPLOY_ENVIRONMENT"
          if [[ -d "$tls_dir" ]]; then
            [[ -f "$tls_dir/tls.crt" && -f "$tls_dir/tls.key" && -f "$tls_dir/root_ca.crt" ]] || {
              echo "::error::Managed TLS directory is incomplete: $tls_dir"
              exit 1
            }
            tls_gid="$(stat -c '%g' "$tls_dir/tls.key")"
            volume_args+=(-v "$tls_dir:/run/stacks/tls:ro")
            echo "Using managed TLS: $tls_dir -> /run/stacks/tls"
          fi
        fi
        while IFS= read -r encoded; do
          value="$(printf '%s' "$encoded" | base64 --decode)"
          [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid volume specification."; exit 1; }
          volume_args+=(-v "$value")
        done < <(jq -r '.[] | @base64' <<<"$VOLUMES_JSON")

        declare -a hardening_args=()
        [[ "$INIT" != "true" ]] || hardening_args+=(--init)
        while IFS= read -r encoded; do
          value="$(printf '%s' "$encoded" | base64 --decode)"
          [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid Docker security option."; exit 1; }
          hardening_args+=(--security-opt "$value")
        done < <(jq -r '.[] | @base64' <<<"$SECURITY_OPTS_JSON")
        while IFS= read -r capability; do
          [[ "$capability" =~ ^[A-Za-z0-9_+-]+$ ]] || { echo "::error::Invalid capability '$capability'."; exit 1; }
          hardening_args+=(--cap-drop "$capability")
        done < <(jq -r '.[]' <<<"$CAP_DROP_JSON")

        if [[ -n "$NETWORK" ]]; then
          docker network inspect "$NETWORK" >/dev/null 2>&1 || {
            echo "::error::Project Docker network '$NETWORK' does not exist. Create it with the project CLI before deployment."
            exit 1
          }
        fi
        docker network inspect "$PROXY_NETWORK" >/dev/null 2>&1 || {
          echo "::error::Shared proxy Docker network '$PROXY_NETWORK' does not exist."
          exit 1
        }

        run_image() {
          local image="$1"
          local requested_host_port="${2:-}"
          local publish
          if [[ -n "$requested_host_port" ]]; then
            publish="127.0.0.1:$requested_host_port:$CONTAINER_PORT"
          else
            publish="127.0.0.1::$CONTAINER_PORT"
          fi
          local -a args=(docker create --name "$CONTAINER_NAME" --restart "$RESTART_POLICY" -p "$publish")
          [[ -z "$tls_gid" ]] || args+=(--group-add "$tls_gid")
          args+=("${env_args[@]}")
          args+=("${volume_args[@]}")
          args+=("${hardening_args[@]}")
          [[ -z "$NETWORK" ]] || args+=(--network "$NETWORK")
          args+=(--label "kr.mooner510.stacks.managed=true")
          [[ -z "$PROJECT" ]] || args+=(--label "kr.mooner510.stacks.project=$PROJECT")
          [[ -z "$LOGICAL_SERVICE" ]] || args+=(--label "kr.mooner510.stacks.service=$LOGICAL_SERVICE")
          args+=(--label "kr.mooner510.stacks.environment=$DEPLOY_ENVIRONMENT")
          args+=(--label "kr.mooner510.stacks.kind=http")
          args+=(--label "kr.mooner510.stacks.container-port=$CONTAINER_PORT")
          [[ -z "${GITHUB_SHA:-}" ]] || args+=(--label "org.opencontainers.image.revision=$GITHUB_SHA")
          args+=("$image")
          "${args[@]}" >/dev/null
          if [[ -z "$NETWORK" || "$NETWORK" != "$PROXY_NETWORK" ]]; then
            docker network connect "$PROXY_NETWORK" "$CONTAINER_NAME"
          fi
          docker start "$CONTAINER_NAME" >/dev/null
        }

        resolve_host_port() {
          local binding
          binding="$(docker port "$CONTAINER_NAME" "$CONTAINER_PORT/tcp" 2>/dev/null | head -n1 || true)"
          if [[ "$binding" =~ ^127\.0\.0\.1:([0-9]+)$ ]]; then
            printf '%s' "${BASH_REMATCH[1]}"
            return 0
          fi
          echo "::error::Could not resolve Docker loopback host port for $CONTAINER_NAME:$CONTAINER_PORT." >&2
          return 1
        }

        previous_existed=false
        previous_image=""
        previous_image_id=""
        previous_host_port=""
        if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
          previous_existed=true
          previous_image="$(docker inspect "$CONTAINER_NAME" --format '{{.Config.Image}}')"
          previous_image_id="$(docker inspect "$CONTAINER_NAME" --format '{{.Image}}')"
          previous_host_port="$(resolve_host_port)" || exit 1
          docker stop -t "$STOP_TIMEOUT" "$CONTAINER_NAME" >/dev/null || true
          docker rm -f "$CONTAINER_NAME" >/dev/null || true
        fi

        echo "==> Deploying $CONTAINER_NAME from $IMAGE with an automatic loopback health port and proxy network $PROXY_NETWORK"
        if ! run_image "$IMAGE"; then
          echo "::error::Failed to start '$CONTAINER_NAME' from '$IMAGE'."
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          if [[ "$RESTORE_PREVIOUS_ON_FAILURE" == "true" && "$previous_existed" == "true" && -n "$previous_image_id" ]]; then
            echo "Attempting immediate rollback to $previous_image_id on previous port $previous_host_port"
            run_image "$previous_image_id" "$previous_host_port" || true
          fi
          exit 1
        fi

        host_port="$(resolve_host_port)" || {
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          if [[ "$RESTORE_PREVIOUS_ON_FAILURE" == "true" && "$previous_existed" == "true" && -n "$previous_image_id" ]]; then
            run_image "$previous_image_id" "$previous_host_port" || true
          fi
          exit 1
        }

        echo "Docker assigned 127.0.0.1:$host_port -> $CONTAINER_PORT/tcp"
        {
          echo "previous_existed=$previous_existed"
          echo "previous_image=$previous_image"
          echo "previous_image_id=$previous_image_id"
          echo "published_port=$host_port"
        } >>"$GITHUB_OUTPUT"
