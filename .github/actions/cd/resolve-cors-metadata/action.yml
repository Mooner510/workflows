name: Resolve CORS metadata
description: Resolve environment-specific CORS metadata for runtime injection.

inputs:
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  project:
    description: Canonical project identifier.
    required: true
  service:
    description: Optional logical service identifier.
    required: false
    default: ''
outputs:
  cors-origins:
    description: Comma-separated CORS origins for CORS_ORIGINS. Empty means unset.
    value: ${{ steps.resolve.outputs.cors_origins }}
  has-cors:
    description: true when CORS_ORIGINS was resolved.
    value: ${{ steps.resolve.outputs.has_cors }}

runs:
  using: composite
  steps:
    - name: Resolve CORS metadata
      id: resolve
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        PROJECT: ${{ inputs.project }}
        SERVICE: ${{ inputs.service }}
      run: |
        set -euo pipefail

        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac
        [[ "$PROJECT" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || { echo "::error::Invalid project '$PROJECT'."; exit 1; }
        if [[ -n "$SERVICE" && ! "$SERVICE" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
          echo "::error::Invalid service '$SERVICE'."
          exit 1
        fi

        root="/opt/stacks/projects/$PROJECT"
        [[ -d "$root" ]] || { echo "::error::Project config directory does not exist: $root"; exit 1; }
        if [[ -n "$SERVICE" ]]; then
          [[ -d "$root/$SERVICE" ]] || {
            echo "::error::Service registry does not exist: $root/$SERVICE"
            exit 1
          }
        fi

        trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
        validate_origin() {
          local value="$1"
          [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || return 1
          [[ "$value" =~ ^https?://(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9.-]+)(:([0-9]{1,5}))?$ ]] || return 1
          if [[ -n "${BASH_REMATCH[3]:-}" ]]; then
            local port="${BASH_REMATCH[3]}"
            (( 10#$port >= 1 && 10#$port <= 65535 )) || return 1
          fi
          return 0
        }

        cors_file="cors.env"
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || cors_file="cors.dev.env"
        cors_tmp="$(mktemp)"
        trap 'rm -f "$cors_tmp"' EXIT

        append_cors_file() {
          local path="$1"
          [[ -f "$path" ]] || return 0
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            raw="${raw//$'\r'/}"
            value="$(trim "$raw")"
            [[ -n "$value" ]] || continue
            validate_origin "$value" || { echo "::error::Invalid CORS origin in $path: $value"; exit 1; }
            printf '%s\n' "$value" >>"$cors_tmp"
          done <"$path"
        }

        append_cors_file "$root/$cors_file"
        if [[ -n "$SERVICE" ]]; then
          append_cors_file "$root/$SERVICE/$cors_file"
        fi

        cors_origins=""
        if [[ -s "$cors_tmp" ]]; then
          cors_origins="$(LC_ALL=C sort -u "$cors_tmp" | paste -sd, -)"
          echo "CORS_ORIGINS=$cors_origins" >>"$GITHUB_ENV"
        fi

        {
          echo "cors_origins=$cors_origins"
          if [[ -n "$cors_origins" ]]; then echo "has_cors=true"; else echo "has_cors=false"; fi
        } >>"$GITHUB_OUTPUT"
