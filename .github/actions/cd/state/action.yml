name: Deployment state
description: Read, resolve the previous known-good deployment, or record persistent state for one project service.

inputs:
  environment:
    description: Deployment environment, prod or dev. Production keeps the legacy state path.
    required: false
    default: prod
  operation:
    description: read, previous, or record.
    required: true
  project:
    description: Stable project identifier.
    required: true
  service:
    description: Stable service identifier.
    required: true
  revision:
    description: Git revision for record operations.
    required: false
    default: ''
  image:
    description: Docker image reference for record operations.
    required: false
    default: ''
  image-id:
    description: Docker image ID/digest for record operations.
    required: false
    default: ''
  event:
    description: History event name, usually deploy or rollback.
    required: false
    default: deploy
  root:
    description: Persistent stacks state root.
    required: false
    default: /var/lib/stacks

outputs:
  exists:
    description: Whether the requested deployment state exists.
    value: ${{ steps.state.outputs.exists }}
  revision:
    description: Requested recorded revision.
    value: ${{ steps.state.outputs.revision }}
  image:
    description: Requested recorded image reference.
    value: ${{ steps.state.outputs.image }}
  image-id:
    description: Requested recorded image ID/digest.
    value: ${{ steps.state.outputs.image_id }}
  state-directory:
    description: Persistent state directory.
    value: ${{ steps.state.outputs.state_directory }}

runs:
  using: composite
  steps:
    - name: Manage deployment state
      id: state
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        OPERATION: ${{ inputs.operation }}
        PROJECT: ${{ inputs.project }}
        SERVICE: ${{ inputs.service }}
        REVISION: ${{ inputs.revision }}
        IMAGE: ${{ inputs.image }}
        IMAGE_ID: ${{ inputs.image-id }}
        EVENT: ${{ inputs.event }}
        STATE_ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac
        case "$OPERATION" in read|previous|record) ;; *) echo "::error::operation must be read, previous, or record."; exit 1 ;; esac
        [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid project '$PROJECT'."; exit 1; }
        [[ "$SERVICE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid service '$SERVICE'."; exit 1; }
        [[ "$EVENT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::Invalid event '$EVENT'."; exit 1; }
        [[ "$STATE_ROOT" == /* ]] || { echo "::error::root must be an absolute path."; exit 1; }

        state_dir="$STATE_ROOT/projects/$PROJECT/$SERVICE/deploy"
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || state_dir="$STATE_ROOT/projects/$PROJECT/$SERVICE/dev/deploy"
        current="$state_dir/current.json"
        history="$state_dir/history.jsonl"
        mkdir -p "$state_dir"

        emit_missing() {
          {
            echo "exists=false"
            echo "revision="
            echo "image="
            echo "image_id="
            echo "state_directory=$state_dir"
          } >>"$GITHUB_OUTPUT"
        }

        validate_record_file() {
          local file="$1"
          jq -e 'type == "object" and (.revision | type == "string") and (.image | type == "string") and (.imageId | type == "string") and (.deployedAt | type == "string")' "$file" >/dev/null
        }

        if [[ "$OPERATION" == "read" ]]; then
          if [[ ! -f "$current" ]]; then
            emit_missing
            exit 0
          fi
          validate_record_file "$current" || { echo "::error::Deployment state '$current' is invalid."; exit 1; }
          {
            echo "exists=true"
            echo "revision=$(jq -r '.revision' "$current")"
            echo "image=$(jq -r '.image' "$current")"
            echo "image_id=$(jq -r '.imageId' "$current")"
            echo "state_directory=$state_dir"
          } >>"$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$OPERATION" == "previous" ]]; then
          if [[ ! -f "$current" || ! -s "$history" ]]; then
            emit_missing
            exit 0
          fi
          validate_record_file "$current" || { echo "::error::Deployment state '$current' is invalid."; exit 1; }
          if ! jq -s -e 'all(.[]; type == "object" and (.revision | type == "string") and (.image | type == "string") and (.imageId | type == "string") and (.deployedAt | type == "string"))' "$history" >/dev/null; then
            echo "::error::Deployment history '$history' is invalid."
            exit 1
          fi
          current_image_id="$(jq -r '.imageId' "$current")"
          candidate="$(jq -cs --arg current "$current_image_id" '[.[] | select(.imageId != $current)] | last // empty' "$history")"
          if [[ -z "$candidate" || "$candidate" == "null" ]]; then
            emit_missing
            exit 0
          fi
          {
            echo "exists=true"
            echo "revision=$(jq -r '.revision' <<<"$candidate")"
            echo "image=$(jq -r '.image' <<<"$candidate")"
            echo "image_id=$(jq -r '.imageId' <<<"$candidate")"
            echo "state_directory=$state_dir"
          } >>"$GITHUB_OUTPUT"
          exit 0
        fi

        [[ -n "$REVISION" && "$REVISION" != *$'\n'* && "$REVISION" != *$'\r'* ]] || { echo "::error::revision is required for record."; exit 1; }
        [[ -n "$IMAGE" && "$IMAGE" != *$'\n'* && "$IMAGE" != *$'\r'* ]] || { echo "::error::image is required for record."; exit 1; }
        [[ -n "$IMAGE_ID" && "$IMAGE_ID" != *$'\n'* && "$IMAGE_ID" != *$'\r'* ]] || { echo "::error::image-id is required for record."; exit 1; }

        now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        record="$(jq -cn \
          --arg project "$PROJECT" \
          --arg service "$SERVICE" \
          --arg revision "$REVISION" \
          --arg image "$IMAGE" \
          --arg imageId "$IMAGE_ID" \
          --arg deployedAt "$now" \
          --arg event "$EVENT" \
          --arg environment "$DEPLOY_ENVIRONMENT" \
          '{project:$project,service:$service,environment:$environment,revision:$revision,image:$image,imageId:$imageId,deployedAt:$deployedAt,event:$event}')"

        current_tmp="$(mktemp "$state_dir/.current.XXXXXX")"
        history_tmp="$(mktemp "$state_dir/.history.XXXXXX")"
        previous_tmp=""
        if [[ -f "$current" ]]; then
          previous_tmp="$(mktemp "$state_dir/.previous.XXXXXX")"
          cp "$current" "$previous_tmp"
        fi
        cleanup_record_temps() {
          rm -f "$current_tmp" "$history_tmp"
          [[ -z "$previous_tmp" ]] || rm -f "$previous_tmp"
        }
        trap cleanup_record_temps EXIT

        printf '%s\n' "$record" >"$current_tmp"
        chmod 0644 "$current_tmp"
        if [[ -f "$history" ]]; then
          cat "$history" >"$history_tmp"
        fi
        printf '%s\n' "$record" >>"$history_tmp"
        chmod 0644 "$history_tmp"

        mv -f "$current_tmp" "$current"
        if ! mv -f "$history_tmp" "$history"; then
          if [[ -n "$previous_tmp" ]]; then
            mv -f "$previous_tmp" "$current" || {
              echo "::error::Failed to restore previous deployment state after history write failure."
              exit 1
            }
            previous_tmp=""
          else
            rm -f "$current"
          fi
          echo "::error::Failed to atomically update deployment history."
          exit 1
        fi
        [[ -z "$previous_tmp" ]] || rm -f "$previous_tmp"
        previous_tmp=""
        trap - EXIT

        {
          echo "exists=true"
          echo "revision=$REVISION"
          echo "image=$IMAGE"
          echo "image_id=$IMAGE_ID"
          echo "state_directory=$state_dir"
        } >>"$GITHUB_OUTPUT"
