name: Resolve runtime environment files
description: Resolve the canonical host deploy.env for one production service, plus optional compatibility env files.

inputs:
  project:
    description: Repository-derived project identifier matching /opt/stacks/projects/<repository-name>.
    required: true
  service:
    description: Stable service identifier matching /opt/stacks/projects/<repository-name>/<service>.
    required: true
  env-files-json:
    description: Optional additional repository-relative env files. Absolute caller paths are not accepted.
    required: false
    default: '[]'

outputs:
  env-files-json:
    description: JSON array of resolved env-file paths passed to Docker runtime.
    value: ${{ steps.resolve.outputs.env_files_json }}
  env-keys-json:
    description: JSON array of variable names provided by the resolved env files. Values are never emitted.
    value: ${{ steps.resolve.outputs.env_keys_json }}
  deploy-domain:
    description: DEPLOY_DOMAIN resolved from the canonical service deploy.env.
    value: ${{ steps.resolve.outputs.deploy_domain }}

runs:
  using: composite
  steps:
    - name: Resolve runtime environment files
      id: resolve
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        SERVICE: ${{ inputs.service }}
        ENV_FILES_JSON: ${{ inputs.env-files-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the production runner."; exit 1; }

        [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || {
          echo "::error::Invalid repository-derived project identifier '$PROJECT'."
          exit 1
        }
        [[ "$SERVICE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || {
          echo "::error::Invalid service identifier '$SERVICE'."
          exit 1
        }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_FILES_JSON" >/dev/null || {
          echo "::error::env-files-json must be a JSON array of strings."
          exit 1
        }

        [[ -f /opt/stacks/shared/caddy/Caddyfile ]] || {
          echo "::error::Production host filesystem is not visible to this runner (/opt/stacks/shared/caddy/Caddyfile missing)."
          echo "::error::The active self-hosted runner must expose the production host filesystem required by CD."
          exit 1
        }

        trim() {
          printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
        }

        normalize_value() {
          local value
          value="$(trim "$1")"
          if (( ${#value} >= 2 )); then
            if [[ "${value:0:1}" == '"' && "${value: -1}" == '"' ]]; then
              value="${value:1:${#value}-2}"
            elif [[ "${value:0:1}" == "'" && "${value: -1}" == "'" ]]; then
              value="${value:1:${#value}-2}"
            fi
          fi
          printf '%s' "$value"
        }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        resolved='[]'

        while IFS= read -r value; do
          [[ -n "$value" && "$value" != /* && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
            echo "::error::Additional env files must be repository-relative paths."
            exit 1
          }
          path="$(realpath -e "$GITHUB_WORKSPACE/$value" 2>/dev/null || true)"
          [[ -f "$path" ]] || { echo "::error::Runtime env file '$value' does not exist."; exit 1; }
          if [[ "$path" != "$workspace" && "$path" != "$workspace/"* ]]; then
            echo "::error::Runtime env file '$value' must resolve inside the repository."
            exit 1
          fi
          resolved="$(jq -c --arg path "$path" '. + [$path]' <<<"$resolved")"
        done < <(jq -r '.[]' <<<"$ENV_FILES_JSON")

        service_root="/opt/stacks/projects/$PROJECT/$SERVICE"
        canonical_env="$service_root/deploy.env"
        legacy_secret_env="$service_root/secret/deploy.env"

        if [[ -f "$canonical_env" ]]; then
          resolved="$(jq -c --arg path "$canonical_env" '. + [$path]' <<<"$resolved")"
          echo "Using canonical host deploy env: $canonical_env"
        fi
        if [[ -f "$legacy_secret_env" ]]; then
          resolved="$(jq -c --arg path "$legacy_secret_env" '. + [$path]' <<<"$resolved")"
          echo "::warning::$legacy_secret_env is a compatibility file. Prefer a single canonical $canonical_env."
        fi

        resolved="$(jq -c 'unique' <<<"$resolved")"
        keys='[]'
        deploy_domain=""

        while IFS= read -r path; do
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//$'\r'/}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            key="$(trim "$key")"
            [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || {
              echo "::error::Invalid environment variable name '$key' in $path."
              exit 1
            }
            keys="$(jq -c --arg key "$key" '. + [$key]' <<<"$keys")"

            if [[ "$path" == "$canonical_env" ]]; then
              case "$key" in
                DEPLOY_DOMAIN) deploy_domain="$(normalize_value "$value")" ;;
              esac
            fi
          done <"$path"
        done < <(jq -r '.[]' <<<"$resolved")

        keys="$(jq -c 'unique' <<<"$keys")"
        {
          echo "env_files_json=$resolved"
          echo "env_keys_json=$keys"
          echo "deploy_domain=$deploy_domain"
        } >>"$GITHUB_OUTPUT"
