name: Resolve runtime environment files
description: Resolve canonical project config plus optional service-scoped runtime config and secret overlays.

inputs:
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  project:
    description: Repository-derived project identifier matching /opt/stacks/projects/<repository-name>.
    required: true
  service:
    description: Optional stable service identifier. When set, service deploy.env and secret/deploy.env are discovered automatically.
    required: false
    default: ''
  env-files-json:
    description: Optional additional repository-relative env files. Absolute caller paths are not accepted.
    required: false
    default: '[]'

outputs:
  env-files-json:
    description: Ordered JSON array of resolved env-file paths passed to Docker runtime.
    value: ${{ steps.resolve.outputs.env_files_json }}
  env-keys-json:
    description: JSON array of variable names provided by the resolved env files. Values are never emitted.
    value: ${{ steps.resolve.outputs.env_keys_json }}
  deploy-volumes-json:
    description: DEPLOY_VOLUMES_JSON resolved with service config overriding project config.
    value: ${{ steps.resolve.outputs.deploy_volumes_json }}

runs:
  using: composite
  steps:
    - name: Resolve runtime environment files
      id: resolve
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        PROJECT: ${{ inputs.project }}
        SERVICE: ${{ inputs.service }}
        ENV_FILES_JSON: ${{ inputs.env-files-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac

        [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || {
          echo "::error::Invalid repository-derived project identifier '$PROJECT'."
          exit 1
        }
        if [[ -n "$SERVICE" && ! "$SERVICE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
          echo "::error::Invalid service identifier '$SERVICE'."
          exit 1
        fi
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_FILES_JSON" >/dev/null || {
          echo "::error::env-files-json must be a JSON array of strings."
          exit 1
        }

        trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
        normalize_value() {
          local value
          value="$(trim "$1")"
          if (( ${#value} >= 2 )); then
            if [[ "${value:0:1}" == '"' && "${value: -1}" == '"' ]]; then
              value="${value:1:${#value}-2}"
            elif [[ "${value:0:1}" == "'" && "${value: -1}" == "'" ]]; then
              value="${value:1:${#value}-2}"
            fi
          fi
          printf '%s' "$value"
        }

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        resolved='[]'

        while IFS= read -r value; do
          [[ -n "$value" && "$value" != /* && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
            echo "::error::Additional env files must be repository-relative paths."
            exit 1
          }
          path="$(realpath -e "$GITHUB_WORKSPACE/$value" 2>/dev/null || true)"
          [[ -f "$path" ]] || { echo "::error::Runtime env file '$value' does not exist."; exit 1; }
          if [[ "$path" != "$workspace" && "$path" != "$workspace/"* ]]; then
            echo "::error::Runtime env file '$value' must resolve inside the repository."
            exit 1
          fi
          resolved="$(jq -c --arg path "$path" '. + [$path]' <<<"$resolved")"
        done < <(jq -r '.[]' <<<"$ENV_FILES_JSON")

        env_file="deploy.env"
        [[ "$DEPLOY_ENVIRONMENT" != "dev" ]] || env_file="deploy.dev.env"
        project_env="/opt/stacks/projects/$PROJECT/$env_file"
        [[ ! -f "$project_env" ]] || resolved="$(jq -c --arg path "$project_env" '. + [$path]' <<<"$resolved")"

        if [[ -n "$SERVICE" ]]; then
          service_root="/opt/stacks/projects/$PROJECT/$SERVICE"
          [[ -d "$service_root" ]] || {
            echo "::error::Canonical service registry does not exist: $service_root"
            exit 1
          }
          service_env="$service_root/$env_file"
          service_secret="$service_root/secret/$env_file"
          [[ ! -f "$service_env" ]] || resolved="$(jq -c --arg path "$service_env" '. + [$path]' <<<"$resolved")"
          [[ ! -f "$service_secret" ]] || resolved="$(jq -c --arg path "$service_secret" '. + [$path]' <<<"$resolved")"
        fi

        if [[ "$(jq 'length' <<<"$resolved")" -eq 0 ]]; then
          echo "No runtime env file is configured for project '$PROJECT' and service '$SERVICE'; using an empty runtime environment."
        fi

        keys='[]'
        deploy_volumes_json='[]'

        while IFS= read -r path; do
          echo "Using runtime env: $path"
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//$'\r'/}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            [[ "$line" == *=* ]] || { echo "::error::Invalid env assignment in $path."; exit 1; }
            key="$(trim "${line%%=*}")"
            raw="${line#*=}"
            [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || {
              echo "::error::Invalid environment variable name '$key' in $path."
              exit 1
            }
            keys="$(jq -c --arg key "$key" '. + [$key]' <<<"$keys")"
            case "$key" in
              DEPLOY_VOLUMES_JSON)
                candidate="$(normalize_value "$raw")"
                jq -e 'type == "array" and all(.[]; type == "string")' <<<"$candidate" >/dev/null || {
                  echo "::error::DEPLOY_VOLUMES_JSON in $path must be a JSON string array."
                  exit 1
                }
                deploy_volumes_json="$(jq -c '.' <<<"$candidate")"
                ;;
            esac
          done <"$path"
        done < <(jq -r '.[]' <<<"$resolved")

        keys="$(jq -c 'unique' <<<"$keys")"
        {
          echo "env_files_json=$resolved"
          echo "env_keys_json=$keys"
          echo "deploy_volumes_json=$deploy_volumes_json"
        } >>"$GITHUB_OUTPUT"
