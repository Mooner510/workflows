name: Docker process production
description: Canonical production entrypoint for workers, key services, and other non-HTTP Docker processes with shared state and rollback.

inputs:
  production-branch:
    description: Production branch. Empty uses the caller repository default branch.
    required: false
    default: ''
  working-directory:
    description: Docker build context relative to caller repository.
    required: true
  service-name:
    description: Stable container and deployment-state service name.
    required: true
  image-name:
    description: Local image repository name. Empty uses service-name.
    required: false
    default: ''
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  database:
    description: Resolve and inject DATABASE_URL from canonical db.env.
    required: false
    default: 'false'
  volumes-json:
    description: Docker volume specs. Empty uses DEPLOY_VOLUMES_JSON from resolved runtime config.
    required: false
    default: '[]'
  readiness-command-json:
    description: Optional JSON command array executed with docker exec until ready.
    required: false
    default: '[]'
  readiness-jq:
    description: Optional jq expression evaluated against readiness command JSON output.
    required: false
    default: ''
  readiness-attempts:
    description: Maximum readiness attempts.
    required: false
    default: '20'
  init:
    description: Run Docker init.
    required: false
    default: 'true'
  security-opts-json:
    description: Docker security opts.
    required: false
    default: '["no-new-privileges:true"]'
  cap-drop-json:
    description: Capabilities to drop.
    required: false
    default: '["ALL"]'
  stop-timeout:
    description: Graceful stop timeout.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Resolve production process deployment
      id: contract
      shell: bash
      env:
        BRANCH_INPUT: ${{ inputs.production-branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_OPERATION: ${{ github.event.inputs.operation }}
        ACTOR: ${{ github.actor }}
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        branch="$BRANCH_INPUT"
        [[ -n "$branch" ]] || branch="$DEFAULT_BRANCH"
        [[ -n "$branch" ]] || { echo "::error::Unable to resolve production branch."; exit 1; }
        [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "::error::Production process deployment supports only workflow_dispatch."; exit 1; }
        [[ "$ACTOR" == "Mooner510" && "$TRIGGERING_ACTOR" == "Mooner510" ]] || {
          echo "::error::Production deployment is restricted to Mooner510."
          exit 1
        }
        operation="${EVENT_OPERATION:-deploy}"
        case "$operation" in deploy|rollback) ;; *) echo "::error::operation must be deploy or rollback."; exit 1 ;; esac
        {
          echo "branch=$branch"
          echo "operation=$operation"
        } >>"$GITHUB_OUTPUT"

    - name: Checkout production revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ steps.contract.outputs.branch }}

    - name: Deploy production process
      uses: $/.github/actions/cd/docker-process
      with:
        environment: prod
        operation: ${{ steps.contract.outputs.operation }}
        production-branch: ${{ steps.contract.outputs.branch }}
        working-directory: ${{ inputs.working-directory }}
        service-name: ${{ inputs.service-name }}
        image-name: ${{ inputs.image-name }}
        dockerfile: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        database: ${{ inputs.database }}
        volumes-json: ${{ inputs.volumes-json }}
        readiness-command-json: ${{ inputs.readiness-command-json }}
        readiness-jq: ${{ inputs.readiness-jq }}
        readiness-attempts: ${{ inputs.readiness-attempts }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
