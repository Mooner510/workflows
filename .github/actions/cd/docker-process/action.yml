name: Docker process deployment
description: Shared environment-aware core for workers, key services, and other non-HTTP Docker processes.

inputs:
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  operation:
    description: deploy or rollback. Development callers use deploy.
    required: false
    default: deploy
  production-branch:
    description: Production branch used when environment=prod.
    required: false
    default: ''
  development-branch:
    description: Development branch used when environment=dev.
    required: false
    default: dev
  working-directory:
    description: Docker build context relative to caller repository.
    required: true
  service-name:
    description: Stable container and deployment-state service name.
    required: true
  image-name:
    description: Local image repository name. Empty uses service-name.
    required: false
    default: ''
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  database:
    description: Resolve and inject DATABASE_URL from canonical db.env.
    required: false
    default: 'false'
  volumes-json:
    description: Docker volume specs. Empty uses DEPLOY_VOLUMES_JSON from resolved runtime config.
    required: false
    default: '[]'
  readiness-command-json:
    description: Optional JSON command array executed with docker exec until ready.
    required: false
    default: '[]'
  readiness-jq:
    description: Optional jq expression evaluated against readiness command JSON output.
    required: false
    default: ''
  readiness-attempts:
    description: Maximum readiness attempts.
    required: false
    default: '20'
  init:
    description: Run Docker init.
    required: false
    default: 'true'
  security-opts-json:
    description: Docker security opts.
    required: false
    default: '["no-new-privileges:true"]'
  cap-drop-json:
    description: Capabilities to drop.
    required: false
    default: '["ALL"]'
  stop-timeout:
    description: Graceful stop timeout.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Validate process operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$DEPLOY_ENVIRONMENT" in prod|dev) ;; *) echo "::error::environment must be prod or dev."; exit 1 ;; esac
        case "$OPERATION" in deploy|rollback) ;; *) echo "::error::operation must be deploy or rollback."; exit 1 ;; esac
        if [[ "$DEPLOY_ENVIRONMENT" == "dev" && "$OPERATION" != "deploy" ]]; then
          echo "::error::Development process deployment supports deploy only."
          exit 1
        fi

    - name: Validate process deployment source
      uses: $/.github/actions/cd/guard
      with:
        environment: ${{ inputs.environment }}
        production-branch: ${{ inputs.production-branch }}
        development-branch: ${{ inputs.development-branch }}

    - name: Resolve deployment identity
      id: identity
      uses: $/.github/actions/cd/identity
      with:
        environment: ${{ inputs.environment }}
        service: ${{ inputs.service-name }}
        image: ${{ inputs.image-name }}

    - name: Validate project-owned runtime prerequisites
      shell: bash
      env:
        PROJECT: ${{ steps.identity.outputs.project }}
        SERVICE: ${{ inputs.service-name }}
        NETWORK: ${{ steps.identity.outputs.network }}
      run: |
        set -euo pipefail
        service_root="/opt/stacks/projects/$PROJECT/$SERVICE"
        [[ -d "$service_root" ]] || {
          echo "::error::Service registry is missing: $service_root"
          echo "::error::Register it first with: sudo project service ensure $PROJECT/$SERVICE"
          exit 1
        }
        docker network inspect "$NETWORK" >/dev/null 2>&1 || {
          echo "::error::Project network '$NETWORK' does not exist."
          echo "::error::Create it first with the project CLI."
          exit 1
        }

    - name: Resolve database credentials
      id: credentials
      uses: $/.github/actions/cd/resolve-db-credentials
      with:
        environment: ${{ inputs.environment }}
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        migration-engine: none
        env-names-json: ${{ inputs.database == 'true' && '["DATABASE_URL"]' || '[]' }}

    - name: Resolve process runtime config
      id: runtime
      uses: $/.github/actions/cd/resolve-runtime-env-files
      with:
        environment: ${{ inputs.environment }}
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}

    - name: Resolve process CORS metadata
      id: service_metadata
      uses: $/.github/actions/cd/resolve-cors-metadata
      with:
        environment: ${{ inputs.environment }}
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}

    - name: Merge process environment names
      id: process_env
      shell: bash
      env:
        RESOLVED_ENV_NAMES: ${{ steps.credentials.outputs.resolved-env-names-json }}
        HAS_CORS: ${{ steps.service_metadata.outputs['has-cors'] }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$RESOLVED_ENV_NAMES" >/dev/null || {
          echo "::error::resolved process env names must be a string array."
          exit 1
        }
        merged="$(jq -c '.' <<<"$RESOLVED_ENV_NAMES")"
        if [[ "$HAS_CORS" == "true" ]]; then
          merged="$(jq -c '. + ["CORS_ORIGINS"] | unique' <<<"$merged")"
        fi
        echo "env_names_json=$merged" >>"$GITHUB_OUTPUT"

    - name: Read current process deployment
      id: current
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: read
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}

    - name: Read process rollback target
      id: previous
      if: inputs.operation == 'rollback'
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: previous
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}

    - name: Build process image
      id: build
      if: inputs.operation == 'deploy'
      uses: $/.github/actions/cd/docker/build
      with:
        working-directory: ${{ inputs.working-directory }}
        dockerfile: ${{ inputs.dockerfile }}
        image-name: ${{ steps.identity.outputs.image }}
        target: ${{ inputs.target }}

    - name: Deploy process service
      id: deploy
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        SERVICE: ${{ steps.identity.outputs.service }}
        DEPLOY_IMAGE_ID: ${{ steps.build.outputs.image-id }}
        ROLLBACK_IMAGE_ID: ${{ steps.previous.outputs.image-id }}
        CURRENT_EXISTS: ${{ steps.current.outputs.exists }}
        CURRENT_IMAGE_ID: ${{ steps.current.outputs.image-id }}
        NETWORK: ${{ steps.identity.outputs.network }}
        ENV_FILES: ${{ steps.runtime.outputs.env-files-json }}
        DB_ENV_NAMES: ${{ steps.process_env.outputs.env_names_json }}
        INPUT_VOLUMES: ${{ inputs.volumes-json }}
        CONFIG_VOLUMES: ${{ steps.runtime.outputs.deploy-volumes-json }}
        READY_COMMAND: ${{ inputs.readiness-command-json }}
        READY_JQ: ${{ inputs.readiness-jq }}
        READY_ATTEMPTS: ${{ inputs.readiness-attempts }}
        INIT: ${{ inputs.init }}
        SECURITY_OPTS: ${{ inputs.security-opts-json }}
        CAP_DROP: ${{ inputs.cap-drop-json }}
        STOP_TIMEOUT: ${{ inputs.stop-timeout }}
      run: |
        set -euo pipefail
        command -v docker >/dev/null || { echo "::error::Docker is required."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required."; exit 1; }
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$ENV_FILES" >/dev/null
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$DB_ENV_NAMES" >/dev/null
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$READY_COMMAND" >/dev/null
        [[ "$READY_ATTEMPTS" =~ ^[0-9]+$ ]] || { echo "::error::readiness-attempts must be numeric."; exit 1; }

        image="$DEPLOY_IMAGE_ID"
        if [[ "$OPERATION" == "rollback" ]]; then
          [[ -n "$ROLLBACK_IMAGE_ID" ]] || { echo "::error::No previous known-good deployment exists."; exit 1; }
          docker image inspect "$ROLLBACK_IMAGE_ID" >/dev/null 2>&1 || { echo "::error::Rollback image is unavailable."; exit 1; }
          image="$ROLLBACK_IMAGE_ID"
        fi
        [[ -n "$image" ]] || { echo "::error::Deployment image is unavailable."; exit 1; }

        volumes="$INPUT_VOLUMES"
        [[ "$volumes" != "[]" ]] || volumes="$CONFIG_VOLUMES"
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$volumes" >/dev/null || { echo "::error::volumes must be a string array."; exit 1; }

        create_args=(docker create --name "$SERVICE" --restart unless-stopped)
        [[ "$INIT" != "true" ]] || create_args+=(--init)
        while IFS= read -r opt; do create_args+=(--security-opt "$opt"); done < <(jq -r '.[]' <<<"$SECURITY_OPTS")
        while IFS= read -r cap; do create_args+=(--cap-drop "$cap"); done < <(jq -r '.[]' <<<"$CAP_DROP")
        while IFS= read -r file; do create_args+=(--env-file "$file"); done < <(jq -r '.[]' <<<"$ENV_FILES")
        while IFS= read -r name; do create_args+=(-e "$name"); done < <(jq -r '.[]' <<<"$DB_ENV_NAMES")
        while IFS= read -r volume; do create_args+=(-v "$volume"); done < <(jq -r '.[]' <<<"$volumes")
        create_args+=(--network "$NETWORK")
        create_args+=(--label "com.mooner510.workflows.service=$SERVICE")
        create_args+=(--label "com.mooner510.stacks.managed=true")
        create_args+=(--label "com.mooner510.stacks.project=${{ steps.identity.outputs.project }}")
        create_args+=(--label "com.mooner510.stacks.service=${{ inputs.service-name }}")
        create_args+=(--label "com.mooner510.stacks.environment=$DEPLOY_ENVIRONMENT")
        create_args+=(--label "com.mooner510.stacks.kind=process")
        create_args+=(--label "org.opencontainers.image.revision=$GITHUB_SHA" "$image")

        docker network inspect "$NETWORK" >/dev/null 2>&1 || {
          echo "::error::Project Docker network '$NETWORK' does not exist. Create it with the project CLI before deployment."
          exit 1
        }

        restore() {
          [[ "$CURRENT_EXISTS" == "true" && -n "$CURRENT_IMAGE_ID" ]] || return 0
          docker rm -f "$SERVICE" >/dev/null 2>&1 || true
          create_args[-1]="$CURRENT_IMAGE_ID"
          "${create_args[@]}" >/dev/null
          docker start "$SERVICE" >/dev/null
        }

        if docker container inspect "$SERVICE" >/dev/null 2>&1; then
          docker stop -t "$STOP_TIMEOUT" "$SERVICE" >/dev/null || true
          docker rm -f "$SERVICE" >/dev/null || true
        fi
        if ! "${create_args[@]}" >/dev/null || ! docker start "$SERVICE" >/dev/null; then
          restore
          echo "::error::Failed to start process service $SERVICE."
          exit 1
        fi

        ready=false
        if [[ "$(jq 'length' <<<"$READY_COMMAND")" -eq 0 ]]; then
          sleep 2
          [[ "$(docker inspect "$SERVICE" --format '{{.State.Running}}')" == "true" ]] && ready=true
        else
          mapfile -t command < <(jq -r '.[]' <<<"$READY_COMMAND")
          for ((i=0; i<READY_ATTEMPTS; i++)); do
            if output="$(docker exec "$SERVICE" "${command[@]}" 2>/dev/null)"; then
              if [[ -z "$READY_JQ" ]]; then
                ready=true
              elif jq -e "$READY_JQ" <<<"$output" >/dev/null 2>&1; then
                ready=true
              fi
            fi
            [[ "$ready" == "true" ]] && break
            sleep 2
          done
        fi
        if [[ "$ready" != "true" ]]; then
          docker logs "$SERVICE" >&2 || true
          restore
          echo "::error::Process service $SERVICE did not become ready."
          exit 1
        fi

    - name: Record process deployment
      if: inputs.operation == 'deploy'
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ github.sha }}
        image: ${{ steps.build.outputs.image }}
        image-id: ${{ steps.build.outputs.image-id }}
        event: deploy

    - name: Record process rollback
      if: inputs.operation == 'rollback'
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ steps.previous.outputs.revision }}
        image: ${{ steps.previous.outputs.image }}
        image-id: ${{ steps.previous.outputs.image-id }}
        event: rollback
