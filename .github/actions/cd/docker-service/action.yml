name: Docker service deployment
description: Build, migrate, deploy, health-check, persist state, and register one API or Web Docker service with Caddy.

inputs:
  environment:
    description: Deployment environment, prod or dev.
    required: false
    default: prod
  development-branch:
    description: Development branch used when environment=dev.
    required: false
    default: dev
  production-branch:
    description: Branch whose history is allowed to reach production.
    required: true
  project:
    description: Deprecated compatibility input. Ignored; the caller repository name is always the canonical project identifier.
    required: false
    default: ''
  working-directory:
    description: Service root relative to the caller repository.
    required: true
  service-name:
    description: Stable Docker container, state, and Caddy site name.
    required: true
  image-name:
    description: Local Docker image repository name without a tag.
    required: true
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  build-args-json:
    description: JSON array of non-secret Docker KEY=VALUE build arguments.
    required: false
    default: '[]'
  build-secret-env-names-json:
    description: JSON array of caller environment variable names exposed to Docker BuildKit as build secrets.
    required: false
    default: '[]'
  build-arg-env-names-json:
    description: Non-secret variable names loaded from resolved runtime env files and forwarded to Docker as build args.
    required: false
    default: '[]'
  container-port:
    description: Internal application port.
    required: true
  domain:
    description: Optional compatibility override. Empty reads DEPLOY_DOMAIN from canonical host deploy.env.
    required: false
    default: ''
  db-credential-source:
    description: host reads database credentials from /opt/stacks/projects/<repository-name>/db.env. github is a compatibility mode for caller-provided credentials.
    required: false
    default: host
  env-files-json:
    description: Optional JSON array of additional repository-relative Docker env files. Canonical project host deploy.env is discovered automatically.
    required: false
    default: '[]'
  database:
    description: Resolve and inject DATABASE_URL from canonical service/project db.env even when this service does not own migrations.
    required: false
    default: 'false'
  env-names-json:
    description: JSON array of environment variable names forwarded from the caller step env into the Docker container. DATABASE_URL is auto-resolved from host db.env when missing and migration or this list requires it.
    required: false
    default: '[]'
  volumes-json:
    description: JSON array of Docker volume specifications.
    required: false
    default: '[]'
  network:
    description: Optional Docker network override. Empty uses project-<repository-name>.
    required: false
    default: ''
  restart-policy:
    description: Docker restart policy.
    required: false
    default: unless-stopped
  init:
    description: Run Docker's built-in init process inside the container.
    required: false
    default: 'false'
  security-opts-json:
    description: JSON array of Docker --security-opt values.
    required: false
    default: '[]'
  cap-drop-json:
    description: JSON array of Linux capabilities to drop.
    required: false
    default: '[]'
  stop-timeout:
    description: Seconds allowed for graceful container stop.
    required: false
    default: '15'
  health-path:
    description: HTTP path checked on the loopback host port after deployment.
    required: false
    default: /health
  health-attempts:
    description: Maximum health-check attempts.
    required: false
    default: '20'
  migration-engine:
    description: none, goose, prisma, drizzle, or flyway.
    required: false
    default: none
  migration-working-directory:
    description: Migration component path; defaults to working-directory.
    required: false
    default: ''
  migration-path:
    description: Engine-specific migration directory, Prisma schema path, or Drizzle migrations directory. Empty uses the engine convention.
    required: false
    default: ''
  migration-config:
    description: Drizzle Kit config path relative to migration-working-directory.
    required: false
    default: drizzle.config.ts
  migration-package:
    description: Go package for migration-engine=go-command.
    required: false
    default: './cmd/migrate'
  migration-dialect:
    description: Goose database dialect.
    required: false
    default: postgres
  goose-version:
    description: Optional explicit Goose v3 version. Empty uses nearest go.mod pin, then goose-default-version.
    required: false
    default: ''
  goose-default-version:
    description: Goose fallback version when no explicit version or go.mod pin exists.
    required: false
    default: v3.28.0
  migration-package-manager:
    description: Prisma/Drizzle package manager (npm, pnpm, yarn, or bun).
    required: false
    default: ''
  migration-build-tool:
    description: Flyway build tool (gradle or maven).
    required: false
    default: gradle
  go-version:
    description: Deprecated compatibility input. Goose migration no longer requires a Go runtime.
    required: false
    default: stable
  node-version:
    description: Node.js version used by Prisma/Drizzle migration.
    required: false
    default: '24'
  java-version:
    description: Java version used by Flyway migration.
    required: false
    default: '17'
  state-root:
    description: Persistent deployment state root.
    required: false
    default: /var/lib/stacks
  caddyfile:
    description: Main Caddyfile importing generated sites.
    required: false
    default: /opt/stacks/shared/caddy/Caddyfile
  caddy-sites-directory:
    description: Directory imported by the main Caddyfile.
    required: false
    default: /opt/stacks/shared/caddy/sites

outputs:
  image:
    description: Built Docker image reference.
    value: ${{ steps.build.outputs.image }}
  image-id:
    description: Built Docker image ID.
    value: ${{ steps.build.outputs['image-id'] }}
  state-directory:
    description: Persistent deployment state directory.
    value: ${{ steps.previous.outputs['state-directory'] }}

runs:
  using: composite
  steps:
    - name: Validate deployment source
      uses: $/.github/actions/cd/guard
      with:
        environment: ${{ inputs.environment }}
        production-branch: ${{ inputs.production-branch }}
        development-branch: ${{ inputs.development-branch }}

    - name: Resolve repository deployment identity
      id: identity
      uses: $/.github/actions/cd/identity
      with:
        environment: ${{ inputs.environment }}
        network: ${{ inputs.network }}
        service: ${{ inputs.service-name }}
        image: ${{ inputs.image-name }}

    - name: Resolve requested database environment
      id: requested_env
      shell: bash
      env:
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        DATABASE: ${{ inputs.database }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        jq -e 'type=="array" and all(.[]; type=="string")' <<<"$ENV_NAMES_JSON" >/dev/null || { echo "::error::env-names-json must be a string array."; exit 1; }
        names="$(jq -c '.' <<<"$ENV_NAMES_JSON")"
        if [[ "$DATABASE" == "true" ]]; then names="$(jq -c '. + ["DATABASE_URL"] | unique' <<<"$names")"; fi
        echo "env_names_json=$names" >>"$GITHUB_OUTPUT"

    - name: Resolve database credentials
      id: credentials
      uses: $/.github/actions/cd/resolve-db-credentials
      with:
        environment: ${{ inputs.environment }}
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        credential-source: ${{ inputs.db-credential-source }}
        migration-engine: ${{ inputs.migration-engine }}
        env-names-json: ${{ steps.requested_env.outputs.env_names_json }}

    - name: Resolve runtime environment files
      id: runtime_env
      uses: $/.github/actions/cd/resolve-runtime-env-files
      with:
        environment: ${{ inputs.environment }}
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        env-files-json: ${{ inputs.env-files-json }}

    - name: Resolve deployment contract
      id: contract
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        MIGRATION_ENGINE: ${{ inputs.migration-engine }}
        MIGRATION_WORKING_DIRECTORY: ${{ inputs.migration-working-directory }}
        MIGRATION_PATH: ${{ inputs.migration-path }}
        MIGRATION_CONFIG: ${{ inputs.migration-config }}
        MIGRATION_PACKAGE: ${{ inputs.migration-package }}
        MIGRATION_PACKAGE_MANAGER: ${{ inputs.migration-package-manager }}
        MIGRATION_BUILD_TOOL: ${{ inputs.migration-build-tool }}
        DOMAIN_INPUT: ${{ inputs.domain }}
        DEPLOY_DOMAIN: ${{ steps.runtime_env.outputs['deploy-domain'] }}
        HEALTH_PATH: ${{ inputs.health-path }}
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        HOST_ENV_KEYS_JSON: ${{ steps.runtime_env.outputs.env-keys-json }}
      run: |
        set -euo pipefail
        case "$MIGRATION_ENGINE" in none|goose|go-command|prisma|drizzle|flyway) ;; *) echo "::error::migration-engine must be none, goose, go-command, prisma, drizzle, or flyway."; exit 1 ;; esac
        [[ "$HEALTH_PATH" == /* ]] || { echo "::error::health-path must start with '/'."; exit 1; }

        domain="$DOMAIN_INPUT"
        [[ -n "$domain" ]] || domain="$DEPLOY_DOMAIN"

        [[ "$domain" =~ ^[A-Za-z0-9*.-]+$ ]] || {
          echo "::error::DEPLOY_DOMAIN is required in the canonical deploy.env and must be a valid hostname."
          exit 1
        }

        case "$MIGRATION_ENGINE" in
          goose|go-command|prisma|drizzle)
            [[ -n "${DATABASE_URL:-}" ]] || {
              echo "::error::DATABASE_URL is required for migration but was not provided by GitHub Environment secrets or /opt/stacks/projects/${{ steps.identity.outputs.project }}/db.env."
              exit 1
            }
            ;;
          flyway)
            [[ -n "${FLYWAY_URL:-}" ]] || {
              echo "::error::FLYWAY_URL is required for migration but was not provided by GitHub Environment secrets or /opt/stacks/projects/${{ steps.identity.outputs.project }}/db.env."
              exit 1
            }
            ;;
        esac

        if [[ -n "$ENV_NAMES_JSON" && "$ENV_NAMES_JSON" != "[]" ]]; then
          command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_NAMES_JSON" >/dev/null || {
            echo "::error::env-names-json must be a JSON array of strings."
            exit 1
          }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$HOST_ENV_KEYS_JSON" >/dev/null || {
            echo "::error::resolved host env keys must be a JSON array of strings."
            exit 1
          }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid environment variable name '$name'."; exit 1; }
            if [[ -v "$name" ]]; then
              continue
            fi
            if jq -e --arg name "$name" 'index($name) != null' <<<"$HOST_ENV_KEYS_JSON" >/dev/null; then
              continue
            fi
            echo "::error::Environment variable '$name' is neither set on the caller deploy step nor present in the selected environment runtime config."
            exit 1
          done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")
        fi

        migration_working_directory="$MIGRATION_WORKING_DIRECTORY"
        [[ -n "$migration_working_directory" ]] || migration_working_directory="$WORKING_DIRECTORY"
        migration_path="$MIGRATION_PATH"
        case "$MIGRATION_ENGINE" in
          goose|go-command) [[ -n "$migration_path" ]] || migration_path="db/migrations" ;;
          prisma)
            [[ -n "$migration_path" ]] || migration_path="prisma/schema.prisma"
            case "$MIGRATION_PACKAGE_MANAGER" in npm|pnpm|yarn|bun) ;; *) echo "::error::Prisma migration requires migration-package-manager."; exit 1 ;; esac
            ;;
          drizzle)
            [[ -n "$migration_path" ]] || migration_path="drizzle"
            [[ -n "$MIGRATION_CONFIG" && "$MIGRATION_CONFIG" != /* && "$MIGRATION_CONFIG" != *$'\n'* && "$MIGRATION_CONFIG" != *$'\r'* ]] || {
              echo "::error::Drizzle migration-config must be a repository-relative path."
              exit 1
            }
            if [[ "$MIGRATION_CONFIG" == ".." || "$MIGRATION_CONFIG" == ../* || "$MIGRATION_CONFIG" == */../* || "$MIGRATION_CONFIG" == */.. ]]; then
              echo "::error::Drizzle migration-config must not contain '..' path traversal."
              exit 1
            fi
            case "$MIGRATION_PACKAGE_MANAGER" in npm|pnpm|yarn|bun) ;; *) echo "::error::Drizzle migration requires migration-package-manager."; exit 1 ;; esac
            ;;
          flyway)
            [[ -n "$migration_path" ]] || migration_path="src/main/resources/db/migration"
            case "$MIGRATION_BUILD_TOOL" in gradle|maven) ;; *) echo "::error::Flyway migration-build-tool must be gradle or maven."; exit 1 ;; esac
            ;;
        esac

        {
          echo "migration_working_directory=$migration_working_directory"
          echo "migration_path=$migration_path"
          echo "migration_config=$MIGRATION_CONFIG"
          echo "domain=$domain"
        } >>"$GITHUB_OUTPUT"

    - name: Merge container environment names
      id: container_env
      shell: bash
      env:
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        RESOLVED_ENV_NAMES_JSON: ${{ steps.credentials.outputs.resolved-env-names-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        caller_set='[]'
        while IFS= read -r name; do
          if [[ -v "$name" ]]; then
            caller_set="$(jq -c --arg name "$name" '. + [$name]' <<<"$caller_set")"
          fi
        done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")
        merged="$(jq -cn --argjson caller "$caller_set" --argjson resolved "$RESOLVED_ENV_NAMES_JSON" '$caller + $resolved | unique')"
        echo "env_names_json=$merged" >>"$GITHUB_OUTPUT"

    - name: Resolve Docker build arguments from runtime config
      id: build_args
      shell: bash
      env:
        STATIC_ARGS: ${{ inputs.build-args-json }}
        ENV_NAMES: ${{ inputs.build-arg-env-names-json }}
        ENV_FILES: ${{ steps.runtime_env.outputs.env-files-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$STATIC_ARGS" >/dev/null || { echo "::error::build-args-json must be a string array."; exit 1; }
        jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_NAMES" >/dev/null || { echo "::error::build-arg-env-names-json must be a string array."; exit 1; }
        merged="$(jq -c '.' <<<"$STATIC_ARGS")"
        while IFS= read -r name; do
          [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid build arg variable '$name'."; exit 1; }
          found=false
          value=""
          while IFS= read -r env_file; do
            line="$(grep -E "^[[:space:]]*$name=" "$env_file" | tail -n1 || true)"
            if [[ -n "$line" ]]; then
              value="${line#*=}"
              value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if (( ${#value} >= 2 )) && { [[ "${value:0:1}" == '"' && "${value: -1}" == '"' ]] || [[ "${value:0:1}" == "'" && "${value: -1}" == "'" ]]; }; then
                value="${value:1:${#value}-2}"
              fi
              found=true
            fi
          done < <(jq -r '.[]' <<<"$ENV_FILES")
          [[ "$found" == "true" ]] || { echo "::error::Build arg '$name' is not present in resolved runtime config."; exit 1; }
          merged="$(jq -c --arg item "$name=$value" '. + [$item]' <<<"$merged")"
        done < <(jq -r '.[]' <<<"$ENV_NAMES")
        echo "build_args_json=$merged" >>"$GITHUB_OUTPUT"

    - name: Read previous known-good deployment
      id: previous
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: read
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        root: ${{ inputs.state-root }}

    - name: Build deployment image
      id: build
      uses: $/.github/actions/cd/docker/build
      with:
        working-directory: ${{ inputs.working-directory }}
        dockerfile: ${{ inputs.dockerfile }}
        image-name: ${{ steps.identity.outputs.image }}
        target: ${{ inputs.target }}
        build-args-json: ${{ steps.build_args.outputs.build_args_json }}
        secret-env-names-json: ${{ inputs.build-secret-env-names-json }}

    - name: Apply Goose migrations
      if: inputs.migration-engine == 'goose'
      uses: $/.github/actions/cd/migration/goose
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        dialect: ${{ inputs.migration-dialect }}
        goose-version: ${{ inputs.goose-version }}
        default-version: ${{ inputs.goose-default-version }}

    - name: Apply Go command migrations
      if: inputs.migration-engine == 'go-command'
      uses: $/.github/actions/cd/migration/go-command
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        package: ${{ inputs.migration-package }}

    - name: Apply Prisma migrations
      if: inputs.migration-engine == 'prisma'
      uses: $/.github/actions/cd/migration/prisma
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        schema: ${{ steps.contract.outputs.migration_path }}
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.migration-package-manager }}

    - name: Apply Drizzle migrations
      if: inputs.migration-engine == 'drizzle'
      uses: $/.github/actions/cd/migration/drizzle
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        config: ${{ steps.contract.outputs.migration_config }}
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.migration-package-manager }}

    - name: Apply Flyway migrations
      if: inputs.migration-engine == 'flyway'
      uses: $/.github/actions/cd/migration/flyway
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        java-version: ${{ inputs.java-version }}
        build-tool: ${{ inputs.migration-build-tool }}

    - name: Deploy Docker service
      id: deploy
      uses: $/.github/actions/cd/docker/deploy
      with:
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        environment: ${{ inputs.environment }}
        container-name: ${{ steps.identity.outputs.service }}
        image: ${{ steps.build.outputs['image-id'] }}
        container-port: ${{ inputs.container-port }}
        env-files-json: ${{ steps.runtime_env.outputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json != '[]' && inputs.volumes-json || steps.runtime_env.outputs.deploy-volumes-json }}
        network: ${{ steps.identity.outputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}

    - name: Resolve rollback source
      id: rollback_source
      if: always() && steps.deploy.outcome == 'success'
      shell: bash
      env:
        STATE_EXISTS: ${{ steps.previous.outputs.exists }}
        STATE_REVISION: ${{ steps.previous.outputs.revision }}
        STATE_IMAGE: ${{ steps.previous.outputs.image }}
        STATE_IMAGE_ID: ${{ steps.previous.outputs['image-id'] }}
        LIVE_PREVIOUS_EXISTS: ${{ steps.deploy.outputs['previous-existed'] }}
        LIVE_PREVIOUS_IMAGE: ${{ steps.deploy.outputs['previous-image'] }}
        LIVE_PREVIOUS_IMAGE_ID: ${{ steps.deploy.outputs['previous-image-id'] }}
      run: |
        set -euo pipefail
        if [[ "$STATE_EXISTS" == "true" ]]; then
          {
            echo "exists=true"
            echo "persistent=true"
            echo "revision=$STATE_REVISION"
            echo "image=$STATE_IMAGE"
            echo "image_id=$STATE_IMAGE_ID"
          } >>"$GITHUB_OUTPUT"
        elif [[ "$LIVE_PREVIOUS_EXISTS" == "true" && -n "$LIVE_PREVIOUS_IMAGE_ID" ]]; then
          {
            echo "exists=true"
            echo "persistent=false"
            echo "revision="
            echo "image=$LIVE_PREVIOUS_IMAGE"
            echo "image_id=$LIVE_PREVIOUS_IMAGE_ID"
          } >>"$GITHUB_OUTPUT"
        else
          {
            echo "exists=false"
            echo "persistent=false"
            echo "revision="
            echo "image="
            echo "image_id="
          } >>"$GITHUB_OUTPUT"
        fi

    - name: Verify new service
      uses: $/.github/actions/cd/docker/health
      with:
        url: http://127.0.0.1:${{ steps.deploy.outputs['published-port'] }}${{ inputs.health-path }}
        attempts: ${{ inputs.health-attempts }}

    - name: Register Caddy route
      id: caddy
      uses: $/.github/actions/cd/caddy
      with:
        service-name: ${{ steps.identity.outputs.service }}
        domain: ${{ steps.contract.outputs.domain }}
        upstream: ${{ steps.identity.outputs.service }}:${{ inputs.container-port }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Record successful deployment
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ github.sha }}
        image: ${{ steps.build.outputs.image }}
        image-id: ${{ steps.build.outputs['image-id'] }}
        event: deploy
        root: ${{ inputs.state-root }}

    - name: Roll back previous known-good image after deployment failure
      id: rollback
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists == 'true'
      uses: $/.github/actions/cd/docker/deploy
      with:
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        environment: ${{ inputs.environment }}
        container-name: ${{ steps.identity.outputs.service }}
        image: ${{ steps.rollback_source.outputs.image_id }}
        container-port: ${{ inputs.container-port }}
        env-files-json: ${{ steps.runtime_env.outputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json != '[]' && inputs.volumes-json || steps.runtime_env.outputs.deploy-volumes-json }}
        network: ${{ steps.identity.outputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
        restore-previous-on-failure: 'false'

    - name: Verify rollback
      id: rollback_health
      if: failure() && steps.rollback.outcome == 'success'
      uses: $/.github/actions/cd/docker/health
      with:
        url: http://127.0.0.1:${{ steps.rollback.outputs['published-port'] }}${{ inputs.health-path }}
        attempts: ${{ inputs.health-attempts }}

    - name: Restore Caddy route after rollback
      id: rollback_caddy
      if: failure() && steps.rollback_health.outcome == 'success'
      uses: $/.github/actions/cd/caddy
      with:
        service-name: ${{ steps.identity.outputs.service }}
        domain: ${{ steps.contract.outputs.domain }}
        upstream: ${{ steps.identity.outputs.service }}:${{ inputs.container-port }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Record successful rollback
      if: failure() && steps.rollback_health.outcome == 'success' && steps.rollback_caddy.outcome == 'success' && steps.rollback_source.outputs.persistent == 'true'
      uses: $/.github/actions/cd/state
      with:
        environment: ${{ inputs.environment }}
        operation: record
        project: ${{ steps.identity.outputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ steps.rollback_source.outputs.revision }}
        image: ${{ steps.rollback_source.outputs.image }}
        image-id: ${{ steps.rollback_source.outputs.image_id }}
        event: rollback
        root: ${{ inputs.state-root }}

    - name: Remove Caddy route after failed first deployment
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists != 'true' && steps.caddy.outcome == 'success'
      uses: $/.github/actions/cd/caddy
      with:
        operation: remove
        service-name: ${{ steps.identity.outputs.service }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Remove failed first deployment
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists != 'true'
      shell: bash
      env:
        SERVICE_NAME: ${{ steps.identity.outputs.service }}
      run: docker rm -f "$SERVICE_NAME" >/dev/null 2>&1 || true
