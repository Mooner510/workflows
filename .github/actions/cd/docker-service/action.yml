name: Docker service deployment
description: Build, migrate, deploy, health-check, persist state, and register one API or Web Docker service with Caddy.

inputs:
  production-branch:
    description: Branch whose history is allowed to reach production.
    required: true
  project:
    description: Stable project identifier used for persistent deployment state.
    required: true
  working-directory:
    description: Service root relative to the caller repository.
    required: true
  service-name:
    description: Stable Docker container, state, and Caddy site name.
    required: true
  image-name:
    description: Local Docker image repository name without a tag.
    required: true
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  build-args-json:
    description: JSON array of non-secret Docker KEY=VALUE build arguments.
    required: false
    default: '[]'
  build-secret-env-names-json:
    description: JSON array of caller environment variable names exposed to Docker BuildKit as build secrets.
    required: false
    default: '[]'
  container-port:
    description: Internal application port.
    required: true
  host-port:
    description: Fixed loopback host port assigned to this service.
    required: true
  domain:
    description: Public hostname registered in Caddy.
    required: true
  db-credential-source:
    description: auto uses caller-provided database env vars first and falls back to /opt/stacks/projects/<project>/db.env for any missing value. github requires caller-provided values only.
    required: false
    default: auto
  env-files-json:
    description: JSON array of repository-relative Docker env-file paths for non-secret config only. Host stack paths such as db.env are not supported.
    required: false
    default: '[]'
  env-names-json:
    description: JSON array of environment variable names forwarded from the caller step env into the Docker container. DATABASE_URL is auto-resolved from host db.env when missing and migration or this list requires it.
    required: false
    default: '[]'
  volumes-json:
    description: JSON array of Docker volume specifications.
    required: false
    default: '[]'
  network:
    description: Optional Docker network name.
    required: false
    default: ''
  restart-policy:
    description: Docker restart policy.
    required: false
    default: unless-stopped
  init:
    description: Run Docker's built-in init process inside the container.
    required: false
    default: 'false'
  security-opts-json:
    description: JSON array of Docker --security-opt values.
    required: false
    default: '[]'
  cap-drop-json:
    description: JSON array of Linux capabilities to drop.
    required: false
    default: '[]'
  stop-timeout:
    description: Seconds allowed for graceful container stop.
    required: false
    default: '15'
  health-path:
    description: HTTP path checked on the loopback host port after deployment.
    required: false
    default: /health
  health-attempts:
    description: Maximum health-check attempts.
    required: false
    default: '20'
  migration-engine:
    description: none, goose, prisma, drizzle, or flyway.
    required: false
    default: none
  migration-working-directory:
    description: Migration component path; defaults to working-directory.
    required: false
    default: ''
  migration-path:
    description: Engine-specific migration directory, Prisma schema path, or Drizzle migrations directory. Empty uses the engine convention.
    required: false
    default: ''
  migration-dialect:
    description: Goose database dialect.
    required: false
    default: postgres
  goose-version:
    description: Optional explicit Goose v3 version. Empty uses nearest go.mod pin, then goose-default-version.
    required: false
    default: ''
  goose-default-version:
    description: Goose fallback version when no explicit version or go.mod pin exists.
    required: false
    default: v3.28.0
  migration-package-manager:
    description: Prisma/Drizzle package manager (npm, pnpm, yarn, or bun).
    required: false
    default: ''
  migration-build-tool:
    description: Flyway build tool (gradle or maven).
    required: false
    default: gradle
  go-version:
    description: Deprecated compatibility input. Goose migration no longer requires a Go runtime.
    required: false
    default: stable
  node-version:
    description: Node.js version used by Prisma/Drizzle migration.
    required: false
    default: '24'
  java-version:
    description: Java version used by Flyway migration.
    required: false
    default: '17'
  state-root:
    description: Persistent deployment state root.
    required: false
    default: /var/lib/stacks
  caddyfile:
    description: Main Caddyfile importing generated sites.
    required: false
    default: /opt/stacks/shared/caddy/Caddyfile
  caddy-sites-directory:
    description: Directory imported by the main Caddyfile.
    required: false
    default: /opt/stacks/shared/caddy/sites

outputs:
  image:
    description: Built Docker image reference.
    value: ${{ steps.build.outputs.image }}
  image-id:
    description: Built Docker image ID.
    value: ${{ steps.build.outputs['image-id'] }}
  state-directory:
    description: Persistent deployment state directory.
    value: ${{ steps.previous.outputs['state-directory'] }}

runs:
  using: composite
  steps:
    - name: Validate production deployment
      uses: $/.github/actions/cd/guard
      with:
        production-branch: ${{ inputs.production-branch }}

    - name: Resolve database credentials
      id: credentials
      uses: $/.github/actions/cd/resolve-db-credentials
      with:
        project: ${{ inputs.project }}
        credential-source: ${{ inputs.db-credential-source }}
        migration-engine: ${{ inputs.migration-engine }}
        env-names-json: ${{ inputs.env-names-json }}

    - name: Resolve deployment contract
      id: contract
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        MIGRATION_ENGINE: ${{ inputs.migration-engine }}
        MIGRATION_WORKING_DIRECTORY: ${{ inputs.migration-working-directory }}
        MIGRATION_PATH: ${{ inputs.migration-path }}
        MIGRATION_PACKAGE_MANAGER: ${{ inputs.migration-package-manager }}
        MIGRATION_BUILD_TOOL: ${{ inputs.migration-build-tool }}
        HOST_PORT: ${{ inputs.host-port }}
        HEALTH_PATH: ${{ inputs.health-path }}
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
      run: |
        set -euo pipefail
        case "$MIGRATION_ENGINE" in none|goose|prisma|drizzle|flyway) ;; *) echo "::error::migration-engine must be none, goose, prisma, drizzle, or flyway."; exit 1 ;; esac
        [[ "$HEALTH_PATH" == /* ]] || { echo "::error::health-path must start with '/'."; exit 1; }

        case "$MIGRATION_ENGINE" in
          goose|prisma|drizzle)
            [[ -n "${DATABASE_URL:-}" ]] || {
              echo "::error::DATABASE_URL is required for migration but was not provided by GitHub Environment secrets or /opt/stacks/projects/${{ inputs.project }}/db.env."
              exit 1
            }
            ;;
          flyway)
            [[ -n "${FLYWAY_URL:-}" ]] || {
              echo "::error::FLYWAY_URL is required for migration but was not provided by GitHub Environment secrets or /opt/stacks/projects/${{ inputs.project }}/db.env."
              exit 1
            }
            ;;
        esac

        if [[ -n "$ENV_NAMES_JSON" && "$ENV_NAMES_JSON" != "[]" ]]; then
          command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ENV_NAMES_JSON" >/dev/null || {
            echo "::error::env-names-json must be a JSON array of strings."
            exit 1
          }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid environment variable name '$name'."; exit 1; }
            [[ -v "$name" ]] || {
              echo "::error::Environment variable '$name' listed in env-names-json is not set on the caller deploy step. Provide it through GitHub Environment secrets or variables."
              exit 1
            }
          done < <(jq -r '.[]' <<<"$ENV_NAMES_JSON")
        fi

        migration_working_directory="$MIGRATION_WORKING_DIRECTORY"
        [[ -n "$migration_working_directory" ]] || migration_working_directory="$WORKING_DIRECTORY"
        migration_path="$MIGRATION_PATH"
        case "$MIGRATION_ENGINE" in
          goose) [[ -n "$migration_path" ]] || migration_path="db/migrations" ;;
          prisma)
            [[ -n "$migration_path" ]] || migration_path="prisma/schema.prisma"
            case "$MIGRATION_PACKAGE_MANAGER" in npm|pnpm|yarn|bun) ;; *) echo "::error::Prisma migration requires migration-package-manager."; exit 1 ;; esac
            ;;
          drizzle)
            [[ -n "$migration_path" ]] || migration_path="drizzle"
            case "$MIGRATION_PACKAGE_MANAGER" in npm|pnpm|yarn|bun) ;; *) echo "::error::Drizzle migration requires migration-package-manager."; exit 1 ;; esac
            ;;
          flyway)
            [[ -n "$migration_path" ]] || migration_path="src/main/resources/db/migration"
            case "$MIGRATION_BUILD_TOOL" in gradle|maven) ;; *) echo "::error::Flyway migration-build-tool must be gradle or maven."; exit 1 ;; esac
            ;;
        esac

        {
          echo "migration_working_directory=$migration_working_directory"
          echo "migration_path=$migration_path"
          echo "health_url=http://127.0.0.1:$HOST_PORT$HEALTH_PATH"
          echo "caddy_upstream=127.0.0.1:$HOST_PORT"
        } >>"$GITHUB_OUTPUT"

    - name: Merge container environment names
      id: container_env
      shell: bash
      env:
        ENV_NAMES_JSON: ${{ inputs.env-names-json }}
        RESOLVED_ENV_NAMES_JSON: ${{ steps.credentials.outputs.resolved-env-names-json }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo "::error::jq is required on the deployment runner."; exit 1; }
        merged="$(jq -cn --argjson caller "$ENV_NAMES_JSON" --argjson resolved "$RESOLVED_ENV_NAMES_JSON" '$caller + $resolved | unique')"
        echo "env_names_json=$merged" >>"$GITHUB_OUTPUT"

    - name: Read previous known-good deployment
      id: previous
      uses: $/.github/actions/cd/state
      with:
        operation: read
        project: ${{ inputs.project }}
        service: ${{ inputs.service-name }}
        root: ${{ inputs.state-root }}

    - name: Build production image
      id: build
      uses: $/.github/actions/cd/docker/build
      with:
        working-directory: ${{ inputs.working-directory }}
        dockerfile: ${{ inputs.dockerfile }}
        image-name: ${{ inputs.image-name }}
        target: ${{ inputs.target }}
        build-args-json: ${{ inputs.build-args-json }}
        secret-env-names-json: ${{ inputs.build-secret-env-names-json }}

    - name: Apply Goose migrations
      if: inputs.migration-engine == 'goose'
      uses: $/.github/actions/cd/migration/goose
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        dialect: ${{ inputs.migration-dialect }}
        goose-version: ${{ inputs.goose-version }}
        default-version: ${{ inputs.goose-default-version }}

    - name: Apply Prisma migrations
      if: inputs.migration-engine == 'prisma'
      uses: $/.github/actions/cd/migration/prisma
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        schema: ${{ steps.contract.outputs.migration_path }}
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.migration-package-manager }}

    - name: Apply Drizzle migrations
      if: inputs.migration-engine == 'drizzle'
      uses: $/.github/actions/cd/migration/drizzle
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        config: drizzle.config.ts
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.migration-package-manager }}

    - name: Apply Flyway migrations
      if: inputs.migration-engine == 'flyway'
      uses: $/.github/actions/cd/migration/flyway
      with:
        working-directory: ${{ steps.contract.outputs.migration_working_directory }}
        migrations-path: ${{ steps.contract.outputs.migration_path }}
        java-version: ${{ inputs.java-version }}
        build-tool: ${{ inputs.migration-build-tool }}

    - name: Deploy Docker service
      id: deploy
      uses: $/.github/actions/cd/docker/deploy
      with:
        container-name: ${{ inputs.service-name }}
        image: ${{ steps.build.outputs['image-id'] }}
        container-port: ${{ inputs.container-port }}
        host-port: ${{ inputs.host-port }}
        env-files-json: ${{ inputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json }}
        network: ${{ inputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}

    - name: Resolve rollback source
      id: rollback_source
      if: always() && steps.deploy.outcome == 'success'
      shell: bash
      env:
        STATE_EXISTS: ${{ steps.previous.outputs.exists }}
        STATE_REVISION: ${{ steps.previous.outputs.revision }}
        STATE_IMAGE: ${{ steps.previous.outputs.image }}
        STATE_IMAGE_ID: ${{ steps.previous.outputs['image-id'] }}
        LIVE_PREVIOUS_EXISTS: ${{ steps.deploy.outputs['previous-existed'] }}
        LIVE_PREVIOUS_IMAGE: ${{ steps.deploy.outputs['previous-image'] }}
        LIVE_PREVIOUS_IMAGE_ID: ${{ steps.deploy.outputs['previous-image-id'] }}
      run: |
        set -euo pipefail
        if [[ "$STATE_EXISTS" == "true" ]]; then
          {
            echo "exists=true"
            echo "persistent=true"
            echo "revision=$STATE_REVISION"
            echo "image=$STATE_IMAGE"
            echo "image_id=$STATE_IMAGE_ID"
          } >>"$GITHUB_OUTPUT"
        elif [[ "$LIVE_PREVIOUS_EXISTS" == "true" && -n "$LIVE_PREVIOUS_IMAGE_ID" ]]; then
          {
            echo "exists=true"
            echo "persistent=false"
            echo "revision="
            echo "image=$LIVE_PREVIOUS_IMAGE"
            echo "image_id=$LIVE_PREVIOUS_IMAGE_ID"
          } >>"$GITHUB_OUTPUT"
        else
          {
            echo "exists=false"
            echo "persistent=false"
            echo "revision="
            echo "image="
            echo "image_id="
          } >>"$GITHUB_OUTPUT"
        fi

    - name: Verify new service
      uses: $/.github/actions/cd/docker/health
      with:
        url: ${{ steps.contract.outputs.health_url }}
        attempts: ${{ inputs.health-attempts }}

    - name: Register Caddy route
      id: caddy
      uses: $/.github/actions/cd/caddy
      with:
        service-name: ${{ inputs.service-name }}
        domain: ${{ inputs.domain }}
        upstream: ${{ steps.contract.outputs.caddy_upstream }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Record successful deployment
      uses: $/.github/actions/cd/state
      with:
        operation: record
        project: ${{ inputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ github.sha }}
        image: ${{ steps.build.outputs.image }}
        image-id: ${{ steps.build.outputs['image-id'] }}
        event: deploy
        root: ${{ inputs.state-root }}

    - name: Roll back previous known-good image after deployment failure
      id: rollback
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists == 'true'
      uses: $/.github/actions/cd/docker/deploy
      with:
        container-name: ${{ inputs.service-name }}
        image: ${{ steps.rollback_source.outputs.image_id }}
        container-port: ${{ inputs.container-port }}
        host-port: ${{ inputs.host-port }}
        env-files-json: ${{ inputs.env-files-json }}
        env-names-json: ${{ steps.container_env.outputs.env_names_json }}
        volumes-json: ${{ inputs.volumes-json }}
        network: ${{ inputs.network }}
        restart-policy: ${{ inputs.restart-policy }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
        restore-previous-on-failure: 'false'

    - name: Verify rollback
      id: rollback_health
      if: failure() && steps.rollback.outcome == 'success'
      uses: $/.github/actions/cd/docker/health
      with:
        url: ${{ steps.contract.outputs.health_url }}
        attempts: ${{ inputs.health-attempts }}

    - name: Record successful rollback
      if: failure() && steps.rollback_health.outcome == 'success' && steps.rollback_source.outputs.persistent == 'true'
      uses: $/.github/actions/cd/state
      with:
        operation: record
        project: ${{ inputs.project }}
        service: ${{ inputs.service-name }}
        revision: ${{ steps.rollback_source.outputs.revision }}
        image: ${{ steps.rollback_source.outputs.image }}
        image-id: ${{ steps.rollback_source.outputs.image_id }}
        event: rollback
        root: ${{ inputs.state-root }}

    - name: Remove Caddy route after failed first deployment
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists != 'true' && steps.caddy.outcome == 'success'
      uses: $/.github/actions/cd/caddy
      with:
        operation: remove
        service-name: ${{ inputs.service-name }}
        caddyfile: ${{ inputs.caddyfile }}
        sites-directory: ${{ inputs.caddy-sites-directory }}

    - name: Remove failed first deployment
      if: failure() && steps.deploy.outcome == 'success' && steps.rollback_source.outputs.exists != 'true'
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
      run: docker rm -f "$SERVICE_NAME" >/dev/null 2>&1 || true
