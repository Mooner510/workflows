name: Docker process development
description: Canonical development entrypoint for workers and non-HTTP Docker processes deployed from validated dev-branch revisions with isolated resources.

inputs:
  development-branch:
    description: Development branch. Canonical default is dev.
    required: false
    default: dev
  working-directory:
    description: Docker build context relative to caller repository.
    required: true
  service-name:
    description: Stable container and deployment-state service name.
    required: true
  image-name:
    description: Local image repository name. Empty uses service-name.
    required: false
    default: ''
  dockerfile:
    description: Dockerfile relative to working-directory.
    required: false
    default: Dockerfile
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  database:
    description: Resolve and inject DATABASE_URL from canonical db.env.
    required: false
    default: 'false'
  volumes-json:
    description: Docker volume specs. Empty uses DEPLOY_VOLUMES_JSON from resolved runtime config.
    required: false
    default: '[]'
  readiness-command-json:
    description: Optional JSON command array executed with docker exec until ready.
    required: false
    default: '[]'
  readiness-jq:
    description: Optional jq expression evaluated against readiness command JSON output.
    required: false
    default: ''
  readiness-attempts:
    description: Maximum readiness attempts.
    required: false
    default: '20'
  init:
    description: Run Docker init.
    required: false
    default: 'true'
  security-opts-json:
    description: Docker security opts.
    required: false
    default: '["no-new-privileges:true"]'
  cap-drop-json:
    description: Capabilities to drop.
    required: false
    default: '["ALL"]'
  stop-timeout:
    description: Graceful stop timeout.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Resolve development process deployment
      id: contract
      shell: bash
      env:
        BRANCH_INPUT: ${{ inputs.development-branch }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        branch="$BRANCH_INPUT"
        [[ -n "$branch" ]] || branch=dev
        [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "::error::Development process deployment supports only push or workflow_dispatch events."; exit 1; }
        [[ "$GITHUB_REF" == "refs/heads/$branch" ]] || { echo "::error::Development process deployment only accepts '$branch'."; exit 1; }
        echo "branch=$branch" >>"$GITHUB_OUTPUT"

    - name: Checkout development revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}

    - name: Check development deployment flag
      id: development_gate
      uses: Mooner510/workflows/.github/actions/cd/development-enabled@v1
      with:
        service: ${{ inputs.service-name }}

    - name: Deploy development process
      if: steps.development_gate.outputs.enabled == 'true'
      uses: Mooner510/workflows/.github/actions/cd/docker-process@v1
      with:
        environment: dev
        operation: deploy
        development-branch: ${{ steps.contract.outputs.branch }}
        working-directory: ${{ inputs.working-directory }}
        service-name: ${{ inputs.service-name }}
        image-name: ${{ inputs.image-name }}
        dockerfile: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        database: ${{ inputs.database }}
        volumes-json: ${{ inputs.volumes-json }}
        readiness-command-json: ${{ inputs.readiness-command-json }}
        readiness-jq: ${{ inputs.readiness-jq }}
        readiness-attempts: ${{ inputs.readiness-attempts }}
        init: ${{ inputs.init }}
        security-opts-json: ${{ inputs.security-opts-json }}
        cap-drop-json: ${{ inputs.cap-drop-json }}
        stop-timeout: ${{ inputs.stop-timeout }}
