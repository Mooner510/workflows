name: Deploy entrypoint
description: Validate production source and execute a repository-owned deployment script.

inputs:
  working-directory:
    description: Component root relative to the caller repository.
    required: true
  production-branch:
    description: Branch whose history is allowed to reach production, for example master or main.
    required: true
  script:
    description: Deployment script relative to the component root.
    required: false
    default: .ci/deploy.sh
  arguments-json:
    description: JSON array of non-secret string arguments passed to the deployment script.
    required: false
    default: '[]'

runs:
  using: composite
  steps:
    - name: Validate production source and deployment script
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        DEPLOY_SCRIPT: ${{ inputs.script }}
        ARGUMENTS_JSON: ${{ inputs.arguments-json }}
      run: |
        set -euo pipefail

        command -v git >/dev/null || { echo "::error::git is required on the self-hosted runner."; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required on the self-hosted runner."; exit 1; }
        command -v base64 >/dev/null || { echo "::error::base64 is required on the self-hosted runner."; exit 1; }

        if ! git check-ref-format --branch "$PRODUCTION_BRANCH" >/dev/null 2>&1; then
          echo "::error::Invalid production-branch '$PRODUCTION_BRANCH'."
          exit 1
        fi

        if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ARGUMENTS_JSON" >/dev/null; then
          echo "::error::arguments-json must be a JSON array of strings."
          exit 1
        fi

        case "$GITHUB_EVENT_NAME" in
          workflow_dispatch)
            if [[ "$GITHUB_REF" != "refs/heads/$PRODUCTION_BRANCH" ]]; then
              echo "::error::Manual production deployment must be dispatched from branch '$PRODUCTION_BRANCH'."
              exit 1
            fi
            ;;
          release)
            action="$(jq -r '.action // empty' "$GITHUB_EVENT_PATH")"
            draft="$(jq -r '.release.draft // true' "$GITHUB_EVENT_PATH")"
            prerelease="$(jq -r '.release.prerelease // true' "$GITHUB_EVENT_PATH")"
            tag="$(jq -r '.release.tag_name // empty' "$GITHUB_EVENT_PATH")"

            if [[ "$action" != "published" ]] || [[ "$draft" != "false" ]] || [[ "$prerelease" != "false" ]]; then
              echo "::error::Production release deployment requires a published, non-draft, non-prerelease GitHub Release."
              exit 1
            fi
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Production release tag must match vMAJOR.MINOR.PATCH."
              exit 1
            fi
            ;;
          *)
            echo "::error::Production deployment is allowed only from workflow_dispatch or a stable published release."
            exit 1
            ;;
        esac

        production_ref="refs/remotes/origin/$PRODUCTION_BRANCH"
        if ! git show-ref --verify --quiet "$production_ref"; then
          echo "::error::Production branch '$PRODUCTION_BRANCH' is not available locally. Checkout with fetch-depth: 0 before deployment."
          exit 1
        fi

        deployment_sha="$(git rev-parse HEAD)"
        if ! git merge-base --is-ancestor "$deployment_sha" "$production_ref"; then
          echo "::error::Checked-out commit '$deployment_sha' is not contained in production branch '$PRODUCTION_BRANCH'."
          exit 1
        fi

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        component="$(realpath -e "$GITHUB_WORKSPACE/$WORKING_DIRECTORY" 2>/dev/null || true)"

        if [[ -z "$component" ]] || { [[ "$component" != "$workspace" ]] && [[ "$component" != "$workspace/"* ]]; }; then
          echo "::error::working-directory must resolve inside the caller repository."
          exit 1
        fi

        if [[ -z "$DEPLOY_SCRIPT" ]] || [[ "$DEPLOY_SCRIPT" == /* ]] || [[ "$DEPLOY_SCRIPT" == ".." || "$DEPLOY_SCRIPT" == ../* || "$DEPLOY_SCRIPT" == */../* || "$DEPLOY_SCRIPT" == */.. ]]; then
          echo "::error::script must be a safe path relative to the component."
          exit 1
        fi

        script="$(realpath -e "$component/$DEPLOY_SCRIPT" 2>/dev/null || true)"
        if [[ -z "$script" ]] || [[ "$script" != "$component/"* ]] || [[ ! -f "$script" ]]; then
          echo "::error::Deployment script '$DEPLOY_SCRIPT' must be a file inside the component."
          exit 1
        fi

        args=()
        while IFS= read -r encoded; do
          args+=("$(printf '%s' "$encoded" | base64 --decode)")
        done < <(jq -r '.[] | @base64' <<<"$ARGUMENTS_JSON")

        cd "$component"
        bash "$script" "${args[@]}"
